name: Export PlatformIO offline toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - build/muti-ssd2677-v1.2.4-ci
    paths:
      - '.github/workflows/export-platformio-offline.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-platformio-offline.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: build/muti-ssd2677-v1.2.4-ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check 'platformio==6.1.18'

      - name: Reconstruct known-good v1.2.3 project
        shell: bash
        run: |
          set -euo pipefail
          BASE='ci/muti-ssd2677-v1.2.0'
          OUT='/tmp/muti-v123'
          mkdir -p "$OUT"
          cat "$BASE/source.part00" "$BASE/source.part01" "$BASE/source.part02" \
              "$BASE/source.fix03a" "$BASE/source.fix03b" \
              "$BASE/source.fix04a" "$BASE/source.fix04b" \
              "$BASE/source.fix05a" "$BASE/source.fix05b" > /tmp/project_v120.b64
          base64 --decode /tmp/project_v120.b64 > /tmp/project_v120.tar.gz
          echo 'ba99bcdc325f54d4bbe2e745ce208f255cee66e5961620c12cfeb281d52b8329  /tmp/project_v120.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/project_v120.tar.gz -C "$OUT"
          cp -a "$BASE/overrides/." "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.0/"
          python ci/muti-ssd2677-v1.2.1/apply_v121.py "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.0"
          mv "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.0" "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.1"
          python ci/muti-ssd2677-v1.2.2/apply_v122.py "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.1"
          mv "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.1" "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.2"
          base64 --decode ci/muti-ssd2677-v1.2.3/v123.patch.gz.b64 > /tmp/v123.patch.gz
          echo '7731a9d0f243d1c90f9276ea3f811faf4748d06fc0378be0c02327bf7713ef2e  /tmp/v123.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/v123.patch.gz > /tmp/v123.patch
          echo 'c91caf9ecbeb875b15c68541d4b265bbcaf187c612a3a2bb52a92d45bfecc226  /tmp/v123.patch' | sha256sum --check --strict
          cd "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.2"
          patch --batch --forward -p1 < /tmp/v123.patch || true
          for critical in include/app_config.h src/main.cpp web/index.html tools/make_release.py tools/validate_project.py; do
            test ! -f "${critical}.rej" || { cat "${critical}.rej"; exit 1; }
          done
          cd -
          mv "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.2" "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.3"
          python "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.3/tools/embed_web.py"

      - name: Download and verify ESP32-C3 toolchain packages
        working-directory: /tmp/muti-v123/Muti-SSD2677-LocalWeb-C3-v1.2.3
        run: |
          python -m platformio run -e c3_promini_usb
          python -m platformio run -e c3_promini_uart

      - name: Export offline compiler bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/wheelhouse
          python -m pip download --disable-pip-version-check --dest export/wheelhouse 'platformio==6.1.18'
          tar -C "$HOME/.platformio" -czf export/platformio-home.tar.gz .
          cat > export/README.txt <<'EOF'
          Offline PlatformIO bundle for Linux x86_64.
          Python: 3.11
          PlatformIO: 6.1.18
          Espressif32 platform: 6.9.0
          Arduino-ESP32: 2.0.17
          Includes ESP32-C3 compiler, esptool and framework packages.
          EOF
          sha256sum export/platformio-home.tar.gz export/wheelhouse/* > export/SHA256SUMS.txt

      - name: Upload offline compiler bundle
        uses: actions/upload-artifact@v4
        with:
          name: platformio-offline-esp32c3-6.9.0
          path: export/*
          if-no-files-found: error
          retention-days: 7
