name: Build Muti SSD2677 v1.2.2

on:
  workflow_dispatch:
  push:
    branches:
      - build/muti-ssd2677-v1.2.2-ci
    paths:
      - 'ci/muti-ssd2677-v1.2.2/**'
      - '.github/workflows/muti-ssd2677-v1.2.2.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/muti-ssd2677-v1.2.2/**'
      - '.github/workflows/muti-ssd2677-v1.2.2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: build/muti-ssd2677-v1.2.2-ci

      - name: Reconstruct v1.2.0 and apply v1.2.1/v1.2.2 patches
        shell: bash
        run: |
          set -euo pipefail
          BASE='ci/muti-ssd2677-v1.2.0'
          OUT='ci/muti-ssd2677-v1.2.2/work'
          mkdir -p "$OUT"
          cat "$BASE/source.part00" "$BASE/source.part01" "$BASE/source.part02" \
              "$BASE/source.fix03a" "$BASE/source.fix03b" \
              "$BASE/source.fix04a" "$BASE/source.fix04b" \
              "$BASE/source.fix05a" "$BASE/source.fix05b" > /tmp/project_v120.b64
          base64 --decode /tmp/project_v120.b64 > /tmp/project_v120.tar.gz
          echo 'ba99bcdc325f54d4bbe2e745ce208f255cee66e5961620c12cfeb281d52b8329  /tmp/project_v120.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/project_v120.tar.gz -C "$OUT"
          cp -a "$BASE/overrides/." "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.0/"
          python ci/muti-ssd2677-v1.2.1/apply_v121.py "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.0"
          mv "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.0" "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.1"
          python ci/muti-ssd2677-v1.2.2/apply_v122.py "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.1"
          mv "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.1" "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.2"
          rm -rf "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.2/.pio"
          rm -f "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.2/firmware/"*
          python "$OUT/Muti-SSD2677-LocalWeb-C3-v1.2.2/tools/embed_web.py"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check 'platformio==6.1.18'

      - name: Structural validation
        working-directory: ci/muti-ssd2677-v1.2.2/work/Muti-SSD2677-LocalWeb-C3-v1.2.2
        run: python tools/validate_project.py

      - name: Compile USB-CDC build
        working-directory: ci/muti-ssd2677-v1.2.2/work/Muti-SSD2677-LocalWeb-C3-v1.2.2
        run: python -m platformio run -e c3_promini_usb

      - name: Compile UART build
        working-directory: ci/muti-ssd2677-v1.2.2/work/Muti-SSD2677-LocalWeb-C3-v1.2.2
        run: python -m platformio run -e c3_promini_uart

      - name: Produce flash images
        working-directory: ci/muti-ssd2677-v1.2.2/work/Muti-SSD2677-LocalWeb-C3-v1.2.2
        run: python tools/make_release.py --env c3_promini_usb

      - name: Package complete release
        shell: bash
        run: |
          set -euo pipefail
          cd ci/muti-ssd2677-v1.2.2/work
          rm -rf Muti-SSD2677-LocalWeb-C3-v1.2.2/.pio
          zip -qr Muti-SSD2677-LocalWeb-C3-v1.2.2.zip Muti-SSD2677-LocalWeb-C3-v1.2.2
          sha256sum Muti-SSD2677-LocalWeb-C3-v1.2.2.zip > Muti-SSD2677-LocalWeb-C3-v1.2.2.zip.sha256

      - name: Upload complete program package
        uses: actions/upload-artifact@v4
        with:
          name: Muti-SSD2677-LocalWeb-C3-v1.2.2
          path: |
            ci/muti-ssd2677-v1.2.2/work/Muti-SSD2677-LocalWeb-C3-v1.2.2.zip
            ci/muti-ssd2677-v1.2.2/work/Muti-SSD2677-LocalWeb-C3-v1.2.2.zip.sha256
            ci/muti-ssd2677-v1.2.2/work/Muti-SSD2677-LocalWeb-C3-v1.2.2/firmware/*
          if-no-files-found: error
          retention-days: 14
