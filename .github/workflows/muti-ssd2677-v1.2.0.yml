name: Build Muti SSD2677 v1.2.0

on:
  workflow_dispatch:
  push:
    branches:
      - build/muti-ssd2677-v1.2.0-ci
    paths:
      - 'ci/muti-ssd2677-v1.2.0/**'
      - '.github/workflows/muti-ssd2677-v1.2.0.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci/muti-ssd2677-v1.2.0/**'
      - '.github/workflows/muti-ssd2677-v1.2.0.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: build/muti-ssd2677-v1.2.0-ci

      - name: Reconstruct exact source archive
        shell: bash
        run: |
          set -euo pipefail
          cd ci/muti-ssd2677-v1.2.0
          cat source.part00 source.part01 source.part02 \
              source.fix03a source.fix03b \
              source.fix04a source.fix04b \
              source.fix05a source.fix05b > project.b64
          base64 --decode project.b64 > project_v120.tar.gz
          echo 'ba99bcdc325f54d4bbe2e745ce208f255cee66e5961620c12cfeb281d52b8329  project_v120.tar.gz' | sha256sum --check --strict
          mkdir -p work
          tar -xzf project_v120.tar.gz -C work
          cp -a overrides/. work/Muti-SSD2677-LocalWeb-C3-v1.2.0/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check 'platformio==6.1.18'

      - name: Structural validation
        working-directory: ci/muti-ssd2677-v1.2.0/work/Muti-SSD2677-LocalWeb-C3-v1.2.0
        run: python tools/validate_project.py

      - name: Compile USB-CDC build
        working-directory: ci/muti-ssd2677-v1.2.0/work/Muti-SSD2677-LocalWeb-C3-v1.2.0
        run: python -m platformio run -e c3_promini_usb

      - name: Compile UART build
        working-directory: ci/muti-ssd2677-v1.2.0/work/Muti-SSD2677-LocalWeb-C3-v1.2.0
        run: python -m platformio run -e c3_promini_uart

      - name: Produce flash images
        working-directory: ci/muti-ssd2677-v1.2.0/work/Muti-SSD2677-LocalWeb-C3-v1.2.0
        run: python tools/make_release.py --env c3_promini_usb

      - name: Package complete release
        shell: bash
        run: |
          set -euo pipefail
          cd ci/muti-ssd2677-v1.2.0/work
          zip -qr Muti-SSD2677-LocalWeb-C3-v1.2.0.zip Muti-SSD2677-LocalWeb-C3-v1.2.0
          sha256sum Muti-SSD2677-LocalWeb-C3-v1.2.0.zip > Muti-SSD2677-LocalWeb-C3-v1.2.0.zip.sha256

      - name: Upload complete program package
        uses: actions/upload-artifact@v4
        with:
          name: Muti-SSD2677-LocalWeb-C3-v1.2.0
          path: |
            ci/muti-ssd2677-v1.2.0/work/Muti-SSD2677-LocalWeb-C3-v1.2.0.zip
            ci/muti-ssd2677-v1.2.0/work/Muti-SSD2677-LocalWeb-C3-v1.2.0.zip.sha256
            ci/muti-ssd2677-v1.2.0/work/Muti-SSD2677-LocalWeb-C3-v1.2.0/firmware/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified outputs to branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          OUT='ci/muti-ssd2677-v1.2.0/output'
          SRC='ci/muti-ssd2677-v1.2.0/work'
          rm -rf "$OUT"
          mkdir -p "$OUT/firmware"
          cp "$SRC/Muti-SSD2677-LocalWeb-C3-v1.2.0.zip" "$OUT/"
          cp "$SRC/Muti-SSD2677-LocalWeb-C3-v1.2.0.zip.sha256" "$OUT/"
          cp "$SRC/Muti-SSD2677-LocalWeb-C3-v1.2.0/firmware/"* "$OUT/firmware/"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "$OUT/CI_BUILD_UTC.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT"
          git commit -m 'ci: publish verified SSD2677 v1.2.0 build' || exit 0
          git push origin HEAD:build/muti-ssd2677-v1.2.0-ci
