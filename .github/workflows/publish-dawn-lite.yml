name: Build dawn lesson lightweight HTML
on:
  push:
    branches: [publish/dawn-lite-20261107]
    paths: ['_publish/dawn/build.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image build dependencies
        run: python -m pip install --no-deps 'Pillow==11.3.0' 'basemap-data==2.0.0'
      - name: Preserve current catalog updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Build and validate single HTML and catalog entry
        run: python _publish/dawn/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-lite-verified
          path: |
            六上3.4谁先迎来黎明/index.html
            六上3.4谁先迎来黎明/README.md
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified output and remove temporary build inputs
        run: |
          git rm _publish/dawn/part*.txt _publish/dawn/build.py
          git add '六上3.4谁先迎来黎明/index.html' '六上3.4谁先迎来黎明/README.md' index.html lesson-levels.js
          git commit -m 'feat: publish dawn v2.2 standalone lesson under 1 MB'
          git push origin HEAD:publish/dawn-lite-20261107
