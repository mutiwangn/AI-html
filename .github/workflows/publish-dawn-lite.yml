name: Build dawn lesson lightweight HTML
on:
  push:
    branches: [publish/dawn-lite-20261107]
    paths: ['_publish/dawn/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.3.0'
      - name: Build and check standalone HTML
        run: python _publish/dawn/build.py
      - name: Store verified HTML on staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '六上3.4谁先迎来黎明/index.html'
          if ! git diff --cached --quiet; then
            git commit -m 'build: produce dawn v2.2 standalone HTML under 1 MB'
            git push
          fi
