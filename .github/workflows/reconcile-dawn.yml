name: Reconcile dawn publication catalog
on:
  push:
    branches: [publish/dawn-lite-20261107]
    paths: ['_publish/dawn/reconcile.py']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main while preserving its catalog additions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python _publish/dawn/reconcile.py
          git rm _publish/dawn/reconcile.py
          git add index.html lesson-levels.js
          git commit -m 'fix: preserve concurrent main catalog additions in dawn publication'
          git push origin HEAD:publish/dawn-lite-20261107
