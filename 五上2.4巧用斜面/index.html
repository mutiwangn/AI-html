<header class="head"><h1 class="brand">巧用斜面<span>五上 2.4</span></h1><nav class="nav" aria-label="学习场景"><button id="gameTab" class="active" aria-selected="true">装车挑战</button><button id="lifeTab" aria-selected="false">生活中的斜面</button></nav><div class="utilities"><button id="fullBtn" aria-label="切换全屏">全屏</button><button id="aboutBtn">说明</button></div></header>
<main>
<section id="gamePage" class="page current"><div class="stage"><canvas id="gameCanvas" aria-label="手推车装货游戏，可拖动黄色坡脚改变坡道，点击货堆装货，点击手推车减少货物。所有操作也有按钮。"></canvas><div class="stageTop"><div class="goal">把货物送上货车<small id="subGoal">24 箱货物，方法由你决定</small></div><div class="delivered"><span id="delivered">0</span><span style="font-size:.5em;color:#b3c6d3"> / 24</span><small>已装上货车</small></div></div><div class="stageFooter"><div id="message" class="message" role="status">点击货堆装货 · 拖动黄色坡脚搭坡</div><div id="distance" class="measure">已走 0.0 米</div></div></div>
<aside class="panel"><h2 id="panelTitle">你的装车方案</h2><div class="block"><div class="row"><span class="label">本次装货</span><span class="mini">每箱 5 kg</span></div><div class="stepper"><button id="less" aria-label="减少一箱">−</button><div class="number"><span id="loadCount">4</span><small>箱</small></div><button id="more" aria-label="增加一箱">＋</button></div></div>
<div class="block divider"><div class="route"><button id="straight" class="active">直坡</button><button id="folded">折返坡</button></div><div class="row"><label class="label" for="run">前后占地</label><strong id="runOut">2.4 m</strong></div><input id="run" class="range" type="range" min="1.4" max="6.4" value="2.4" step="0.1"><div class="row mini"><span id="routeInfo">坡长 2.68 m</span><span id="angle">坡角 27°</span></div><div id="widthInfo" class="mini">侧向占地约 1 m</div></div>
<div class="block divider"><div class="row"><span id="forceLabel" class="label">最大所需推力</span><span class="mini" id="capacityOut">能力 160 N</span></div><div class="row"><div id="force" class="forceNum">141<small style="font-size:.44em"> N</small></div><span id="effort" class="mini">能推上去</span></div><div class="gauge"><div id="forceBar" class="gaugeFill"></div><i class="limitMark" title="用力能力上限"></i></div></div>
<div class="block actionBlock"><button id="action" class="primary push">按住推上去</button><div class="actionRow"><button id="back" class="secondary" disabled>按住后退</button><button id="compare" class="secondary">比较记录 <span id="recordCount">0</span></button></div><div class="mini desktopOnly">松手自动刹车 · 空格键也能推车</div></div>
<div class="bottom block"><div class="taskWrap"><label class="mini" for="task">换一种挑战</label><select id="task" class="taskSelect"><option value="open">自由装车 · 用力 160 N</option><option value="weak">小力气搬运 · 用力 110 N</option><option value="tight">狭窄场地 · 前后最多 2.2 m</option></select></div><button id="restart" class="secondary">重新装车</button><button id="modelBtn" class="detail">模拟数据与安全说明</button></div></aside></section>
<section id="lifePage" class="page lifePage"><div class="stage"><canvas id="lifeCanvas" aria-label="生活中的变形斜面互动"></canvas></div><aside id="lifeControls" class="panel"></aside></section>
</main>
<div id="modal" class="modalShade" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><header><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭">✕</button></header><div id="modalBody"></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
(function(){'use strict';
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.from(document.querySelectorAll(s))};
var CFG={total:24,crateKg:5,cartKg:10,g:9.8,height:1.2,rolling:.035,maxLoad:8};
var tasks={open:{cap:160,maxRun:6.4,sub:'24 箱货物，方法由你决定'},weak:{cap:110,maxRun:6.4,sub:'力气变小了，怎样完成同样的任务？'},tight:{cap:160,maxRun:2.2,sub:'前后只有 2.2 米，侧向空间仍可使用'}};
var state={page:'game',task:'open',run:2.4,route:'straight',load:4,stock:20,delivered:0,pos:0,returning:false,hold:0,travel:0,trips:0,records:[],lastRecord:'',t:0,completed:false,compared:false};
var canvas=$('#gameCanvas'),ctx=canvas.getContext('2d'),view={w:1200,h:700,s:100,ox:0,oy:0};var last=0,dirty=true,lifeMounted=false,toastTimer,focusBefore;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function round(v,n){var k=Math.pow(10,n||0);return Math.round(v*k)/k}function fmt(v){return v.toFixed(1)}
function routeNodes(){var x=7.9-state.run,h=CFG.height;if(state.route==='straight')return [{x:x,z:0,y:0},{x:7.9,z:0,y:h}];return [{x:x,z:-2.3,y:0},{x:7.9,z:-2.3,y:h/3},{x:7.9,z:-1.15,y:h/3},{x:x,z:-1.15,y:2*h/3},{x:x,z:0,y:2*h/3},{x:7.9,z:0,y:h}]}
function routeData(){var n=routeNodes(),parts=[],total=0;for(var i=1;i<n.length;i++){var a=n[i-1],b=n[i],dx=b.x-a.x,dz=b.z-a.z,dy=b.y-a.y,len=Math.hypot(dx,dz,dy);parts.push({a:a,b:b,len:len,start:total,theta:Math.atan2(dy,Math.hypot(dx,dz))});total+=len}return{nodes:n,parts:parts,length:total}}
function mass(){return CFG.cartKg+state.load*CFG.crateKg}function maxForce(){var h=CFG.height/(state.route==='folded'?3:1),theta=Math.atan2(h,state.run);return mass()*CFG.g*(Math.sin(theta)+CFG.rolling*Math.cos(theta))}function brakeForce(){var h=CFG.height/(state.route==='folded'?3:1),theta=Math.atan2(h,state.run);return Math.max(0,mass()*CFG.g*(Math.sin(theta)-CFG.rolling*Math.cos(theta)))}
function pointAt(pos){var data=routeData(),d=clamp(pos,0,data.length),seg=data.parts[data.parts.length-1];for(var i=0;i<data.parts.length;i++)if(d<=data.parts[i].start+data.parts[i].len+.0001){seg=data.parts[i];break}var u=clamp((d-seg.start)/seg.len,0,1);return{x:seg.a.x+(seg.b.x-seg.a.x)*u,y:seg.a.y+(seg.b.y-seg.a.y)*u,z:seg.a.z+(seg.b.z-seg.a.z)*u,seg:seg}}
function atBase(){return state.pos<.0001&&!state.returning}function atTop(){return state.pos>=routeData().length-.0001}function conserved(){return state.load+state.stock+state.delivered===CFG.total}
function project(x,y,z){return{x:view.ox+(x+z*.54)*view.s,y:view.oy-(y+z*.24)*view.s}}
function resize(){var r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);view.w=r.width;view.h=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);view.s=Math.min(r.width/13.8,r.height/5.9);view.ox=(r.width-13.8*view.s)/2+1.6*view.s;view.oy=r.height*.70;dirty=true;draw();if(lifeMounted&&window.InclineLife)window.InclineLife.resize()}
function poly(points,fill,stroke,width){ctx.beginPath();points.forEach(function(p,i){if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width||1;ctx.stroke()}}
function line(a,b,color,w,dash){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.stroke();ctx.setLineDash([])}
function rr(x,y,w,h,r,fill,stroke,strokeWidth){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=strokeWidth||1.5;ctx.stroke()}}
function text(t,x,y,size,color,align){ctx.font='700 '+size+'px "Microsoft YaHei",system-ui,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=color||'#e9f5fb';ctx.fillText(t,x,y)}
function box(x,y,z,w,h,d,c){var a=project(x,y,z),b=project(x+w,y,z),cc=project(x+w,y+h,z),dd=project(x,y+h,z),e=project(x,y+h,z+d),f=project(x+w,y+h,z+d),g=project(x+w,y,z+d);poly([a,b,cc,dd],c[0],c[3]||null);poly([dd,cc,f,e],c[1]);poly([b,g,f,cc],c[2]);}
