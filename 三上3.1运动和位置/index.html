function evaluateNode(index){

  function syncPlay() {
    setText(el.play, state.running ? 'Ⅱ 暂停' : state.time >= 6 ? '↻ 重播' : '▶ 开始');
    el.play.setAttribute('aria-label', state.running ? '暂停观察' : state.time >= 6 ? '重新观察' : '开始观察');
  }
  function renderTrace() {
    var start = positionAt(state.selected, 0), now = positionAt(state.selected, state.time);
    el.evidence.setAttribute('visibility', state.trace ? 'visible' : 'hidden');
    if (!state.trace) return;
    el['origin-line'].setAttribute('x2', start.x);
    el['origin-line'].setAttribute('y2', start.y);
    el['now-line'].setAttribute('x2', now.x);
    el['now-line'].setAttribute('y2', now.y);
    el['now-line'].setAttribute('stroke', colors[state.selected]);
    el.trail.setAttribute('stroke', colors[state.selected]);
    var path = 'M' + start.x + ' ' + start.y;
    if (state.selected === 'dog' && state.time > 0) {
      path += 'A185 185 0 0 1 ' + now.x + ' ' + now.y;
    } else if (state.selected === 'car') {
      path += 'L' + now.x + ' ' + now.y;
    }
    el.trail.setAttribute('d', path);
    el.ghost.setAttribute('transform', 'translate(' + start.x + ' ' + start.y + ')' + (state.selected === 'dog' ? ' rotate(-90)' : ''));
    var art = '#m-' + state.selected + '-art';
    el['ghost-use'].setAttribute('href', art);
    el['ghost-use'].setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', art);
    el['start-dot'].setAttribute('cx', start.x);
    el['start-dot'].setAttribute('cy', start.y);
  }
  function render() {
    var car = positionAt('car', state.time), dog = positionAt('dog', state.time);
    targets.car.setAttribute('transform', 'translate(' + car.x + ' ' + car.y + ')');
    targets.dog.setAttribute('transform', 'translate(' + dog.x + ' ' + dog.y + ')');
    el['dog-pose'].setAttribute('transform', 'rotate(' + (-90 + 180 * state.time / 6) + ')');
    var start = positionAt(state.selected, 0), now = positionAt(state.selected, state.time);
    setText(el.time, state.time.toFixed(1));
    el.timeline.value = state.time;
    el.timeline.setAttribute('aria-valuetext', state.time.toFixed(1) + '秒');
    setText(el['before-direction'], directionFromPole(start));
    setText(el['now-direction'], directionFromPole(now));
    setText(el['before-distance'], distanceFromPole(start).toFixed(1));
    setText(el['now-distance'], distanceFromPole(now).toFixed(1));
    renderTrace();
  }
  function select(name) {
    state.selected = name;
    for (var key in targets) {
      if (Object.prototype.hasOwnProperty.call(targets, key)) {
        targets[key].setAttribute('class', 'm-target' + (key === name ? ' is-selected' : ''));
        targets[key].setAttribute('aria-pressed', key === name ? 'true' : 'false');
      }
    }
    setText(el['selected-name'], names[name]);
    clearAnswer();
    render();
  }
  function pause() {
    state.running = false;
    if (frame) caf(frame);
    frame = 0;
    lastTime = 0;
    syncPlay();
  }
  function tick(now) {
    frame = 0;
    if (!state.running || !state.active) return;
    if (!lastTime) lastTime = now;
    var dt = clamp((now - lastTime) / 1000, 0, 0.05);
    lastTime = now;
    state.time = Math.min(6, state.time + dt);
    render();
    if (state.time >= 6) {
      pause();
    } else {
      frame = raf(tick);
    }
  }
  function play() {
    if (state.running) { pause(); return; }
    if (state.time >= 6) {
      state.time = 0;
      clearAnswer();
      render();
    }
    state.active = true;
    state.running = true;
    lastTime = 0;
    syncPlay();
    frame = raf(tick);
  }
  function reset() {
    pause();
    state.time = 0;
    state.trace = false;
    el.trace.setAttribute('aria-pressed', 'false');
    setText(el.trace, '显示轨迹');
    clearAnswer();
    render();
    syncPlay();
  }
  function answer(moving) {
    pause();
    if (state.time < 0.4) {
      feedback('wait', '▶', '先播放，或拖动时间');
      return;
    }
    var actual = state.selected !== 'bench';
    state.answer = moving;
    el['answer-moving'].className = 'btn' + (moving ? ' chosen' : '');
    el['answer-still'].className = 'btn' + (!moving ? ' chosen' : '');
    if (moving === actual) {
      feedback('correct', '✓', state.selected === 'dog' ? '距离相同，方向变了' : actual ? '位置发生变化' : '位置没有变化');
    } else {
      feedback('retry', '↺', actual ? '再比一比开始和现在的位置' : '与旗杆的位置变了吗？');
    }
    state.trace = true;
    el.trace.setAttribute('aria-pressed', 'true');
    setText(el.trace, '隐藏轨迹');
    renderTrace();
  }
  function listenTarget(name) {
    var node = targets[name];
    node.addEventListener('click', function () { select(name); });
    node.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ' || event.keyCode === 13 || event.keyCode === 32) {
        event.preventDefault();
        select(name);
      }
    });
  }
  listenTarget('car'); listenTarget('dog'); listenTarget('bench');
  el.play.addEventListener('click', play);
  el.reset.addEventListener('click', reset);
  el.timeline.addEventListener('input', function () {
    pause();
    state.time = clamp(Number(el.timeline.value), 0, 6);
    clearAnswer();
    render();
    syncPlay();
  });
  el.trace.addEventListener('click', function () {
    state.trace = !state.trace;
    el.trace.setAttribute('aria-pressed', state.trace ? 'true' : 'false');
    setText(el.trace, state.trace ? '隐藏轨迹' : '显示轨迹');
    renderTrace();
  });
  el['answer-moving'].addEventListener('click', function () { answer(true); });
  el['answer-still'].addEventListener('click', function () { answer(false); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
  window.MotionPage = {
    activate: function () { state.active = true; render(); },
    deactivate: function () { state.active = false; pause(); },
    reset: reset,
    positionAt: positionAt,
    getState: function () { return { time: state.time, running: state.running, active: state.active, selected: state.selected, trace: state.trace, answer: state.answer }; }
  };
  render();
  syncPlay();
}());

window.LessonApp.init();
</script>
</body>
</html>
