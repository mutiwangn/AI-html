<svg id="ins-electronic-svg" class="ins-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="group" aria-label="流量式电子肺活量计：气体从个人吹嘴通过开放的测量管，检测信号传到屏幕累计体积" hidden="hidden">
  <defs>
    <linearGradient id="ins-meter-body" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#ffffff"/><stop offset=".56" stop-color="#f4f8f9"/><stop offset="1" stop-color="#d6e4e8"/></linearGradient>
    <linearGradient id="ins-meter-rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eff6f7"/><stop offset="1" stop-color="#afc5ce"/></linearGradient>
    <linearGradient id="ins-meter-side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6e5e9"/><stop offset="1" stop-color="#aac4ce"/></linearGradient>
    <linearGradient id="ins-meter-tube" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".22" stop-color="#edf8f9"/><stop offset=".55" stop-color="#cbe5e9"/><stop offset=".81" stop-color="#e5f3f5"/><stop offset="1" stop-color="#a8cbd4"/></linearGradient>
    <linearGradient id="ins-meter-bore" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8cb5bf"/><stop offset=".48" stop-color="#dceff1"/><stop offset="1" stop-color="#f5fbfc"/></linearGradient>
    <linearGradient id="ins-meter-mouth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#f5fafb"/><stop offset="1" stop-color="#cee1e6"/></linearGradient>
    <linearGradient id="ins-meter-lcd" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5eae3"/><stop offset=".55" stop-color="#edf7f2"/><stop offset="1" stop-color="#dcefe8"/></linearGradient>
    <linearGradient id="ins-meter-screen-rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8eafb5"/><stop offset="1" stop-color="#e8f1f1"/></linearGradient>
    <radialGradient id="ins-meter-sensor-glow"><stop stop-color="#03a0a3" stop-opacity=".45"/><stop offset=".6" stop-color="#03a0a3" stop-opacity=".13"/><stop offset="1" stop-color="#03a0a3" stop-opacity="0"/></radialGradient>
    <radialGradient id="ins-meter-shadow"><stop stop-color="#95aeb8" stop-opacity=".25"/><stop offset="1" stop-color="#95aeb8" stop-opacity="0"/></radialGradient>
  </defs>

  <text x="450" y="70" text-anchor="middle" class="ins-svg-prompt">气体流过，体积逐步累计</text>
  <ellipse cx="508" cy="475" rx="298" ry="24" fill="url(#ins-meter-shadow)"/>

  <!-- The feet, lower rim and sloping casing give the device a stable physical form. -->
  <rect x="335" y="445" width="49" height="20" rx="7" fill="#7e9ca6"/>
  <rect x="678" y="445" width="49" height="20" rx="7" fill="#7e9ca6"/>
  <path d="M345 239Q347 219 370 219H689Q717 219 728 246L773 425Q780 454 746 460H316Q282 455 290 428Z" fill="url(#ins-meter-rim)" stroke="#89aab7" stroke-width="3"/>
  <path d="M696 222Q719 226 728 246L773 425Q780 454 746 460L739 438Z" fill="url(#ins-meter-side)"/>
  <path d="M345 235Q349 214 371 214H687Q713 214 723 242L759 415Q766 440 739 443H322Q296 440 303 417Z" fill="url(#ins-meter-body)" stroke="#9bb8c2" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M366 226H685Q702 226 708 244" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M313 426Q322 433 342 433H731" fill="none" stroke="#c1d3d9" stroke-width="2"/>
  <path d="M750 426L758 449" fill="none" stroke="#8cabb6" stroke-width="1.5"/>
  <g fill="#a9c0c8" stroke="#91aeb9" stroke-width="1"><circle cx="333" cy="421" r="3.5"/><circle cx="728" cy="421" r="3.5"/></g>
  <path d="M331 421H335M726 421H730" stroke="#eff5f6" stroke-width="1.4"/>

  <!-- The sensor is mounted above the display, with a distinct warm-coloured signal route. -->
  <path d="M393 232V249Q393 258 403 258H422Q432 258 432 249V232" fill="#d8e7eb" stroke="#8fafbb" stroke-width="2.5"/>
  <path d="M402 237V252H423" fill="none" stroke="#fff" stroke-width="2.5"/>
  <path d="M411 234V249H706Q721 249 721 265V290H689" fill="none" stroke="#d9b886" stroke-width="3" stroke-linejoin="round"/>
  <path id="ins-electronic-signal-flow" d="M411 234V249H706Q721 249 721 265V290H689" fill="none" stroke="#c88b3d" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="3 10" opacity="0"/>
  <path d="m695 284-7 6 7 6" fill="none" stroke="#c88b3d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="753" y="273" text-anchor="middle" font-size="20" fill="#ab7a3e" font-weight="600">信号</text>

  <!-- Recessed LCD: existing animated number and progress coordinates are retained. -->
  <rect x="346" y="267" width="349" height="151" rx="19" fill="url(#ins-meter-screen-rim)" stroke="#8faeb7" stroke-width="1.5"/>
  <rect x="353" y="275" width="335" height="137" rx="14" fill="url(#ins-meter-lcd)" stroke="#afc9c5" stroke-width="2"/>
  <path d="M367 282H675" fill="none" stroke="#fff" stroke-width="2" opacity=".72" stroke-linecap="round"/>
  <text x="520" y="306" text-anchor="middle" class="ins-svg-small" fill="#5a7b74">本次呼气体积</text>
  <text id="ins-electronic-value" x="507" y="376" text-anchor="middle" class="ins-electronic-reading">—</text>
  <text x="642" y="376" class="ins-svg-unit">mL</text>
  <path d="M375 395H665" fill="none" stroke="#b4cec5" stroke-width="5" stroke-linecap="round"/>
  <path id="ins-electronic-progress" d="M375 395H375" fill="none" stroke="#00888b" stroke-width="5" stroke-linecap="round"/>

  <!-- Personal mouthpiece. The elliptical dark inner wall represents an open bore. -->
  <path d="M122 174H231L267 181V215L231 222H122Z" fill="url(#ins-meter-mouth)" stroke="#9ebdc7" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M142 181H230L256 186" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <path d="M153 177V219M161 177V219M169 177V219" fill="none" stroke="#c5dbe1" stroke-width="2"/>
  <ellipse cx="122" cy="198" rx="17" ry="24" fill="#e0edf0" stroke="#90b2bf" stroke-width="2.5"/>
  <ellipse cx="122" cy="198" rx="10.5" ry="17.5" fill="url(#ins-meter-bore)" stroke="#9cbfc8" stroke-width="1.5"/>

  <!-- Continuous measurement passage with a clear observation window; no sensor technology is implied. -->
  <rect x="263" y="159" width="286" height="78" rx="25" fill="url(#ins-meter-tube)" stroke="#719ca9" stroke-width="3"/>
  <path d="M287 168H525" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".92"/>
  <path d="M285 229H527" fill="none" stroke="#8eb9c4" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <rect x="281" y="181" width="251" height="34" rx="10" fill="url(#ins-meter-bore)" stroke="#9ec6ce" stroke-width="1.4"/>
  <path d="M294 187H519" fill="none" stroke="#e5f7f7" stroke-width="2" opacity=".8"/>
  <path d="M274 174V222M539 173V222" fill="none" stroke="#aac9d1" stroke-width="3"/>
  <g id="ins-electronic-sensor-pulse" opacity=".18"><ellipse cx="411" cy="198" rx="52" ry="54" fill="url(#ins-meter-sensor-glow)"/></g>
  <path d="M390 170V226M432 170V226" fill="none" stroke="#58969d" stroke-width="5" opacity=".65"/>
  <path d="M390 173H432M390 223H432" fill="none" stroke="#89b5bc" stroke-width="3"/>

  <!-- The outlet is a second hollow opening, not a closed cap. -->
  <path d="M549 174H628V222H549Z" fill="url(#ins-meter-tube)" stroke="#92b6c1" stroke-width="2.5"/>
  <path d="M550 180H620" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M555 216H620" fill="none" stroke="#b2d1d9" stroke-width="2"/>
  <ellipse cx="628" cy="198" rx="17" ry="24" fill="#dbecef" stroke="#86adba" stroke-width="2.5"/>
  <ellipse cx="628" cy="198" rx="10.5" ry="17.5" fill="url(#ins-meter-bore)" stroke="#8db4bf" stroke-width="1.5"/>
  <path d="M654 198H704m-11-9 11 9-11 9" fill="none" stroke="#2b949a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M66 198H93m-10-8 10 8-10 8" fill="none" stroke="#2b949a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="ins-electronic-flow" d="M105 198H704" fill="none" stroke="#008b91" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="7 17" opacity="0"/>
  <text x="173" y="267" text-anchor="middle" font-size="22" fill="#3f818c" font-weight="600">气体流过</text>

  <!-- These outlines become visible only when a matching part is selected. -->
  <g class="ins-part-highlight" data-ins-focus="electronic-0" opacity="0" pointer-events="none"><path d="M121 165H234L275 175V222L234 231H121Q96 230 96 198Q96 166 121 165Z" fill="#edb85b" fill-opacity=".07" stroke="#d79a42" stroke-width="3"/></g>
  <g class="ins-part-highlight" data-ins-focus="electronic-1" opacity="0" pointer-events="none"><rect x="376" y="151" width="70" height="94" rx="17" fill="#edb85b" fill-opacity=".07" stroke="#d79a42" stroke-width="3"/></g>
  <g class="ins-part-highlight" data-ins-focus="electronic-2" opacity="0" pointer-events="none"><rect x="338" y="260" width="365" height="166" rx="23" fill="#edb85b" fill-opacity=".045" stroke="#d79a42" stroke-width="3"/></g>

  <g data-ins-hotspot="electronic-0" id="ins-electronic-hot-0" class="ins-hotspot" role="button" tabindex="0" aria-label="查看独立吹嘴"><path d="M168 149V165" fill="none" stroke="#8fb9bf" stroke-width="2"/><circle cx="168" cy="127" r="48" class="ins-hit"/><circle cx="168" cy="127" r="22"/><text x="168" y="135">1</text></g>
  <g data-ins-hotspot="electronic-1" id="ins-electronic-hot-1" class="ins-hotspot" role="button" tabindex="0" aria-label="查看流量感应部件"><path d="M411 149V159" fill="none" stroke="#8fb9bf" stroke-width="2"/><circle cx="411" cy="127" r="48" class="ins-hit"/><circle cx="411" cy="127" r="22"/><text x="411" y="135">2</text></g>
  <g data-ins-hotspot="electronic-2" id="ins-electronic-hot-2" class="ins-hotspot" role="button" tabindex="0" aria-label="查看显示与累计"><path d="M773 333H704" fill="none" stroke="#8fb9bf" stroke-width="2"/><circle cx="795" cy="333" r="48" class="ins-hit"/><circle cx="795" cy="333" r="22"/><text x="795" y="341">3</text></g>
  <text x="450" y="526" text-anchor="middle" class="ins-svg-small">流量式原理示意 · 具体构造因仪器而异</text>
</svg>
