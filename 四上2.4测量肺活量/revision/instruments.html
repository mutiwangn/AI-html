<section id="page-instruments" class="page instruments-page" aria-label="简易测量仪器" hidden>
  <header class="ins-heading">
    <h2>一口气，可以怎样测？</h2>
    <div class="ins-device-switch" role="group" aria-label="选择测量仪器">
      <button id="ins-choose-water" type="button" data-ins-device="water" class="ins-selected" aria-pressed="true">排水式</button>
      <button id="ins-choose-bag" type="button" data-ins-device="bag" aria-pressed="false">测量袋</button>
      <button id="ins-choose-electronic" type="button" data-ins-device="electronic" class="ins-electronic-choice" aria-pressed="false">电子仪对照</button>
    </div>
  </header>
  <div class="ins-main">
    <div class="ins-stage">
      <div class="ins-scene">
        <!--__WATER_SCENE__-->
        <!--__BAG_SCENE__-->
        <!--__ELECTRONIC_SCENE__-->
        <button id="ins-reset" type="button" class="icon-button ins-reset" aria-label="重置当前仪器" title="重置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></svg></button>
      </div>
      <p id="ins-conclusion" class="ins-conclusion" aria-live="polite">收集气体占据的空间，可以用排出的水来表示。</p>
    </div>
    <aside class="ins-controls" aria-label="仪器说明与演示">
      <div class="ins-instruction">
        <div class="ins-detail-heading"><h3 id="ins-title">排水式肺活量仪</h3><button id="ins-close-detail" type="button" class="icon-button" aria-label="收起部件说明" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <p id="ins-description">瓶内先灌满水并倒置。尽力吸气后，一口气吹入，等水面稳定再读数。</p>
        <p id="ins-hotspot-hint" class="ins-hotspot-hint">点图中的 1、2、3，看看关键部件。</p>
      </div>
      <div class="ins-volume-control">
        <label for="ins-volume">演示气量</label>
        <div class="ins-volume-value"><output id="ins-volume-value" for="ins-volume">2250</output><span>mL</span></div>
        <input type="range" id="ins-volume" min="250" max="4500" step="250" value="2250" aria-label="演示气量，250至4500毫升">
        <div class="ins-range-labels"><span>250</span><span>4500</span></div>
      </div>
      <div class="ins-action"><button id="ins-start" type="button" class="primary">开始演示</button><p id="ins-status" aria-live="polite">先观察：气体从哪里进入，水从哪里排出？</p></div>
    </aside>
  </div>
</section>
