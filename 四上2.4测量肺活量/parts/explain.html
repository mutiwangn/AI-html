  <aside class="le-controls" aria-label="排水演示控制">
    <div class="le-volume-control">
      <label for="le-volume">这次演示呼出的气量</label>
      <div class="le-volume-value"><output id="le-volume-output" for="le-volume">2250</output><span>mL</span></div>
      <input type="range" id="le-volume" min="250" max="4500" step="250" value="2250" aria-label="演示气量，250到4500毫升"/>
      <div class="le-range-ends"><span>250</span><span>4500</span></div>
    </div>
    <div class="le-action-block">
      <button type="button" id="le-start" class="le-primary">开始排水</button>
      <button type="button" id="le-reset" class="le-secondary">重新装满水</button>
    </div>
    <div class="le-explain-block">
      <button type="button" id="le-explain" class="le-secondary" disabled>说说你的解释</button>
      <p id="le-control-hint">先看完一次，再一起解释。</p>
    </div>
    <div class="le-plan-entry">
      <p>联系生活</p>
      <button type="button" id="le-plan-open" class="le-text-button">坚持运动，怎样验证？ <span aria-hidden="true">↗</span></button>
    </div>
    <p class="le-model-note">这是原理演示。真实测量要使用器材，不能用吹气时间换算毫升。</p>

<div id="le-plan-modal" class="le-modal" hidden>
  <div class="le-modal-backdrop" data-le-close="1"></div>
  <section class="le-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="le-plan-title" tabindex="-1">
    <button type="button" id="le-plan-close" class="le-modal-close" aria-label="关闭探究方案">×</button>
    <h2 id="le-plan-title">怎样观察坚持运动后的变化？</h2>
    <p class="le-plan-lead">选择一个方案，关注同一个人的前后变化。</p>
    <div class="le-plan-fields">
      <label>运动项目<select id="le-plan-sport"><option value="快走">快走</option><option value="跳绳">跳绳</option><option value="慢跑">慢跑</option><option value="自己喜欢的适量运动">自己喜欢的运动</option></select></label>
      <label>持续观察<select id="le-plan-weeks"><option value="4">4 周</option><option value="6">6 周</option><option value="8">8 周</option></select></label>
    </div>
    <fieldset class="le-plan-checks"><legend>测量时，哪些条件要保持一致？</legend>
      <label><input type="checkbox" id="le-check-person" checked/>同一个人</label>
      <label><input type="checkbox" id="le-check-device" checked/>同一种器材与方法</label>
      <label><input type="checkbox" id="le-check-rest" checked/>休息后，呼吸平静时</label>
    </fieldset>
    <button type="button" id="le-plan-generate" class="le-primary">形成我们的探究方案</button>
    <p id="le-plan-result" class="le-plan-result" aria-live="polite" hidden></p>
    <p class="le-plan-caution">结果可能受身高、生长、遗传和操作等因素影响。持续观察能提供线索，不能只凭一次比较认定原因。</p>
  </section>
