<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007f82"><meta name="description" content="四上2.4测量肺活量：测量袋操作、三次实测取最大值、班级点状图和排水法解释。支持离线与局域网课堂。">
<title>四上2.4 测量肺活量｜互动实验室 v1.0</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="app">
<header class="topbar">
  <h1>测量肺活量</h1>
  <nav class="main-nav" aria-label="课堂页面">
    <button class="nav-tab active" data-page="measure" aria-current="page">学会测量</button>
    <button class="nav-tab" data-page="records">记录比较</button>
    <button class="nav-tab" data-page="explain">解释与应用</button>
  </nav>
  <div class="top-actions"><button id="classroom-btn" class="plain-button" aria-label="课堂连接与设置"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3.5" width="18" height="13" rx="1.5"/><path d="m8 21 2-4.5m6 4.5-2-4.5"/></svg><span id="classroom-label">课堂</span><i id="connection-dot" hidden></i></button><button id="fullscreen-btn" class="plain-button" aria-label="全屏展示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6m6 0h6v6M3 15v6h6m6 0h6v-6"/></svg><span>全屏</span></button></div>
</header>
<main id="main">
<section id="page-measure" class="page measure-page" aria-label="学会测量肺活量">
 <div class="measure-stage">
  <div class="measure-visual">
   <svg id="measure-svg" class="measure-svg" viewBox="0 0 1000 530" role="img" aria-label="肺活量测量袋操作演示：刻度从封闭的右端向开口的左端增大">
    <defs>
     <linearGradient id="bag-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d1edf0" stop-opacity=".5"/><stop offset=".28" stop-color="#fff" stop-opacity=".35"/><stop offset=".7" stop-color="#bfe5e8" stop-opacity=".36"/><stop offset="1" stop-color="#87c6ca" stop-opacity=".42"/></linearGradient>
     <linearGradient id="lung-fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5c4ae"/><stop offset="1" stop-color="#e79580"/></linearGradient>
     <linearGradient id="roll-fill"><stop stop-color="#adcbd0"/><stop offset=".4" stop-color="#f2f9f9"/><stop offset="1" stop-color="#98bbc0"/></linearGradient>
     <radialGradient id="body-fill"><stop stop-color="#f1f7f9"/><stop offset="1" stop-color="#deedf2" stop-opacity=".45"/></radialGradient>
     <filter id="soft-shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="6"/></filter>
     <marker id="air-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9" fill="none" stroke="#299cad" stroke-width="1.8"/></marker>
    </defs>
    <ellipse cx="580" cy="412" rx="339" ry="17" fill="#c2d2d6" opacity=".26" filter="url(#soft-shadow)"/>
    <g id="person" transform="translate(35,0)">
     <path d="M94 102C69 111 40 116 28 146L8 251M117 102c29 11 54 16 67 44l23 105M94 87v24m23-24v24M45 139l-7 120h134l-8-120" fill="url(#body-fill)" stroke="#bfd4de" stroke-width="2.4" stroke-linecap="round"/>
     <path d="M78 52c-1-30 17-46 38-40 24 6 25 23 23 35l10 18-13 4v13c-2 14-17 21-35 10L87 78Z" fill="#e8f2f6" stroke="#bfd4de" stroke-width="2"/>
     <path d="M130 69h-19v51" fill="none" stroke="#5ea7b4" stroke-width="11" stroke-linecap="round"/>
     <path d="M130 69h-19v51" fill="none" stroke="#cbe6ea" stroke-width="5" stroke-linecap="round"/>
     <g id="lungs" style="transform-origin:110px 170px">
      <path d="M100 125c-13-16-36 0-40 25-6 25-5 51-3 70 11 13 39 8 45-6 4-20 3-56-2-89Z" fill="url(#lung-fill)" stroke="#d9907f" stroke-width="1.7"/>
      <path d="M121 125c15-16 36 0 41 25 6 25 5 51 3 70-11 13-39 8-45-6-4-20-3-56 1-89Z" fill="url(#lung-fill)" stroke="#d9907f" stroke-width="1.7"/>
      <path d="M110 118v16m0 0-28 26m28-26 28 26M83 159l-7 29m7-29 7 24m48-24 8 29m-8-29-8 24M77 184l-10 17m23-20 4 24m52-19 10 15m-26-20-4 24" fill="none" stroke="#6aabb7" stroke-width="3.2" stroke-linecap="round"/>
      <g fill="#fff" opacity=".72"><circle cx="73" cy="172" r="3"/><circle cx="86" cy="197" r="3.5"/><circle cx="143" cy="172" r="3"/><circle cx="145" cy="210" r="3.5"/><circle cx="69" cy="214" r="3"/><circle cx="131" cy="199" r="3"/></g>
     </g>
     <path id="breath-arrow" d="M216 65Q178 47 154 62" fill="none" stroke="#299cad" stroke-width="5" stroke-linecap="round" marker-end="url(#air-arrow)" opacity="0"/>
     <text id="breath-label" x="110" y="287" text-anchor="middle" fill="#637b85" font-size="23">先排空袋子</text>
    </g>
    <g id="tube">
     <path id="tube-line" d="M173 70C282 65 224 204 208 248Q181 310 256 326" stroke="#9dbfc9" stroke-width="14" fill="none" stroke-linecap="round"/>
     <path d="M173 70C282 65 224 204 208 248Q181 310 256 326" stroke="#e8f3f5" stroke-width="8" fill="none" stroke-linecap="round"/>
     <path id="flow-path" d="M173 70C282 65 224 204 208 248Q181 310 256 326" stroke="#3eb2bb" stroke-width="4" stroke-dasharray="3 19" fill="none" opacity="0"/>
    </g>
    <g id="bag" aria-hidden="true">
     <path id="bag-shape" d="M250 322Q263 314 280 314L928 314Q943 317 943 330Q944 345 928 348L280 348Q263 347 250 338Z" fill="url(#bag-fill)" stroke="#93b6bf" stroke-width="2.4"/>
     <path id="bag-highlight" d="M290 323H925" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="6"/>
     <path id="bag-bottom" d="M940 320v24" fill="none" stroke="#91aeb7" stroke-width="5"/>
     <g id="bag-wrinkles" fill="none" stroke="#9dbdc5" stroke-opacity=".45" stroke-width="1.6"><path d="m290 316 30 30 54-28 60 29 67-27 57 28 62-30 57 28 64-28 57 28 59-30 54 29"/></g>
     <g id="bag-scale"></g>
     <g id="gas-dots" fill="#45b4bf" opacity="0"></g>
    </g>
    <g id="roll-group" opacity="0">
     <rect id="rolled-flat" x="250" y="320" width="30" height="19" rx="5" fill="#eef5f6" stroke="#b9ced3" stroke-width="2"/>
     <g id="roll-cylinder"><rect x="267" y="281" width="23" height="99" rx="11" fill="url(#roll-fill)" stroke="#8dafb7" stroke-width="2"/><ellipse cx="278.5" cy="281" rx="11.5" ry="7" fill="#dcebed" stroke="#8dafb7" stroke-width="2"/><path d="m273 281q5-5 9 0t-9 0" fill="none" stroke="#8dafb7" stroke-width="1.5"/></g>
     <path id="seal-clip" d="M262 314h29v17h-29Z" fill="#ee9e48" stroke="#bf742d" stroke-width="2"/>
    </g>
    <g id="read-marker" opacity="0"><path id="read-line" d="M610 261V408" stroke="#e2943f" stroke-width="3" stroke-dasharray="6 5"/><path id="read-triangle" d="m602 253 8 12 8-12" fill="#e2943f"/></g>
    <g id="roll-drag" tabindex="0" role="slider" aria-label="向充气方向卷袋" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" opacity="0" style="cursor:grab;touch-action:none"><rect x="244" y="430" width="160" height="57" rx="28" fill="#fff3de" stroke="#e8b878" stroke-width="2"/><path d="M264 459h30m-8-9 9 9-9 9" fill="none" stroke="#a86c24" stroke-width="3"/><text x="341" y="467" text-anchor="middle" font-size="23" font-weight="600" fill="#895619">向右卷</text></g>
    <text id="stage-caption" x="570" y="228" text-anchor="middle" font-size="30" font-weight="600" fill="#637b85">把原有空气排出去</text>
    <text id="demo-note" x="951" y="510" text-anchor="end" font-size="18" fill="#7b9097">操作示意 · 刻度以实物为准</text>
   </svg>
   <button id="measure-replay" class="stage-replay" aria-label="重置测量演示" title="重置演示"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></svg></button>
  </div>
  <div id="measure-steps" class="step-track" aria-label="测量步骤"><button data-step="0" class="current"><i></i><span>排空</span></button><button data-step="1"><i></i><span>深吸气</span></button><button data-step="2"><i></i><span>一次呼出</span></button><button data-step="3"><i></i><span>封口卷袋</span></button><button data-step="4"><i></i><span>读数</span></button></div>
 </div>
 <aside class="measure-control side-control">
  <div><h2 id="measure-title">排空袋内空气</h2><p id="measure-instruction">把测量袋压平，排出原有空气，再插入通气管。</p></div>
  <div id="reading-panel" class="reading-panel" hidden><span>袋内气体体积</span><button id="read-answer" class="read-answer">？<small>mL</small></button><p id="reading-feedback" aria-live="polite">看清每一小格，再来读数。</p><button id="scale-zoom" class="text-button">放大刻度</button></div>
  <div class="measure-actions"><button id="measure-action" class="primary">开始测量<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button><button id="mistakes-btn" class="secondary">找找操作问题</button><p id="measure-tip" class="micro-note">两人合作，使用各自的吹嘴。</p></div>
 </aside>
</section>
<section id="page-records" class="page records-page" hidden aria-label="记录并比较真实肺活量数据">
 <div class="record-toolbar"><div class="group-controls"><label for="group-select">第</label><select id="group-select" aria-label="选择小组"></select><span>组</span><button id="group-manage" class="small-button" aria-label="增减小组">＋ / −</button></div><div class="record-mode" id="record-mode">本机记录</div><div class="record-tools"><button id="records-export" class="small-button">导出</button><button id="records-more" class="small-button" aria-label="记录工具">更多</button></div></div>
 <div class="record-main">
  <div class="record-sheet">
   <div class="sheet-heading"><h2>测三次，取最大值</h2><p>一次呼气 · 密封读数 · 间隔休息</p></div>
   <div class="record-table-wrap"><table class="record-table"><thead><tr><th>组员</th><th>第1次</th><th>第2次</th><th>第3次</th><th>最大值</th></tr></thead><tbody id="record-rows"></tbody></table></div>
   <div class="sheet-bottom"><button id="add-member" class="text-button">＋ 添加组员</button><span>单位：mL</span><button id="rest-timer" class="small-button">休息计时</button></div>
  </div>
  <aside class="class-evidence">
   <div class="chart-heading"><h2>我们班的测量</h2><span id="completed-count">0 人完成</span></div>
   <div class="chart-area"><svg id="class-chart" viewBox="0 0 650 380" role="img" aria-label="全班三次有效测量的最大值点状图"></svg><div id="chart-empty" class="chart-empty"><svg viewBox="0 0 96 70"><path d="M9 6v55h79M29 47v-9m20 9V25m20 22V13"/><circle cx="29" cy="29" r="5"/><circle cx="49" cy="16" r="5"/><circle cx="69" cy="5" r="5"/></svg><p>让真实数据<br>出现在这里</p></div></div>
   <div id="chart-summary" class="chart-summary">每个点，代表一位同学的测量结果。</div>
   <div class="chart-actions"><button id="activity-view" class="secondary">看看运动习惯</button><button id="standards-btn" class="text-button">教材参考值</button></div>
  </aside>
 </div>
 <div id="record-status" class="record-status" aria-live="polite">点击空格录入实测值；点击组员查看照片与点评。</div>
</section>
<!--__EXPLAIN_HTML__-->
</main>
<footer class="bottom-bar"><p id="footer-text">尽力吸气后，一次尽力呼出的气体体积。</p><button id="teacher-notes" class="watermark" title="教师说明">mutiw</button></footer>
</div>
<div id="modal-backdrop" class="modal-backdrop" hidden><section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-button" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="modal-body" class="modal-body"></div></section></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<input id="import-input" type="file" accept="application/json,.json" hidden>
<noscript><div class="noscript">请启用浏览器的 JavaScript，再打开测量肺活量互动实验室。</div></noscript>
<script>/*__CORE_JS__*/</script>
<script>/*__EXPLAIN_JS__*/</script>
</body></html>
