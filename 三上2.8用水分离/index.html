    el('p3-rail-title').textContent=finished?'水去，盐留':'观察盐田';
    var saltText=el('p3-salt-material'),waterText=el('p3-salt-water'),description=el('p3-salt-description');
    if(saltText)saltText.textContent=finished?'粗盐留在盐田':crystallizing?'盐开始结晶':'盐溶解在海水中';
    if(waterText)waterText.textContent=finished?'水分已经蒸发':'水分逐渐蒸发';
    if(description)description.textContent=finished?'日晒也能分离盐和水。获得的粗盐还需要进一步处理。':'太阳和风会影响蒸发快慢。没有酒精灯，水分也能蒸发。';
  }
  function saltControls(){
    el('p3-rail-content').innerHTML='<div class="p3-status-row">'+iconWater()+'<span id="p3-salt-water"></span></div><div class="p3-status-row">'+iconSalt()+'<span id="p3-salt-material"></span></div><p id="p3-salt-description" class="p3-small-copy"></p>';
    saltCopy();
    el('p3-actions').innerHTML=button('p3-play-salt',saltPlaying?'暂停观察':saltProgress>.98?'再看一次':saltProgress>0?'继续观察':'让时间向前','primary');
    bind('p3-play-salt',function(){if(saltPlaying){stop();saltControls();}else{if(saltProgress>.98)saltProgress=0;playSalt();}});
  }
  function playSalt(){
    stop();saltPlaying=true;var start=saltProgress;saltControls();
    cancelAnimation=App.animate(11000*(1-start),function(t){saltProgress=start+(1-start)*t;saltScene();},function(){cancelAnimation=null;saltProgress=1;saltPlaying=false;saltScene();saltControls();});
  }
  function filterControls(){
    var content='',actions='';
    if(filterState==='assemble'){
      el('p3-rail-title').textContent='搭好过滤器';
      content='<p class="p3-large-copy">从瓶口向上，一层一层铺放。</p><div class="p3-material-choices">';
      for(var i=0;i<5;i++)content+='<button type="button" class="p3-material-choice" data-layer="'+i+'"'+(i>=5-layers?' disabled':'')+'>'+layerNames[i]+(i>=5-layers?' ✓':'')+'</button>';
      content+='</div><p class="p3-assembly-hint">'+(layers===0?'先想一想：什么能托住上面的材料？':'下层铺好了。下一层放什么？')+'</p>';
    }else if(filterState==='done'&&!filterAnswer){
      el('p3-rail-title').textContent='变清了，能直接喝吗？';
      content='<p class="p3-large-copy">比较过滤前后：哪些变化能直接看见？</p><div class="p3-warning">过滤器拦下了一部分不溶于水的杂质。</div>';
      actions=button('p3-answer-yes','可以直接喝','secondary')+button('p3-answer-no','不能直接喝','primary');
    }else if(filterState==='done'){
      el('p3-rail-title').textContent='清澈 ≠ 可以饮用';
      content='<div class="p3-warning '+(filterAnswer==='no'?'p3-answer-good':'')+'">'+(filterAnswer==='no'?'判断正确。':'再想一想看不见的物质。')+'<br>溶解物和部分微生物可能还在水里。</div><p class="p3-large-copy">这杯水<span class="p3-keyword">不能直接喝</span>。</p>';
      actions=button('p3-again-filter','再过滤一次','primary')+button('p3-assemble','重新装配','secondary');
    }else{
      el('p3-rail-title').textContent=filterRunning?'看水怎样通过':filterProgress>0?'继续观察':'一层一层过滤';
      content='<p class="p3-large-copy">水流过不同材料，部分沙土等杂质被留下。</p><div class="note">'+(filterRunning?'留意：过滤前后，水的外观有什么变化？':'先预测：过滤后的水会有什么不同？')+'</div><p class="p3-small-copy">按教材装置搭建；实际操作由老师指导。</p>';
      actions=button('p3-start-filter',filterRunning?'暂停观察':filterProgress>0?'继续过滤':'开始过滤','primary')+button('p3-assemble','重新装配','secondary');
    }
    el('p3-rail-content').innerHTML=content;el('p3-actions').innerHTML=actions;
    bind('p3-start-filter',function(){if(filterRunning){stop();filterControls();filterScene();}else playFilter();});
    bind('p3-assemble',function(){stop();layers=0;filterProgress=0;filterAnswer='';filterState='assemble';render();});
    bind('p3-again-filter',function(){stop();filterState='ready';filterProgress=0;filterAnswer='';render();});
    bind('p3-answer-yes',function(){filterAnswer='yes';filterControls();});
    bind('p3-answer-no',function(){filterAnswer='no';filterControls();});
    var choices=el('p3-rail-content').querySelectorAll('[data-layer]');
    for(var j=0;j<choices.length;j++)choices[j].onclick=function(){var n=Number(this.getAttribute('data-layer'));if(n!==4-layers){App.toast(layers===0?'先用细纱布托住上面的材料。':'想一想：越往上，颗粒应该怎样变化？');return;}layers++;if(layers===5){filterState='ready';App.toast('五层材料已铺好，可以开始过滤。');}render();};
  }
  function playFilter(){
    stop();filterRunning=true;filterState='filtering';var start=filterProgress;filterControls();
    cancelAnimation=App.animate(6500*(1-start),function(t){filterProgress=start+(1-start)*t;filterScene();},function(){cancelAnimation=null;filterRunning=false;filterProgress=1;filterState='done';filterScene();filterControls();});
  }
  function render(){
    var salt=mode==='salt';
    el('p3-heading').textContent=salt?'海水怎样变成粗盐？':'水变清了，就安全了吗？';
    el('p3-subtitle').textContent=salt?'让时间向前，看看水和盐去了哪里':'过滤前后，比一比看得见的变化';
    el('p3-salt-mode').className='p3-mode'+(salt?' active':'');
    el('p3-filter-mode').className='p3-mode'+(!salt?' active':'');
    el('p3-salt-mode').setAttribute('aria-pressed',salt?'true':'false');
    el('p3-filter-mode').setAttribute('aria-pressed',salt?'false':'true');
    el('p3-salt-footer').hidden=!salt;el('p3-filter-footer').hidden=salt;
    el('p3-scene').setAttribute('aria-label',salt?'盐田晒盐过程示意':'简易过滤器及过滤前后水的外观比较示意');
    el('p3-filter-caption').textContent=filterState==='assemble'?'从瓶口向上装配，再让水从上往下流':'水从上往下流，部分杂质被留下';
    if(salt){saltScene();saltControls();}else{filterScene();filterControls();}
  }
  bind('p3-salt-mode',function(){stop();mode='salt';render();});
  bind('p3-filter-mode',function(){stop();mode='filter';render();});
  el('p3-progress').addEventListener('input',function(){stop();saltProgress=Number(this.value)/100;saltScene();saltControls();});
  App.registerPage(3,{
    enter:function(){render();App.setHint('生活应用 · 场景为教学示意，实际耗时与过滤效果随条件变化');},
    leave:function(){stop();},
    reset:function(){stop();saltProgress=0;filterProgress=0;filterState='ready';filterAnswer='';layers=5;render();}
  });
  render();
})();
</script>
