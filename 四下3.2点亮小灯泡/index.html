</style><header><h1>点亮小灯泡</h1><nav aria-label="工作区"><button class="on" id="labtab">连接实验</button><button id="recordtab">观察记录</button></nav><span class="draft">基础辅助稿 · 教材待核对</span></header><main class="screen"><section id="lab" class="work"><div class="stage"><svg id="scene" viewBox="0 0 900 530" role="img" aria-label="电池、导线与白炽小灯泡的连接模型"><defs><linearGradient id="bat" x2="1"><stop stop-color="#d49222"/><stop offset=".4" stop-color="#ffcc58"/><stop offset="1" stop-color="#e1a234"/></linearGradient></defs>

<script>
'use strict';const $=id=>document.getElementById(id);const labels={open:'悬空',shell:'金属螺纹壳',tip:'底部金属端',glass:'玻璃泡',opposite:'电池另一极'};const points={open:[425,440],shell:[550,345],tip:[605,417],glass:[695,190]};let state={mode:'two',a:'open',b:'open'},checked=false,rows=[];let pending=null;
function classify(s){if(s.a==='opposite'&&s.mode==='two'||s.b==='opposite'||s.mode==='one'&&s.b==='tip')return 'short';const a=s.mode==='one'?'tip':s.a;if((a==='shell'&&s.b==='tip')||(a==='tip'&&s.b==='shell'))return 'lit';if(a==='shell'&&s.b==='shell'||a==='tip'&&s.b==='tip')return 'short';return 'open'}
function edit(){checked=false;$('predict').value='';$('status').textContent='接法已改变，请重新预测。';render()}
function wire(start,end,color){return `<path d="M${start[0]} ${start[1]} C${start[0]+130} ${start[1]},${end[0]-120} ${end[1]},${end[0]} ${end[1]}" class="wire" stroke="${color}"/>`}
function end(key){let d=state[key];if(d==='opposite')return key==='a'?[200,435]:[200,116];return points[d]}
function render(){const one=state.mode==='one';$('active').options[0].disabled=one;if(one)$('active').value='b';const key=$('active').value;$('dest').value=state[key];$('wires').innerHTML=wire([200,435],end('b'),'#3076ba')+(one?wire([200,116],points.tip,'#47564f'):wire([200,116],end('a'),'#d84d43'));$('targets').innerHTML=Object.entries(points).map(([k,p])=>`<g class="target" role="button" tabindex="0" aria-label="接到${labels[k]}" data-target="${k}" transform="translate(${p})"><circle r="15"/></g>`).join('');$('directlabel').style.display=one?'block':'none';const light=checked&&classify(state)==='lit';$('shine').setAttribute('opacity',light?'.45':'0');$('filament').setAttribute('stroke',light?'#f49e15':'#8b4e21');$('internal').setAttribute('opacity',$('inside').checked?'1':'0');document.querySelectorAll('[data-target]').forEach(el=>{const set=()=>{state[$('active').value]=el.dataset.target;edit()};el.onclick=set;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();set()}}})}
$('mode').onchange=()=>{state.mode=$('mode').value;edit()};$('active').onchange=render;$('dest').onchange=()=>{state[$('active').value]=$('dest').value;edit()};$('inside').onchange=render;
const resultLabels={lit:'会亮',open:'不会亮（未形成经过灯丝的回路）',short:'短路危险：模型停止通电'};
$('check').onclick=()=>{if(!$('predict').value){$('status').textContent='先选一个预测，再检查。';$('predict').focus();return}checked=true;let r=classify(state);$('status').textContent=r==='lit'?'两极经不同接点连通灯丝，小灯泡亮了。':r==='short'?'短路危险！实物请立即断开，不要试接。':'未形成经过灯丝的完整回路，小灯泡不亮。';if(rows.length<60){rows.push({mode:state.mode,a:state.mode==='one'?'直接接触底端':labels[state.a],b:labels[state.b],prediction:$('predict').value,result:resultLabels[r]});drawRows()}else $('status').textContent+=' 记录已达60条，请先导出。';render()};
function drawRows(){const tb=$('rows');tb.replaceChildren();if(!rows.length){const tr=tb.insertRow();const td=tr.insertCell();td.colSpan=4;td.textContent='还没有模型记录。先试一种接法吧。';return}rows.forEach((r,i)=>{let tr=tb.insertRow();[i+1,`${r.mode==='one'?'一根导线＋直接接触':'两根导线'}；正极→${r.a}；负极→${r.b}`,r.prediction,r.result].forEach(t=>tr.insertCell().textContent=t)})}
function tab(records){$('lab').hidden=records;$('records').hidden=!records;$('labtab').classList.toggle('on',!records);$('recordtab').classList.toggle('on',records)}$('labtab').onclick=()=>tab(false);$('recordtab').onclick=()=>tab(true);
function modal(title,html,fn){$('dialogtitle').textContent=title;$('dialogbody').innerHTML=html;pending=fn;$('confirm').hidden=!fn;$('dialog').showModal()}$('cancel').onclick=()=>$('dialog').close();$('confirm').onclick=()=>{if(pending)pending();pending=null;$('dialog').close()};$('dialog').onclose=()=>pending=null;
$('erase').onclick=()=>modal('清空本次模型记录？','<p>这会移除本页的全部模型记录，无法撤销。需要保留时请先返回并导出。</p>',()=>{rows=[];drawRows()});
$('export').onclick=()=>{if(!rows.length){$('status').textContent='还没有可导出的模型记录。';return}const csv='\uFEFF'+[['基础辅助稿：模型记录，不是实测'],['次序','接线方式','正极接点','负极接点','预测','模型结果'],...rows.map((r,i)=>[i+1,r.mode==='one'?'一根导线＋直接接触':'两根导线',r.a,r.b,r.prediction,r.result])].map(r=>r.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='点亮小灯泡_模型记录.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已发起下载，请确认文件已保存。'};
$('about').onclick=()=>modal('模型与来源','<p>本页是四下3.2《点亮小灯泡》基础辅助稿。课名与课号依据用户 Notion 目录；尚未读取对应新版学生教材正文和教师用书，教学目标、材料及活动顺序待核对。</p><p>电池两极需通过灯泡两个不同的金属接点和灯丝形成回路；玻璃不能代替金属接点。本模型不计算电流或亮度，不显示电流方向，不用于真实接线验收。</p><p>科学依据：<a href="https://www.nsta.org/lesson-plan/batteries-bulbs-and-wires" target="_blank" rel="noopener">NSTA · Batteries, Bulbs, and Wires</a>；<a href="https://www.exploratorium.edu/sites/default/files/tinkering/files/Instructions/circuit_boards.pdf" target="_blank" rel="noopener">Exploratorium · Circuit Boards</a>。仅参考科学解释和安全原则，未复制其图文素材。</p>',null);
render();drawRows();
</script></html>
