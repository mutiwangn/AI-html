<div class="app" id="app" data-page="observe">
  <header class="topbar">
    <a class="brand" href="../#book-5-down" aria-label="返回五年级下册课程目录"><svg class="icon brand-icon"><use href="#i-ship"/></svg><h1>船的最大装载量</h1></a>
    <div class="top-actions">
      <label class="group-control">第<input id="groupNumber" type="number" inputmode="numeric" min="1" max="99" value="1" aria-label="小组编号">组</label>
      <button class="icon-button" id="notesButton" aria-label="小组记录"><svg class="icon"><use href="#i-notes"/></svg></button>
      <button class="icon-button" id="helpButton" aria-label="操作帮助"><svg class="icon"><use href="#i-help"/></svg></button>
      <button class="icon-button" id="fullscreenButton" aria-label="全屏"><svg class="icon"><use href="#i-full"/></svg></button>

  <nav class="task-nav" aria-label="学习任务">
    <button data-page="observe" class="active" aria-current="page"><svg class="icon"><use href="#i-eye"/></svg>观察</button>
    <button data-page="measure"><svg class="icon"><use href="#i-ruler"/></svg>测量</button>

    <button data-page="load"><svg class="icon"><use href="#i-cargo"/></svg>装载</button>
  </nav>
  <main class="workspace">
    <section class="stage" aria-labelledby="question">
      <canvas id="scene" role="img" tabindex="0" aria-label="长江、海洋与黄河中的轮船"></canvas>
      <h2 id="question">驶入海洋，船会怎样？</h2>
      <div class="journey" id="journey" aria-label="航行路线"><span data-stop="0" class="current">长江</span><b>→</b><span data-stop="1">海洋</span><b>→</b><span data-stop="2">黄河</span></div>
      <div id="voyageResult" class="voyage-result" hidden></div>
      <button class="zoom-button" id="zoomButton" aria-label="放大吃水位置">看吃水</button>
      <div class="prediction-bar" id="predictionBar" aria-label="驶入下一水域后的预测">
        <button data-prediction="up" aria-pressed="false"><svg class="icon"><use href="#i-up"/></svg>上浮</button>
        <button data-prediction="same" aria-pressed="false"><svg class="icon"><use href="#i-same"/></svg>不变</button>
        <button data-prediction="down" aria-pressed="false"><svg class="icon"><use href="#i-down"/></svg>下沉</button>
      </div>
      <div class="ruler-tools" id="rulerTools" hidden><button id="resetRuler" class="tool-button"><svg class="icon"><use href="#i-ruler"/></svg>移动直尺</button><span id="alignmentState">0刻度对准液面</span></div>
      <div class="stage-measures" id="stageMeasures" hidden><span>吃水 <b id="draftValue">2.600</b> m</span><span>干舷 <b id="freeboardValue">1.800</b> m</span></div>
      <div class="load-status" id="loadStatus" hidden><span class="status-dot"></span><span id="loadStatusText">安全线以内</span><button id="resetShip" hidden>船只复位</button></div>
      <span class="source-note" id="sourceNote">水域数据为教学样本</span>
    </section>
    <aside class="control-rail" aria-label="数据与操作">
      <section id="observeControls" class="page-controls observe-controls">
        <div class="sample-title">同样 <strong>1000 mL</strong></div>
        <div id="sampleCards" class="sample-cards">
          <div class="sample-card current" data-sample="yangtze"><span class="sample-number">1</span><div><h3>长江</h3><small>含沙较少</small></div><strong>1000<small> g</small></strong></div>
          <div class="sample-card next" data-sample="ocean"><span class="sample-number">2</span><div><h3>海洋</h3><small>含有盐分</small></div><strong>1025<small> g</small></strong></div>
          <div class="sample-card" data-sample="yellow"><span class="sample-number">3</span><div><h3>浑浊黄河</h3><small>本次含沙较多</small></div><strong>1050<small> g</small></strong></div>
        </div>
        <div class="journey-cargo"><svg class="icon"><use href="#i-cargo"/></svg><div><strong>3600 <small>t</small></strong><span>货物保持不变</span></div></div>
        <button id="sailButton" class="primary">驶入海洋 →</button>
      </section>
      <section id="measureControls" class="page-controls measure-controls" hidden>
        <div class="section-heading"><span>本组测量</span><select id="recordMode" aria-label="记录来源"><option value="simulation">模拟测量</option><option value="measured">实物记录</option></select></div>
        <div class="liquid-picker" aria-label="选择液体">
          <button data-liquid="fresh" aria-pressed="true" class="selected">清水</button><button data-liquid="mild" aria-pressed="false">淡盐水</button><button data-liquid="brine" aria-pressed="false">浓盐水</button>
        </div>
        <div class="reading-table" id="readingTable" aria-label="本组露出高度记录"></div>
        <div class="readout-block"><label for="heightInput">露出高度</label><div class="number-input"><input id="heightInput" type="text" inputmode="none" readonly placeholder="—.—" aria-label="露出高度，厘米，点击打开数字键盘"><span>cm</span><button id="keyboardButton" aria-label="打开数字键盘"><svg class="icon" viewBox="0 0 32 32"><rect x="2" y="6" width="28" height="20" rx="3"/><path d="M7 12h1m5 0h1m5 0h1m5 0h1M7 17h1m5 0h1m5 0h1m5 0h1M9 22h14"/></svg></button></div></div>
        <div class="keypad" id="keypad" hidden aria-label="数字键盘"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key=".">.</button><button data-key="0">0</button><button data-key="backspace" aria-label="退格">⌫</button><button data-key="clear" class="keypad-small">清空</button><button data-key="done" class="keypad-done">收起键盘</button></div>
        <button id="saveReading" class="primary">记下来</button><button id="uncertainReading" class="quiet">暂时看不清</button>
      </section>
      <section id="compareControls" class="page-controls compare-controls" hidden>
        <div class="section-heading"><span>数据标注</span><select id="compareMode" aria-label="比较数据来源"><option value="simulation">模拟测量</option><option value="measured">实物记录</option></select></div>
        <div class="compare-records" id="compareRecords"></div>
        <div class="align-controls" aria-label="选择对齐方式"><button data-align="water" class="selected" aria-pressed="true">水面对齐</button><button data-align="float" aria-pressed="false">浮标对齐</button></div>
        <div class="comparison-result" id="comparisonResult"></div>
        <button id="saveComparison" class="primary">保存证据图</button><button id="backMeasure" class="quiet">再测一次</button>
      </section>
      <section id="loadControls" class="page-controls load-controls" hidden>
        <div class="region-picker" aria-label="选择航行水域"><button data-region="yangtze" class="selected" aria-pressed="true">长江</button><button data-region="ocean" aria-pressed="false">海洋</button><button data-region="yellow" aria-pressed="false">黄河</button></div>
        <div class="hold-controls" aria-label="保持不变的条件"><button data-hold="cargo" class="selected" aria-pressed="true">同装载</button><button data-hold="draft" aria-pressed="false">同吃水</button></div>
        <div class="load-adjust"><button id="loadMinus" class="round-button" aria-label="减少，长按连续减少"><svg class="icon"><use href="#i-minus"/></svg></button><div><span id="adjustLabel">货物</span><strong id="adjustValue">3600</strong><small id="adjustUnit">t</small></div><button id="loadPlus" class="round-button" aria-label="增加，长按连续增加"><svg class="icon"><use href="#i-plus"/></svg></button></div>
        <input id="loadRange" type="range" min="0" max="80" step="1" value="36" aria-label="调整装载量或吃水">
        <label class="wave-control"><span id="waveLabel">平静内河</span><span class="switch"><input id="calmToggle" type="checkbox" aria-label="统一为平静水面"><span class="switch-track"></span></span><small>统一平静</small></label>
        <div class="load-table" id="loadTable" aria-label="三个水域的同条件数据对比"></div>
        <button id="saveLoad" class="primary">记下这一组</button>
      </section>
    </aside>
  </main>
