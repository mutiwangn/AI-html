<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf8fb">
  <meta name="description" content="五下第四单元第五课：同船换水、简易浮标实测记录、证据比较与安全装载。四人小组平板互动实验。">
  <title>船的最大装载量 · 五下4.5 · 【镇海区鲲池小学 王宁】</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-ship" viewBox="0 0 32 32"><path d="M3 19l3 7h18l5-10-13 4-13-1zM8 18V9h14v8M12 9V5h6v4M15 5V2M2 29c2-2 4-2 6 0s4 2 6 0 4-2 6 0 4 2 8-1"/><path d="M11 13h2m4 0h2"/></symbol>
<symbol id="i-eye" viewBox="0 0 32 32"><path d="M2 16S7 6 16 6s14 10 14 10-5 10-14 10S2 16 2 16z"/><circle cx="16" cy="16" r="5"/></symbol>
<symbol id="i-ruler" viewBox="0 0 32 32"><path d="M3 23L23 3l6 6L9 29zM19 7l3 3m-7 1 2 2m-6 2 3 3m-7 1 2 2"/></symbol>
<symbol id="i-compare" viewBox="0 0 32 32"><path d="M4 28V17h5v11zm10 0V4h5v24zm10 0V11h5v17z"/></symbol>
<symbol id="i-cargo" viewBox="0 0 32 32"><path d="M2 18h11v11H2zm17 0h11v11H19zM10 3h12v11H10zM2 18l4-4h7m6 4 4-4h7M10 3l4-2h11v10l-3 3"/></symbol>
<symbol id="i-drop" viewBox="0 0 32 32"><path d="M16 2S5 15 5 21a11 11 0 0022 0C27 15 16 2 16 2z"/><path d="M10 22c0 4 4 6 7 5"/></symbol>
<symbol id="i-full" viewBox="0 0 32 32"><path d="M11 3H3v8m18-8h8v8M3 21v8h8m18-8v8h-8"/></symbol>
<symbol id="i-notes" viewBox="0 0 32 32"><path d="M8 4h16a2 2 0 012 2v23H6V6a2 2 0 012-2zM12 2h8v5h-8zM11 13h10m-10 6h10m-10 5h6"/></symbol>
<symbol id="i-help" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><path d="M11 11a5 5 0 019 3c-1 2-4 2-4 6m0 4h.01"/></symbol>
<symbol id="i-up" viewBox="0 0 32 32"><path d="M16 27V5M7 14l9-9 9 9"/></symbol>
<symbol id="i-down" viewBox="0 0 32 32"><path d="M16 5v22M7 18l9 9 9-9"/></symbol>
<symbol id="i-same" viewBox="0 0 32 32"><path d="M5 16h22"/></symbol>
<symbol id="i-plus" viewBox="0 0 32 32"><path d="M16 5v22M5 16h22"/></symbol>
<symbol id="i-minus" viewBox="0 0 32 32"><path d="M5 16h22"/></symbol>
<symbol id="i-close" viewBox="0 0 32 32"><path d="M7 7l18 18M7 25L25 7"/></symbol>
<symbol id="i-download" viewBox="0 0 32 32"><path d="M16 3v18M8 14l8 8 8-8M5 23v6h22v-6"/></symbol>
</defs></svg>
<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="../#book-5-down" aria-label="返回五年级下册课程目录"><svg class="icon brand-icon"><use href="#i-ship"/></svg><h1>船的最大装载量</h1></a>
    <div class="top-actions">
      <label class="group-control">第<input id="groupNumber" type="number" inputmode="numeric" min="1" max="99" value="1" aria-label="小组编号">组</label>
      <button class="icon-button" id="notesButton" aria-label="小组记录"><svg class="icon"><use href="#i-notes"/></svg></button>
      <button class="icon-button" id="helpButton" aria-label="操作帮助"><svg class="icon"><use href="#i-help"/></svg></button>
      <button class="icon-button" id="fullscreenButton" aria-label="全屏"><svg class="icon"><use href="#i-full"/></svg></button>
    </div>
  </header>
  <main class="workspace" id="workspace">
    <section class="stage" aria-labelledby="question">
      <canvas id="scene" role="img" aria-label="轮船在不同液体中的漂浮模型"></canvas>
      <h2 id="question">换一种水，会怎样？</h2>
      <button class="zoom-button" id="zoomButton" aria-label="放大吃水位置">看吃水</button>
      <span class="source-note" id="sourceNote">课堂模型</span>
      <div class="prediction-bar" id="predictionBar" aria-label="换水后的预测">
        <button data-prediction="up" aria-pressed="false"><svg class="icon"><use href="#i-up"/></svg><span>上浮</span></button>
        <button data-prediction="same" aria-pressed="false"><svg class="icon"><use href="#i-same"/></svg><span>不变</span></button>
        <button data-prediction="down" aria-pressed="false"><svg class="icon"><use href="#i-down"/></svg><span>下沉</span></button>
      </div>
      <div class="stage-hint" id="stageHint" hidden>拖动标线，或输入实测高度</div>
      <div class="align-controls" id="alignControls" hidden>
        <button data-align="water" class="selected" aria-pressed="true">对齐水面</button>
        <button data-align="float" aria-pressed="false">对齐浮标</button>
      </div>
      <div class="load-status" id="loadStatus" hidden><span class="status-dot"></span><span id="loadStatusText">安全线以内</span></div>
    </section>
    <aside class="control-rail" aria-label="实验操作">
      <div class="liquid-picker" id="liquidPicker" aria-label="选择液体">
        <button data-liquid="fresh" aria-pressed="true" class="liquid selected"><svg class="icon drop"><use href="#i-drop"/></svg><span>清水</span><span class="checkmark" aria-hidden="true">✓</span></button>
        <button data-liquid="mild" aria-pressed="false" class="liquid"><svg class="icon drop"><use href="#i-drop"/></svg><span>淡盐水</span><span class="checkmark" aria-hidden="true">✓</span></button>
        <button data-liquid="brine" aria-pressed="false" class="liquid"><svg class="icon drop"><use href="#i-drop"/></svg><span>浓盐水</span><span class="checkmark" aria-hidden="true">✓</span></button>
      </div>
      <div id="observeControls" class="page-controls">
        <p class="small-context" id="observeContext">同一艘船 · 货物不变</p>
        <button class="primary" id="observeButton">换水观察</button>
      </div>
      <div id="measureControls" class="page-controls" hidden>
        <div class="measure-label"><label for="heightInput">露出高度</label><select id="recordMode" aria-label="记录来源"><option value="measured">实测</option><option value="simulation">模型</option></select></div>
        <div class="number-input"><input id="heightInput" type="number" min="0" max="24" step="0.1" placeholder="—.—" inputmode="decimal" aria-label="露出高度，厘米"><span>cm</span></div>
        <div class="adjust-row"><button id="heightMinus" class="round-button" aria-label="高度减少0.1厘米"><svg class="icon"><use href="#i-minus"/></svg></button><button id="heightPlus" class="round-button" aria-label="高度增加0.1厘米"><svg class="icon"><use href="#i-plus"/></svg></button></div>
        <button class="primary" id="saveReading">记下来</button>
        <button class="quiet" id="uncertainReading">暂时看不清</button>
      </div>
      <div id="compareControls" class="page-controls" hidden>
        <div class="compare-source" id="compareSource">本组实测</div>
        <div class="evidence-picker" id="evidencePicker" aria-label="选择支持观点的记录"></div>
        <label class="reason-label" for="explanation">我们发现</label>
        <textarea id="explanation" rows="3" maxlength="800" placeholder="用一条记录说明…"></textarea>
        <button class="primary" id="saveExplanation">保存观点</button>
        <button class="quiet" id="backMeasure">再测一次</button>
      </div>
      <div id="loadControls" class="page-controls" hidden>
        <div class="cargo-display"><strong id="cargoCount">36</strong><span>箱</span></div>
        <div class="adjust-row"><button id="cargoMinus" class="round-button" aria-label="减少货物，长按连续减少"><svg class="icon"><use href="#i-minus"/></svg></button><button id="cargoPlus" class="round-button" aria-label="增加货物，长按连续增加"><svg class="icon"><use href="#i-plus"/></svg></button></div>
        <input id="cargoRange" type="range" min="0" max="72" value="36" step="1" aria-label="货物箱数">
        <button class="primary" id="saveLoad">记下装载量</button>
      </div>
    </aside>
  </main>
  <div class="record-strip" id="recordStrip" hidden aria-label="本组记录"></div>
  <nav class="bottom-nav" aria-label="学习任务">
    <button data-page="observe" class="active" aria-current="page"><svg class="icon"><use href="#i-eye"/></svg><span>观察</span></button>
    <button data-page="measure"><svg class="icon"><use href="#i-ruler"/></svg><span>测量</span></button>
    <button data-page="compare"><svg class="icon"><use href="#i-compare"/></svg><span>比较</span></button>
    <button data-page="load"><svg class="icon"><use href="#i-cargo"/></svg><span>装载</span></button>
  </nav>
  <footer class="credit">镇海区鲲池小学 王宁 · <b>mutiw</b><span>v1.0</span></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div class="modal" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden>
  <div class="modal-panel help-panel"><button class="icon-button close-modal" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button><h2 id="helpTitle">一起做实验</h2><div id="helpContent"></div><p class="model-note">轮船与“模型”浮标采用课堂参数。实测记录由小组填写，模型结果不会自动填入实测。</p><a href="README.md" target="_blank" rel="noopener" class="text-link">教师说明</a></div>
</div>
<div class="modal" id="notesModal" role="dialog" aria-modal="true" aria-labelledby="notesTitle" hidden>
 <div class="modal-panel notes-panel"><button class="icon-button close-modal" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button><h2 id="notesTitle">小组记录</h2><div id="notesContent"></div><div class="download-actions"><button class="primary" id="exportImage"><svg class="icon"><use href="#i-download"/></svg>保存证据卡</button><button class="secondary" id="exportJson">导出记录</button><button class="secondary" id="importJson">导入记录</button></div><input id="importFile" type="file" accept=".json,application/json" hidden></div>
</div>
<noscript><div class="fatal">请在支持 JavaScript 的浏览器中打开本课。</div></noscript>
<script src="logic.js"></script>
<script src="renderer.js"></script>
<script src="app.js"></script>
</body>
</html>
