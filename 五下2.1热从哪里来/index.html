<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>热从哪里来 · 能量路径探究</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#263f4b;background:#f5f3ed;font-size:18px}*{box-sizing:border-box}body{margin:0}header{padding:22px 30px;background:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #deded4}h1{font-size:29px;margin:0}h2{font-size:23px;margin:0 0 15px}p{line-height:1.7}small{color:#73838b}button{font:inherit;cursor:pointer;border:1px solid #cbd8d7;background:#fff;color:inherit;border-radius:11px;padding:12px 17px;min-height:48px}button.active,button.primary{background:#235e60;color:white}button:focus-visible,input:focus-visible{outline:3px solid #cb903d;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.tabs{display:flex;gap:10px;flex-wrap:wrap;padding:18px 25px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:0 25px 20px;max-width:1600px;margin:auto}.card{background:#fff;border:1px solid #e0e3dd;border-radius:19px;padding:22px;min-width:0}.stage{background:#eef4f2;border-radius:15px;overflow:hidden}.stage svg{display:block;width:100%;height:auto}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:17px 0}.controls label{display:block;width:100%}input[type=range]{width:100%;accent-color:#235e60;min-height:28px}.note{padding:15px 17px;background:#f8f0df;border-left:4px solid #cfa04e;line-height:1.7}.path{border:1px dashed #b7c9c6;border-radius:12px;padding:17px;font-size:21px;line-height:1.8;margin:15px 0}.answers{display:grid;gap:10px}.answers button{text-align:left}.feedback{min-height:105px;line-height:1.75;margin-top:15px}.footer{font-size:13px;color:#6f7e7f;line-height:1.8;padding:10px 28px 26px}a{color:#236f74}[hidden]{display:none!important}.label{font-size:18px;fill:#425e63}.warm{stroke:#d48643;fill:none;stroke-width:4;stroke-linecap:round}.motion{animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}@media(max-width:850px){header{padding:17px;display:block}.layout{grid-template-columns:1fr;padding:0 12px 12px}.tabs{padding:14px 12px}.card{padding:16px}h1{font-size:25px}}
</style><body data-course-domain="physical"><header><div><h1>热从哪里来</h1><small>五下 2.1 · 寻找变化背后的能量</small></div><small>概念示意，不是温度模拟</small></header><nav class="tabs" aria-label="探究场景"><button id="sun" class="active">1 阳光照射</button><button id="electric">2 电热器工作</button><button id="rub">3 摩擦过程</button><button id="coat">4 穿衣保温</button></nav><main class="layout"><section class="card"><h2 id="sceneTitle"></h2><div id="scene" class="stage"></div><div id="controls" class="controls"></div><div id="result" class="note" aria-live="polite"></div><button id="reveal" style="margin-top:16px">显示能量路径</button><div id="path" class="path" hidden></div></section><aside class="card"><h2>先想一想</h2><p id="question"></p><div id="answers" class="answers"></div><div id="feedback" class="feedback" aria-live="polite">选一个解释，看看证据边界。</div><div class="note">安全提示：这里只操作图示。不要直视太阳，不聚光点火，不接市电、不短路电池、不触摸加热元件。若真实轻搓双手出现不适，立即停止。</div></aside></main><footer class="footer">基础辅助稿 · 原创 SVG。课名已核项目目录，匹配版教材正文与教参待核。颜色、光线和箭头不是热像、温度、能量大小或真实粒子；关闭过程不代表立即冷却。无账号、上传和持久保存。<br>科学参考：<a href="https://www.eia.gov/energyexplained/what-is-energy/forms-of-energy.php">EIA 能量形式</a>、<a href="https://www.eia.gov/energyexplained/what-is-energy/laws-of-energy.php">EIA 能量转化</a>、<a href="https://www.aps.org/learning-resources/friction-fun">APS 摩擦</a>、<a href="https://www.yourhome.gov.au/passive-design/insulation">YourHome 保温</a>。电热器仅指电阻式加热，不代表热泵；电路外形为功能示意，不是接线图。</footer><script>
'use strict';const $=id=>document.getElementById(id);let mode='sun',shade=false,power=false,position=30,moves=0,coat=false,shown=false;
const data={sun:{title:'让直射阳光到达物体，或挡住它',path:'太阳辐射 → 物体吸收一部分 → 物体内能可能增加',q:'挡住直射阳光后，这个物体会立即变冷吗？',a:['会，热一下就没有了','不一定，还要看原有温度与其他热交换'],correct:1,why:'遮挡改变这条能量输入途径，不会把物体原有内能瞬间清零。散射光、环境温度和散热等也会影响结果。'},electric:{title:'电阻式电热器：开关改变哪条途径？',path:'电源提供电能 → 电阻式加热元件 → 元件内能增加并向周围传热',q:'关闭开关后，能否立即用手触摸加热元件？',a:['不能，可能仍有余热','可以，因为电已经断了'],correct:0,why:'停止电能输入不等于元件立即冷却。图中的颜色只标识通电过程，不能拿来判断安全温度。'},rub:{title:'移动上方手掌，观察相对滑动',path:'人体提供做功所需的能量 → 两手相对滑动时克服摩擦做功 → 部分能量转为内能',q:'把两只手静静贴在一起，与来回搓动相同吗？',a:['相同，接触就等于持续摩擦生热','不同，来回滑动需要持续做功'],correct:1,why:'本图区分“接触”与“相对滑动”。静止接触仍可能发生热传递，但不表示持续发生图示的摩擦做功。'},coat:{title:'在较冷环境中，衣物改变什么？',path:'身体持续代谢产热 → 衣物减慢身体向较冷环境的散热（不是完全阻断）',q:'普通衣物能像通电的电热器一样持续供热吗？',a:['能，越厚就能凭空产生越多热','不能，主要作用是减慢散热'],correct:1,why:'这里说的是普通干燥衣物，不含电热服或暖贴。身体是持续产热的一方；衣物并非凭空提供热。它也不能完全阻止热交换。'}};
const text=(x,y,t,s=20)=>`<text x="${x}" y="${y}" font-size="${s}" fill="#425e63">${t}</text>`;
const arrow=(x,y,w,color='#d48643')=>`<path d="M${x} ${y}h${w}m-12 -8l12 8-12 8" fill="none" stroke="${color}" stroke-width="4"/>`;
function svg(){let s='<svg viewBox="0 0 760 380" role="img" aria-label="'+data[mode].title+'">';
if(mode==='sun'){s+='<circle cx="105" cy="90" r="44" fill="#e5b947"/>';for(let y of [105,150,195])s+=`<path d="M150 ${y-25}L${shade?310:535} ${shade?y+45:y+110}" stroke="#d9ac3c" stroke-width="5" stroke-dasharray="12 9" class="motion"/>`;s+='<rect x="492" y="245" width="140" height="66" rx="9" fill="#809b9a"/>'+text(510,340,'被照射物体');if(shade)s+='<rect x="310" y="80" width="19" height="220" rx="5" fill="#547581"/>'+text(270,335,'遮光板');s+=text(35,40,'太阳辐射',18)+text(470,210,shade?'直射路径被遮挡':'吸收部分辐射',20);}
if(mode==='electric'){s+='<rect x="65" y="120" width="140" height="130" rx="15" fill="#d9e6e3" stroke="#597675" stroke-width="3"/>'+text(93,193,'电源示意');s+='<path d="M205 145H300M380 145H525V205M205 230H525" fill="none" stroke="#5a777a" stroke-width="5"/>';s+=`<path d="M300 145L380 ${power?145:100}" stroke="#52696c" stroke-width="7"/>`+text(270,80,power?'开关闭合':'开关断开');s+=`<rect x="465" y="175" width="165" height="108" rx="12" fill="${power?'#fae4cc':'#e3e6e1'}" stroke="#79908d" stroke-width="3"/><path d="M480 230l12 -25 18 50 18 -50 18 50 18 -50 18 50 15 -25" fill="none" stroke="${power?'#d48643':'#89938d'}" stroke-width="7"/>`+text(448,325,'电阻式加热元件');if(power)s+=arrow(230,190,170)+text(250,220,'电能输入',17);}
if(mode==='rub'){const x=190+position*1.8;s+='<rect x="225" y="207" width="295" height="66" rx="33" fill="#d8b29c" stroke="#a57e6e" stroke-width="3"/>';s+=`<rect x="${x}" y="135" width="230" height="67" rx="33" fill="#ecc5ac" stroke="#a57e6e" stroke-width="3"/>`;s+=text(260,315,'两手接触面（侧面简图）')+text(40,50,'拖动滑块，或点击左右移动',21);if(moves)s+=arrow(280,95,140,'#397d82')+text(380,80,'相对滑动',17)+text(40,355,'已移动 '+moves+' 次；次数不是温度或热量');else s+=text(285,95,'当前尚未滑动',20);}
if(mode==='coat'){s+='<circle cx="360" cy="100" r="43" fill="#e7bda2"/><path d="M300 155Q360 135 420 155L440 310H280Z" fill="#dca987"/>';if(coat)s+='<path d="M293 150L250 190L270 260L290 250V315H430V250L450 260L470 190L427 150L390 170H330Z" fill="#497f86" stroke="#2a626a" stroke-width="4"/>';s+=text(310,230,'身体产热',20).replace('#425e63',coat?'#ffffff':'#425e63');s+=arrow(460,180,125)+'<g transform="translate(335 480) rotate(180)">'+arrow(105,240,125)+'</g>'+text(485,145,coat?'散热减慢':'向外散热',21)+text(40,80,'较冷的环境',20);if(coat)s+=text(480,285,'仍有热交换',20)+text(265,355,'普通衣物：不画成热源');else s+=text(255,355,'比较：加上衣物后再看');}
return s+'</svg>';}
function renderScene(){$('scene').innerHTML=svg();$('result').textContent=mode==='sun'?(shade?'已遮挡直射路径。没有画出所有环境热交换，不据此预测温度。':'阳光可使吸收辐射的物体变暖；升温还取决于吸收和散热等。'):mode==='electric'?(power?'图示电能输入已开启。只观察模型，不按图接线或触摸电热器。':'电能输入已停止。元件可能仍有余热，灰色不表示已冷却。'):mode==='rub'?(moves?'移动次数只记录操作，不代表摩擦力、做功量或升温值。':'手掌已接触，但没有相对滑动；接触本身不等于持续摩擦做功。'):(coat?'加衣后散热减慢，不是完全停止。箭头大小不代表实际热流率。':'设定身体比周围暖；散热方向不因普通衣物而反转。');}
function select(m){mode=m;shown=false;$('path').hidden=true;$('reveal').textContent='显示能量路径';$('path').textContent=data[m].path;$('sceneTitle').textContent=data[m].title;$('question').textContent=data[m].q;$('feedback').textContent='选一个解释，看看证据边界。';for(const id of Object.keys(data)){$(id).classList.toggle('active',id===m);$(id).setAttribute('aria-pressed',String(id===m));}$('answers').innerHTML=data[m].a.map((v,i)=>`<button data-answer="${i}">${v}</button>`).join('');$('answers').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('feedback').textContent=(+b.dataset.answer===data[mode].correct?'这个解释更合适。':'再想想能量从哪里来。')+data[mode].why;});
$('controls').innerHTML=m==='sun'?'<button id="toggle" class="primary">'+(shade?'移开遮光板':'放入遮光板')+'</button>':m==='electric'?'<button id="toggle" class="primary">'+(power?'断开图示开关':'闭合图示开关')+'</button>':m==='coat'?'<button id="toggle" class="primary">'+(coat?'取下图示衣物':'加上普通衣物')+'</button>':`<label>上方手掌位置<input id="pos" type="range" min="0" max="100" value="${position}" aria-label="上方手掌位置"></label><button id="left">向左移动</button><button id="right">向右移动</button><button id="reset">清空移动次数</button>`;
if(m==='rub'){const move=v=>{v=Math.min(100,Math.max(0,v));if(v!==position){moves++;position=v;}$('pos').value=position;renderScene();};$('pos').oninput=e=>move(+e.target.value);$('left').onclick=()=>move(position-20);$('right').onclick=()=>move(position+20);$('reset').onclick=()=>{moves=0;renderScene();};}else $('toggle').onclick=()=>{if(m==='sun')shade=!shade;if(m==='electric')power=!power;if(m==='coat')coat=!coat;select(m);};renderScene();}
for(const id of Object.keys(data))$(id).onclick=()=>select(id);$('reveal').onclick=()=>{shown=!shown;$('path').hidden=!shown;$('reveal').textContent=shown?'隐藏能量路径':'显示能量路径';};select('sun');

</script></body></html>
