<body>
<div id="app">
 <header class="app-header">
  <h1>营养要均衡</h1>
  <nav class="main-nav" aria-label="探究页面">
   <button type="button" class="nav-btn active" data-page="inspect" aria-current="page">食物透视</button>
   <button type="button" class="nav-btn" data-page="balance">调配一天</button>
  </nav>
  <div class="header-tools"><button type="button" id="help-btn" class="quiet-button">说明</button><button type="button" id="fullscreen-btn" class="quiet-button">全屏</button></div>
 </header>
 <main>
  <section id="page-inspect" class="page inspect-page" aria-label="食物透视">
   <div class="inspect-content">
    <div class="plate-panel surface">
     <div class="stage-heading"><h2 id="dish-title">番茄炒蛋</h2><span class="model-label">示例配方</span></div>
     <div class="plate-stage"><svg id="plate-svg" viewBox="0 0 900 540" role="group" aria-label="可展开的菜肴原料示意"></svg></div>
     <div class="spread-control"><button type="button" id="fold-btn" class="text-button">合起来</button><input id="spread" aria-label="展开菜肴原料" type="range" min="0" max="100" value="0"><button type="button" id="unfold-btn" class="text-button">拆开看</button></div>
    </div>
    <aside class="ingredients-panel surface">
     <h2>这道菜的原料</h2>
     <p class="unit-note">原料量 · 可食部分生重</p>
     <div id="ingredient-list" class="ingredient-list"></div>
     <div id="trace-panel" class="trace-panel" aria-live="polite"></div>
     <button type="button" id="count-btn" class="count-button">清点全天原料 <span aria-hidden="true">＋</span></button>
     <div id="count-result" class="count-result" hidden></div>
    </aside>
   </div>
   <div class="meal-ribbon" id="meal-ribbon" aria-label="选择一天中的菜肴"></div>
   <div class="mobile-meals"><label for="dish-select">选菜肴</label><select id="dish-select" aria-label="选择菜肴"></select></div>
  </section>
  <section id="page-balance" class="page balance-page" aria-label="调配一天" hidden>
   <div class="balance-content">
    <div class="pagoda-panel surface">
     <div class="stage-heading"><h2>一天的食物结构</h2><span class="model-label" id="day-count">13种原料</span></div>
     <svg id="pagoda-svg" viewBox="0 0 820 570" role="group" aria-label="可点击的五层食物组示意"></svg>
     <div class="mobile-group"><label for="group-select">食物组</label><select id="group-select" aria-label="选择食物组"><option value="season">油 · 盐</option><option value="dairy">奶 · 豆 · 坚果</option><option value="protein">鱼 · 肉 · 蛋</option><option value="produce">蔬菜 · 水果</option><option value="staple" selected>谷物 · 薯类</option></select></div>
     <div class="pagoda-caption"><span>11—13岁 · 教材参考</span><span id="snapshot-count" hidden></span></div>
    </div>
    <aside class="adjust-panel surface">
     <div class="adjust-heading"><h2 id="group-title">谷物 · 薯类</h2><span class="unit-note">全天原料量</span></div>
     <div id="food-controls" class="food-controls"></div>
     <div class="reference-header"><span>分项比较 · 独立刻度</span><span class="reference-key"><i></i>教材参考</span></div>
     <div id="reference-rows" class="reference-rows"></div>
     <p id="group-note" class="group-note"></p>
    </aside>
   </div>
   <footer class="work-toolbar">
    <span id="plan-label" class="plan-label">小禾的一天<span>教学示例</span></span>
    <div class="work-actions"><button type="button" id="snapshot-btn" class="outlined-button">保留原方案</button><button type="button" id="compare-btn" class="outlined-button" disabled aria-pressed="false">前后比较</button><button type="button" id="export-btn" class="solid-button">导出记录</button></div>
   </footer>
  </section>
 </main>
 <div class="app-foot"><span>按配方追踪食材，依据证据调整。</span><button type="button" id="reset-btn">恢复示例</button></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
 <div class="modal-card"><div class="modal-heading"><h2 id="modal-title"></h2><button type="button" id="modal-close" class="quiet-button" aria-label="关闭对话框">关闭</button></div><div id="modal-body" class="modal-body"></div></div>
</div>

<script>/* 教学模型数据；可替换食材和已知配方，不从图像推断真实营养。 */
var FOODS = {

 fish:{name:'鱼',group:'protein',kind:'fish',max:200,step:5,color:'#729baf'},
 egg:{name:'鸡蛋',group:'protein',kind:'egg',max:160,step:5,color:'#e2b85b'},
 milk:{name:'牛奶',group:'dairy',kind:'milk',max:600,step:25,color:'#8cb7c5'},
 soy:{name:'黄豆',group:'dairy',kind:'soy',max:80,step:5,color:'#cdbb6c'},
 walnut:{name:'核桃仁',group:'dairy',kind:'nut',max:50,step:5,color:'#a78860'},
 oil:{name:'烹调油',group:'season',kind:'oil',max:60,step:1,color:'#d4b145'},
 salt:{name:'盐',group:'season',kind:'salt',max:10,step:0.1,color:'#8c9d9c'}
};
var FOOD_ORDER=['rice','oats','sweetpotato','tomato','pepper','broccoli','carrot','apple','pork','fish','egg','milk','soy','walnut','oil','salt'];
var GROUPS=[
 {id:'season',name:'油 · 盐',color:'#f4dc91',foods:['oil','salt'],refs:['oil','salt']},
 {id:'dairy',name:'奶 · 豆 · 坚果',color:'#dcebf0',foods:['milk','soy','walnut'],refs:['milk','soy','nut']},
 {id:'protein',name:'鱼 · 肉 · 蛋',color:'#f3d4c4',foods:['pork','fish','egg'],refs:['meat','fish','egg']},
 {id:'produce',name:'蔬菜 · 水果',color:'#dcebd3',foods:['tomato','pepper','broccoli','carrot','apple'],refs:['vegetable','fruit']},
 {id:'staple',name:'谷物 · 薯类',color:'#f3e5bd',foods:['rice','oats','sweetpotato'],refs:['grain','whole','tuber']}
];
var RECIPES=[
 {id:'porridge',meal:'早餐',name:'燕麦粥',expandedName:'燕麦粥与红薯',items:{oats:30,sweetpotato:0}},
 {id:'milkegg',meal:'早餐',name:'鸡蛋牛奶',items:{egg:45,milk:300}},
 {id:'porkrice',meal:'午餐',name:'青椒肉丝饭',items:{rice:110,pepper:40,pork:100,oil:10,salt:1.5}},
 {id:'tomatoegg',meal:'午餐',name:'番茄炒蛋',items:{tomato:100,egg:50,oil:8,salt:1.2}},
 {id:'fishrice',meal:'晚餐',name:'清蒸鱼配饭',items:{rice:110,fish:100,salt:1}},
 {id:'veggies',meal:'晚餐',name:'双色蔬菜',items:{broccoli:70,carrot:30,oil:10,salt:1.5}},
 {id:'soy',meal:'晚餐',name:'黄豆汤',items:{soy:15}},
 {id:'snack',meal:'加餐',name:'苹果核桃',items:{apple:150,walnut:10}}
];
/* 单位均为g；range不是健康判分规则。奶/盐/周量分别处理。 */
var REFS={
 grain:{label:'谷类合计',low:225,high:250,max:500,text:'225–250克/天',type:'range'},
 whole:{label:'其中全谷物',low:30,high:70,max:140,text:'30–70克/天',type:'subset'},
 tuber:{label:'薯类',low:25,high:50,max:150,text:'25–50克/天',type:'range'},
 vegetable:{label:'蔬菜',low:400,high:450,max:1000,text:'400–450克/天',type:'range'},
 fruit:{label:'水果',low:200,high:300,max:600,text:'200–300克/天',type:'range'},
 meat:{label:'畜禽肉',low:50,high:50,max:200,text:'约50克/天',type:'point'},
 fish:{label:'水产品',low:50,high:50,max:200,text:'约50克/天',type:'point'},
 egg:{label:'蛋类',low:40,high:50,max:160,text:'40–50克/天',type:'range'},
 milk:{label:'奶类',low:300,high:600,max:600,text:'300克/天（鲜奶当量）',type:'minimum'},
 soy:{label:'大豆',text:'105克/周',type:'weekly'},
 nut:{label:'坚果',text:'50–70克/周',type:'weekly'},
 oil:{label:'烹调油',low:25,high:30,max:60,text:'25–30克/天',type:'oil'},
 salt:{label:'盐',low:0,high:5,max:10,text:'少于5克/天',type:'limit'}
};
var STORAGE_KEY='science-6a-1-3-nutrition-v1';
function copy(value){return JSON.parse(JSON.stringify(value));}
function initialPlan(){var p={};RECIPES.forEach(function(r){p[r.id]=copy(r.items);});return p;}
function totalFood(plan,id){return round(RECIPES.reduce(function(s,r){return s+(plan[r.id][id]||0);},0));}
function round(n){return Math.round(n*10)/10;}
function format(n){return String(round(n));}
function totalKind(plan,kind){return round(FOOD_ORDER.reduce(function(sum,id){var f=FOODS[id];return sum+((kind==='whole'?f.whole:f.kind===kind)?totalFood(plan,id):0);},0));}
function uniqueFoods(plan){return FOOD_ORDER.filter(function(id){return id!=='oil'&&id!=='salt'&&totalFood(plan,id)>0;});}
function sources(plan,id){return RECIPES.filter(function(r){return (plan[r.id][id]||0)>0;}).map(function(r){return {recipe:r.id,meal:r.meal,name:r.name,amount:plan[r.id][id]};});}
function setFoodTotal(plan,id,value){
 var target=round(Math.max(0,Math.min(FOODS[id].max,Number(value)||0)));
 var recipes=RECIPES.filter(function(r){return Object.prototype.hasOwnProperty.call(r.items,id);});
 var sum=totalFood(plan,id),weights=recipes.map(function(r){return sum>0?(plan[r.id][id]||0):(r.items[id]||0);});
 var weightSum=weights.reduce(function(a,b){return a+b;},0);
 if(!weightSum){weights=weights.map(function(_,i){return i===0?1:0;});weightSum=1;}
 var remaining=target;
 recipes.forEach(function(r,i){var part=i===recipes.length-1?remaining:round(target*weights[i]/weightSum);part=Math.max(0,Math.min(remaining,part));plan[r.id][id]=round(part);remaining=round(remaining-part);});
 return target;
}
function validatePlan(p){
 if(!p||typeof p!=='object')return null;
 var clean=initialPlan(),ok=true;
 RECIPES.forEach(function(r){if(!p[r.id]){ok=false;return;}Object.keys(r.items).forEach(function(id){var n=p[r.id][id];if(typeof n!=='number'||!isFinite(n)||n<0){ok=false;return;}clean[r.id][id]=round(n);});});
 FOOD_ORDER.forEach(function(id){if(totalFood(clean,id)>FOODS[id].max)ok=false;});
 return ok?clean:null;
}
/* 公开、独立的替换接口；以后可替换食材图和配方数据，无需重写UI。 */
window.NutritionModel={foods:FOODS,recipes:RECIPES,references:REFS,initialPlan:initialPlan,totalFood:totalFood,totalKind:totalKind,uniqueFoods:uniqueFoods,setFoodTotal:setFoodTotal,validatePlan:validatePlan};
</script>

var toastTimer,saveTimer,lastFocus=null,animationToken=0;
try{var stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(stored&&validatePlan(stored.plan)){state.plan=validatePlan(stored.plan);state.baseline=validatePlan(stored.baseline);state.counted=!!stored.counted;}}catch(ignore){}
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({plan:state.plan,baseline:state.baseline,counted:state.counted}));}catch(ignore){}},180);}

function showHelp(){openModal('课堂使用与模型依据','<h3>先做实物活动，再用两个视角研究</h3><p>用真实记录、食物卡和纸质宝塔分类。再到“食物透视”拆开菜肴、追踪重复原料；到“调配一天”保留原方案、调整分量并比较。</p><h3>数据从哪里来</h3><p>“小禾的一天”是预先写好的教学配方。拆解展示已知原料，不是从图片自动检测。点击原料可追踪它出现在哪几餐；滑动调量会按现有比例分配到这些菜肴。</p><h3>怎样读参考带</h3><p>依据教材第11页的11—13岁膳食宝塔。原料按<strong>可食部分生重</strong>计，米饭按煮饭前大米计，奶按鲜奶当量，黄豆按干豆、坚果按果仁计。每行标尺独立，只用于本类比较；绿色为参考，深绿标记为当前量，棕色虚线为原方案。宝塔层的大小是结构示意，不表示克数比例。</p><p>全谷物和杂豆已包含在谷类总量内。大豆105克/周、坚果50—70克/周，须结合一周观察。奶300克是参考起点，盐少于5克是限制量；不要为了进入参考带而额外加油。参考量不要求每天精确一致，一天记录不能判断个人健康。</p><h3>食物与营养</h3><p>一种食物通常含有多种营养成分，不把食物类别与单一营养素对应。食材种类与分量是两条不同证据，本页不计算健康分数。还要留意饮水和运动；11—13岁饮水参考1100—1300毫升/天，并随活动、环境等调整。</p><h3>保存和离线</h3><p>配方和原方案自动保存在当前浏览器；清理浏览器数据会删除记录。“导出记录”保存CSV，可用表格软件打开。文件下载后可离线使用，不需要账号、联网或摄像头。全屏功能依浏览器支持；平板也可直接使用浏览器横屏。</p><p class="sources-note">教学依据：所提供《教材·六上》印刷10—13页；《教师用书·六上》64—75页；材料说明书膳食宝塔。核对资料：<a href="https://dg.cnsoc.org/article/04/xcIUgHazTFS3Rl8ZsPxOQA.html" target="_blank" rel="noopener noreferrer">中国营养学会·学龄儿童平衡膳食宝塔（2022）图示解析</a>、<a href="https://www.cnsoc.org/bookpublica/662200200.html" target="_blank" rel="noopener noreferrer">中国学龄儿童膳食指南（2022）</a>。图示与网页文字冲突处按教材图示核对：大豆105克为周量。</p>');}
function downloadRecord(){
 var rows=[['营养要均衡 · 教学模型对照记录'],['说明','小禾的一天为示例配方，不是学生实测。重量按原料可食部分生重计。'],['教材','六上第11页，11—13岁儿童参考；不用于个人健康判定。'],['计种','同一原料跨餐只计一次；不含油、盐。'],[]];
 rows.push(['方案','餐次','菜肴','原料','原料量（克）','备注']);
 function addPlan(p,label){RECIPES.forEach(function(r){Object.keys(r.items).forEach(function(id){rows.push([label,r.meal,(r.id==='porridge'&&p.porridge.sweetpotato>0?r.expandedName:r.name),FOODS[id].name,p[r.id][id],id==='rice'?'烹调前大米':id==='soy'?'干黄豆':id==='walnut'?'果仁':id==='milk'?'鲜奶当量':'可食部分生重']);});});}
 if(state.baseline)addPlan(state.baseline,'原方案');addPlan(state.plan,'当前方案');rows.push([],['比较项目','原方案（克）','当前方案（克）','教材参考','比较单位']);
 Object.keys(REFS).forEach(function(kind){var r=REFS[kind];rows.push([r.label,state.baseline?totalKind(state.baseline,kind):'未保留',totalKind(state.plan,kind),r.text,r.type==='weekly'?'本表记录一天；不作周量达标判断':kind==='whole'?'已含在谷类内':'各类单独比较']);});rows.push(['不同原料种数',state.baseline?uniqueFoods(state.baseline).length:'未保留',uniqueFoods(state.plan).length,'食物多样性与分量分别讨论','种']);
 var csv='\ufeff'+rows.map(function(row){return row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='营养要均衡-配方与前后对照.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},30000);toast('已生成CSV记录，请查看浏览器下载。');
}
function requestReset(){openModal('恢复最初的示例？','<p>恢复“小禾的一天”的初始配方，并清除本机保留的原方案。需要保留的探究结果可以先导出。</p><div class="modal-actions"><button type="button" class="outlined-button" data-reset-export="true">先导出记录</button><button type="button" class="solid-button" data-confirm-reset="true">恢复示例</button></div>');}
function reset(){state.plan=initialPlan();state.baseline=null;state.compare=false;state.food=null;state.recipe='tomatoegg';state.group='staple';state.spread=0;state.counted=false;animationToken++;persist();setPage('inspect');closeModal();toast('已恢复教学示例。');}
function closestData(target,attribute){while(target&&target!==document){if(target.getAttribute&&target.hasAttribute(attribute))return target;target=target.parentNode;}return null;}
document.addEventListener('click',function(e){var n;if((n=closestData(e.target,'data-page')))setPage(n.getAttribute('data-page'));else if((n=closestData(e.target,'data-recipe')))chooseRecipe(n.getAttribute('data-recipe'));else if((n=closestData(e.target,'data-food')))chooseFood(n.getAttribute('data-food'));else if((n=closestData(e.target,'data-expand')))animateSpread(state.spread<50?100:0);else if((n=closestData(e.target,'data-group')))selectGroup(n.getAttribute('data-group'));else if((n=closestData(e.target,'data-step-food'))){var id=n.getAttribute('data-step-food');adjustFood(id,totalFood(state.plan,id)+Number(n.getAttribute('data-delta'))*FOODS[id].step);}else if(closestData(e.target,'data-go-balance')){closeModal();setPage('balance');}else if(closestData(e.target,'data-confirm-reset'))reset();else if(closestData(e.target,'data-reset-export'))downloadRecord();});
$('spread').addEventListener('input',function(){animationToken++;state.spread=Number(this.value);renderPlate();});
$('fold-btn').addEventListener('click',function(){animateSpread(0);});$('unfold-btn').addEventListener('click',function(){animateSpread(100);});
$('dish-select').addEventListener('change',function(){chooseRecipe(this.value);});
$('group-select').addEventListener('change',function(){selectGroup(this.value);});
$('food-controls').addEventListener('input',function(e){if(e.target.hasAttribute('data-amount-food'))adjustFood(e.target.getAttribute('data-amount-food'),e.target.value);});
$('count-btn').addEventListener('click',showCount);$('help-btn').addEventListener('click',showHelp);$('reset-btn').addEventListener('click',requestReset);$('modal-close').addEventListener('click',closeModal);
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal();});
$('snapshot-btn').addEventListener('click',function(){state.baseline=copy(state.plan);state.compare=true;renderSnapshot();renderReferences();persist();toast('原方案已保留；现在可以调整、比较。');});
$('compare-btn').addEventListener('click',function(){if(!state.baseline)return;state.compare=!state.compare;renderSnapshot();renderReferences();});
$('export-btn').addEventListener('click',downloadRecord);
$('fullscreen-btn').addEventListener('click',function(){var d=document,el=d.documentElement,active=d.fullscreenElement||d.webkitFullscreenElement,fn;if(active){fn=d.exitFullscreen||d.webkitExitFullscreen;if(fn)fn.call(d);}else{fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn){try{var promise=fn.call(el);if(promise&&promise.catch)promise.catch(function(){toast('浏览器未开启全屏，可使用系统全屏或横屏。');});}catch(ignore){toast('可使用浏览器全屏或平板横屏。');}}else toast('此浏览器不支持网页全屏，请使用平板横屏。');}});
function fullscreenLabel(){$('fullscreen-btn').textContent=document.fullscreenElement||document.webkitFullscreenElement?'退出全屏':'全屏';sizeApp();}document.addEventListener('fullscreenchange',fullscreenLabel);document.addEventListener('webkitfullscreenchange',fullscreenLabel);
document.addEventListener('keydown',function(e){if(!$('modal').hidden){if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){var focusable=$('modal').querySelectorAll('button:not([disabled]),a[href],input,select,[tabindex="0"]'),first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}var t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.tagName&&t.tagName.toLowerCase()==='g'&&t.getAttribute('role')==='button'){e.preventDefault();if(t.hasAttribute('data-group'))selectGroup(t.getAttribute('data-group'));else if(t.hasAttribute('data-food'))chooseFood(t.getAttribute('data-food'));else if(t.hasAttribute('data-expand'))animateSpread(state.spread<50?100:0);}});
window.NutritionApp={version:'1.0.0',getPlan:function(){return copy(state.plan);},replaceFoodArt:function(id,markup){if(!FOODS[id]||typeof markup!=='string')return false;window.FOOD_ART[id]=markup;renderInspect();renderBalance();return true;}};
renderInspect();
})();
</script>
