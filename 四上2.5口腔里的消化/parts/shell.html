<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#147d76"><meta name="description" content="四上2.5口腔里的消化：咀嚼观察、牙齿分工、口腔合作。支持单文件离线展示与局域网小组课堂。">
<title>四上2.5 口腔里的消化 · 互动实验室</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<noscript><div class="noscript">请在浏览器中启用 JavaScript，再打开互动实验室。</div></noscript>
<div class="app" id="app">
<header class="topbar"><h1>口腔里的消化</h1><nav class="tabs" role="tablist" aria-label="课堂活动"><button id="tab-observe" class="tab" role="tab" aria-selected="true" aria-controls="page-observe" data-page="observe">咀嚼观察</button><button id="tab-teeth" class="tab" role="tab" aria-selected="false" aria-controls="page-teeth" data-page="teeth">牙齿分工</button><button id="tab-cooperate" class="tab" role="tab" aria-selected="false" aria-controls="page-cooperate" data-page="cooperate">合作消化</button></nav><div class="top-actions"><button id="classroom" class="tool" title="连接课堂、汇总小组记录">课堂</button><button id="fullscreen" class="tool" aria-label="进入或退出全屏" title="全屏"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.7"><path d="M12 4H4v8M20 4h8v8M4 20v8h8M28 20v8h-8"/></svg></button></div></header>
<main>
<section class="page active" id="page-observe" role="tabpanel" aria-labelledby="tab-observe">
 <div class="workspace"><h2 class="question">馒头在口腔里，发生了什么？</h2>
  <div class="stage" id="bread-stage"><img id="bread-photo" class="plate-photo" src="__BREAD_ASSET__" alt="白色盘中一小块未经咀嚼的馒头"><svg id="food-simulation" class="food-svg hidden" viewBox="0 0 800 440" role="img" aria-label="馒头咀嚼变化的教学示意"><defs><radialGradient id="plateGradient"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#f4f4f1"/><stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#dce2de"/></radialGradient><radialGradient id="crumbGradient" cx=".35" cy=".25"><stop offset="0" stop-color="#fffef4"/><stop offset="1" stop-color="#e5d5b4"/></radialGradient><filter id="plateShadow" x="-.3" y="-.4" width="1.6" height="1.8"><feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#25433a" flood-opacity=".15"/></filter></defs><ellipse cx="400" cy="235" rx="318" ry="150" fill="url(#plateGradient)" filter="url(#plateShadow)"/><ellipse cx="400" cy="224" rx="241" ry="102" fill="#ffffff" stroke="#eaeee9" stroke-width="2"/><g id="food-wet"></g><g id="food-particles"></g></svg><span id="sample-label" class="sample-label">咀嚼前</span><button id="magnify" class="magnify" aria-label="放大观察馒头" title="放大观察"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="13" cy="13" r="8"/><path d="m19 19 9 9"/></svg></button></div>
  <div class="stepper" role="group" aria-label="咀嚼观察次数"><button class="step" data-count="1" aria-pressed="true">1次</button><button class="step" data-count="5" aria-pressed="false">5次</button><button class="step" data-count="10" aria-pressed="false">10次</button></div>
  <div class="action-row"><button id="reveal-simulation" class="primary">查看示意</button><button id="compare-records" class="secondary">对照记录</button></div><div class="caption" id="observation-caption">先观察自己的馒头，再记录真实感受。</div>
 </div>
 <aside class="rail"><h2>我的观察</h2><p class="lead">咀嚼 <strong id="current-count">1</strong> 次</p>
  <div class="record-form" id="record-form"><div class="choice-row"><span class="choice-label" id="size-label">大小</span><div class="choices" role="group" aria-labelledby="size-label"><button class="choice" data-field="size" data-value="大块" aria-pressed="false">大块</button><button class="choice" data-field="size" data-value="小块" aria-pressed="false">小块</button><button class="choice" data-field="size" data-value="细碎" aria-pressed="false">细碎</button></div></div><div class="choice-row"><span class="choice-label" id="texture-label">软硬</span><div class="choices" role="group" aria-labelledby="texture-label"><button class="choice" data-field="texture" data-value="较硬" aria-pressed="false">较硬</button><button class="choice" data-field="texture" data-value="较软" aria-pressed="false">较软</button></div></div><div class="choice-row"><span class="choice-label" id="moisture-label">干湿</span><div class="choices" role="group" aria-labelledby="moisture-label"><button class="choice" data-field="moisture" data-value="较干" aria-pressed="false">较干</button><button class="choice" data-field="moisture" data-value="湿润" aria-pressed="false">湿润</button></div></div></div>
  <div class="rail-foot"><div style="flex:1"><button id="save-observation" class="primary">保存观察</button><div id="save-status" class="observe-save" role="status"></div></div><p class="muted">一人一份，小口慢嚼，吞咽后再交流。</p></div><div class="copyright">mutiw</div>
 </aside>
</section>
<section class="page" id="page-teeth" role="tabpanel" aria-labelledby="tab-teeth" hidden>
 <div class="workspace"><h2 class="question">不同形状的牙齿，各有什么本领？</h2><div class="stage teeth-stage"><svg id="teeth-arch" class="teeth-arch" viewBox="0 0 800 590" role="group" aria-label="可点击门齿、犬齿、臼齿的下牙弓位置示意"><defs><linearGradient id="gumShade" x1="0" x2="0" y2="1"><stop stop-color="#f1b9b0"/><stop offset="1" stop-color="#d88b86"/></linearGradient><linearGradient id="toothShade" x1="0" x2=".7" y2="1"><stop stop-color="#ffffff"/><stop offset=".6" stop-color="#fffef6"/><stop offset="1" stop-color="#e5e4d7"/></linearGradient></defs><ellipse cx="400" cy="330" rx="262" ry="190" fill="#e5eee9"/><path d="M203 95C169 164 158 324 213 426C255 507 347 535 400 535C453 535 545 507 587 426C642 324 631 164 597 95L535 104C570 205 558 341 519 397C488 446 438 465 400 465C362 465 312 446 281 397C242 341 230 205 265 104Z" fill="url(#gumShade)" stroke="#ce8e86" stroke-width="3"/><path d="M292 375Q400 312 508 375Q497 445 400 462Q303 445 292 375" fill="#e7a4a3" opacity=".7"/><path d="M400 386L400 439" stroke="#cc878c" stroke-width="3" stroke-linecap="round"/><g id="teeth-nodes"></g><g fill="none" stroke="#8da6a0" stroke-width="2"><path d="M339 496L297 552H205"/><path d="M266 423L174 456H89"/><path d="M587 229L655 196H725"/></g><text x="173" y="560" text-anchor="end" class="tooth-name">门齿</text><text x="76" y="463" text-anchor="end" class="tooth-name">犬齿</text><text x="733" y="205" class="tooth-name" text-anchor="middle">臼齿</text><text x="400" y="73" text-anchor="middle" class="tooth-caption">口腔后方</text><text x="400" y="583" text-anchor="middle" class="tooth-caption">口腔前方</text></svg></div><div class="type-buttons" role="group" aria-label="选择牙齿"><button class="type-button" data-type="incisor" aria-pressed="true">门齿</button><button class="type-button" data-type="canine" aria-pressed="false">犬齿</button><button class="type-button" data-type="molar" aria-pressed="false">臼齿</button></div><div class="caption">点击牙齿观察形状。这是位置示意，换牙期的牙齿数量会不同。</div></div>
 <aside class="rail tooth-rail"><h2 id="tooth-title">门齿</h2><p class="tooth-detail" id="tooth-detail">前端较薄，像一把小切刀。</p><div class="action-stage"><svg id="tooth-action" viewBox="0 0 420 320" role="img" aria-label="所选牙齿形状与动作示意"><defs><linearGradient id="actionTooth" x1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e5e4d6"/></linearGradient></defs><g id="action-food"></g><g id="action-upper"></g><g id="action-lower"></g></svg></div><div class="guess-list" aria-label="预测牙齿的作用"><button class="guess-button" data-guess="切断">切断</button><button class="guess-button" data-guess="撕裂">撕裂</button><button class="guess-button" data-guess="磨碎">磨碎</button></div><div class="feedback" id="tooth-feedback" role="status">先猜一猜，再看动作。</div><div class="rail-foot"><button class="primary" id="verify-tooth">动作验证</button></div><div class="copyright">mutiw</div></aside>
</section>
<section class="page" id="page-cooperate" role="tabpanel" aria-labelledby="tab-cooperate" hidden>
 <div class="workspace"><h2 class="question">少了谁，食物的变化会不同？</h2><div class="stage cooperate-stage"><svg id="cooperate-svg" viewBox="0 0 840 540" role="img" aria-label="牙齿咀嚼、舌运送搅拌、唾液湿润食物的协同示意"><defs><linearGradient id="mouthInner" x1="0" x2="0" y2="1"><stop stop-color="#713e49"/><stop offset="1" stop-color="#9b5861"/></linearGradient><linearGradient id="tongueShade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ed9b9e"/><stop offset="1" stop-color="#cd6c7e"/></linearGradient><radialGradient id="breadShade"><stop stop-color="#fff7d9"/><stop offset="1" stop-color="#dfc48d"/></radialGradient></defs><path d="M120 175Q157 100 350 99L648 109Q740 129 751 258Q747 392 642 416L308 440Q157 425 113 347Q85 293 120 175Z" fill="#efd1c6" stroke="#dfafa5" stroke-width="4"/><path d="M151 184Q207 145 381 150L625 158Q695 177 692 272Q689 358 615 375L301 397Q184 386 145 326Q114 264 151 184Z" fill="url(#mouthInner)"/><path d="M151 188Q207 160 370 169L623 176" class="mouth-line"/><path id="lower-gum-line" d="M160 322Q205 370 315 376L616 356" class="mouth-line"/><g id="upper-jaw"><path d="M158 174Q176 169 197 173L198 242Q177 248 158 236Z" fill="#fffdf2" stroke="#d0c5b0" stroke-width="2"/><path d="M208 173Q228 169 243 178L248 230L228 252L210 229Z" fill="#fffdf2" stroke="#d0c5b0" stroke-width="2"/><g fill="#fffdf2" stroke="#cfc7b5" stroke-width="2"><path d="M468 173Q489 159 511 174L511 222Q503 236 490 229Q476 235 467 222Z"/><path d="M520 173Q544 162 566 176L565 223Q554 236 541 229Q529 236 519 222Z"/><path d="M576 178Q599 166 621 182L617 226Q608 237 594 232Q581 238 573 224Z"/></g></g><g id="lower-jaw"><path d="M158 330Q178 322 199 333L199 281Q182 275 164 282Z" fill="#fffdf2" stroke="#d0c5b0" stroke-width="2"/><g fill="#fffdf2" stroke="#cfc7b5" stroke-width="2"><path d="M467 357L467 308Q480 298 490 304Q501 298 512 309L511 355Z"/><path d="M520 356L519 309Q530 299 543 305Q555 300 566 312L563 354Z"/><path d="M575 353L574 309Q587 302 597 308Q609 302 619 314L613 349Z"/></g></g><g id="tongue-moving"><path d="M638 367Q589 292 469 308Q346 322 285 291Q242 269 214 286Q195 303 220 326Q283 388 429 382Q544 379 638 367Z" fill="url(#tongueShade)" stroke="#c47883" stroke-width="3"/><path d="M246 309Q375 356 543 340" fill="none" stroke="#bd677c" stroke-width="2" opacity=".7"/></g><g id="saliva-moving"></g><g id="mouth-food"></g><g stroke="#8aa49d" stroke-width="2" fill="none"><path d="M190 173L148 97H72"/><path d="M425 360L414 473H316"/><path d="M640 203L715 110H775"/></g><text x="66" y="88" class="model-label">牙齿</text><text x="269" y="481" class="model-label">舌</text><text x="745" y="92" class="model-label">唾液</text><text x="400" y="523" text-anchor="middle" class="tooth-caption">口腔局部剖面示意 · 三者同时参与</text></svg></div><p class="live-note" id="cooperate-live" aria-live="polite">先预测，再让它们共同工作。</p><div class="action-row cooperate-actions"><button class="primary" id="play-cooperate">共同工作</button><button class="secondary" id="reset-cooperate">重新观察</button></div><div class="caption">模拟用来解释作用，不代表人体的精确速度或吞咽标准。</div></div>
 <aside class="rail cooperate-rail"><h2>一起试一试</h2><div class="mechanism"><button class="mechanism-toggle" data-part="teeth" aria-pressed="true"><svg class="mechanism-icon" viewBox="0 0 60 60"><path d="M16 9Q25 4 30 10Q38 4 45 10Q54 19 44 47Q40 57 35 38Q30 30 25 46Q19 59 14 40Q5 18 16 9Z" fill="#fffaf0" stroke="#a2bdb5" stroke-width="2.7"/></svg><span>牙齿<small>切断、撕裂、磨碎</small></span><span class="switch" aria-hidden="true"></span></button><button class="mechanism-toggle" data-part="tongue" aria-pressed="true"><svg class="mechanism-icon" viewBox="0 0 60 60"><path d="M11 19Q29 10 49 19L45 40Q30 58 15 41Z" fill="#e9a5a6" stroke="#c97c86" stroke-width="2.5"/><path d="M30 20v23" stroke="#c97c86" stroke-width="2.5"/></svg><span>舌<small>运送、搅拌</small></span><span class="switch" aria-hidden="true"></span></button><button class="mechanism-toggle" data-part="saliva" aria-pressed="true"><svg class="mechanism-icon" viewBox="0 0 60 60"><path d="M30 7C25 18 12 30 13 40A17 17 0 0 0 47 40C48 30 35 18 30 7Z" fill="#a0d1df" stroke="#72afc2" stroke-width="2.5"/><path d="M21 38q-1 9 7 10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/></svg><span>唾液<small>湿润食物</small></span><span class="switch" aria-hidden="true"></span></button></div><div class="mechanism-text" id="mechanism-text">先全部开启，再暂停一位，比较食物的变化。</div><button class="help-link" id="protect-teeth">怎样保护牙齿？</button><button class="help-link" id="teacher-notes" style="font-size:16px;color:#74908a;text-decoration:none">教学说明</button><div class="copyright">mutiw</div></aside>
</section>
</main></div>
