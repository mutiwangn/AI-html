catch(e){ps.locked=true;psStatus('缓存无法安全读取，已只读保护原文；当前页面可继续试用，请备份原文和当前草稿。');}
function persist(){
 if(ps.locked||ps.awaitSave){psStatus(ps.locked?'只读保护中，改动仅在当前页面。请先备份原文与草稿。':'恢复内容尚未保存，请点击“保存当前方案”。');return false;}
 try{
  const current=localStorage.getItem(PS_KEY);if(current!==ps.base){ps.locked=true;psStatus('另一页面已更改缓存，停止写入。请备份当前草稿及本机原文再决定。');return false;}
  const text=JSON.stringify(validateSnapshots(JSON.parse(JSON.stringify(S.snapshots))));
  localStorage.setItem(PS_KEY,text);ps.base=text;psStatus('已保存到本机，共 '+S.snapshots.length+' 个方案。');return true;
 }catch(e){psStatus('未保存到本机：校验、权限或空间不足。当前方案仍在页面中，请导出草稿。');return false;}
}
function psDownload(raw,name){try{download(name,raw,'application/json');return true;}catch(e){psStatus('下载请求失败，请保留本页和浏览器缓存。');return false;}}
function installSnapshotGuard(){
 const box=document.createElement('details');box.id='psStorage';box.style.cssText='position:fixed;right:8px;bottom:2px;z-index:1000;max-width:min(520px,94vw);max-height:65vh;overflow:auto;border:1px solid #9bafc3;border-radius:8px;background:#fff;color:#223c53;padding:4px 10px;font:14px/1.5 sans-serif';
 box.innerHTML='<summary>方案记录与备份</summary><p id="psStatus" role="status"></p><div id="psButtons"></div><p>本页保存完整方案；旧原文与当前草稿分开导出。恢复只改当前页面，需明确保存。浏览器清理数据或关闭未保存页面仍会丢记录。</p>';
 document.body.appendChild(box);box.open=ps.locked;psStatus(ps.status);
 const add=(name,fn)=>{const b=document.createElement('button');b.textContent=name;b.style.cssText='padding:6px;margin:3px;font-size:14px';b.onclick=fn;document.getElementById('psButtons').appendChild(b);};
 add('导出当前草稿',()=>psDownload(JSON.stringify(S.snapshots,null,2),'妙用滑轮_当前方案草稿.json'));
 add('导出启动原文',()=>{if(ps.startup!==null)psDownload(ps.startup,'妙用滑轮_启动原文.json');else psStatus('启动时没有本机缓存原文。');});
 add('导出本机现有原文',()=>{try{const raw=localStorage.getItem(PS_KEY);if(raw!==null)psDownload(raw,'妙用滑轮_本机原文.json');else psStatus('本机没有缓存原文。');}catch(e){psStatus('无法读取本机缓存，请导出启动原文和当前草稿。');}});
 add('恢复 JSON 到当前页面',()=>{
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.onchange=()=>{const f=input.files&&input.files[0];if(!f)return;const before=JSON.stringify(S.snapshots),reader=new FileReader();reader.onerror=()=>psStatus('文件读取失败，原方案未改变。');reader.onload=()=>{
   let next;try{let d=JSON.parse(reader.result);if(!Array.isArray(d)){if(!d||d.kind!=='pulley-comparisons'||d.version!==2||Object.keys(d).some(k=>!['kind','version','note','snapshots'].includes(k))||('note'in d&&typeof d.note!=='string'))throw Error('未知备份格式');d=d.snapshots;}next=validateSnapshots(d);}catch(e){psStatus('备份格式或内容无效，原方案未改变。');return;}
   if(JSON.stringify(S.snapshots)!==before){psStatus('读文件期间方案已改变，取消恢复，请重新选择。');return;}
   if(!confirm('将当前页面的方案列表替换为备份中的 '+next.length+' 个方案？请先导出需保留的草稿。本机缓存不会立即改变。'))return;
   S.snapshots=next;ps.awaitSave=true;S.run=false;S.life.playing=false;render();psStatus('已恢复到当前页面，尚未保存本机。');
  };reader.readAsText(f);};input.click();
 });
 add('保存当前方案',()=>{ps.awaitSave=false;persist();});
 add('备份后解除保护并覆盖',()=>{
  let text,raw;try{text=JSON.stringify(validateSnapshots(JSON.parse(JSON.stringify(S.snapshots))));raw=localStorage.getItem(PS_KEY);}catch(e){psStatus('当前草稿或缓存无法安全处理，未覆盖。');return;}
  if(raw!==null&&!psDownload(raw,'妙用滑轮_覆盖前原文.json'))return;
  if(!confirm('请确认覆盖前原文已下载且可找到（无旧缓存则无需备份）。用当前 '+S.snapshots.length+' 个方案替换本机缓存？其他标签页的方案可能不同。'))return;
  try{if(localStorage.getItem(PS_KEY)!==raw){psStatus('确认期间缓存再次变化，已取消覆盖。请重新备份。');return;}localStorage.setItem(PS_KEY,text);ps.base=text;ps.locked=false;ps.awaitSave=false;psStatus('已明确覆盖本机缓存，请保留原文备份。');}catch(e){psStatus('覆盖保存失败，草稿仍在当前页，未主动清除旧缓存。');}
 });
 window.addEventListener('storage',e=>{if(e.key===PS_KEY||e.key===null){ps.locked=true;psStatus('检测到其他页面修改或清理缓存，已停止写入，请先导出草稿。');}});
}

function layout(r){
 const pos={},start=-(r.route.length-1)*RADIUS+r.shift*1.2,h=(r.s/(Core.inspect(r).n||1))/CM;
 r.route.forEach((id,i)=>{const c=r.components.find(c=>c.id===id);if(c)pos[id]=[start+i*2*RADIUS,c.mount==='fixed'?FY:MY+h,0]});
 let idx=0;for(const c of r.components){if(!pos[c.id]){pos[c.id]=[-4.2+(idx++)*1.5,c.mount==='fixed'?FY:c.mount==='moving'?MY+h:1.3,-.8]}}
 return {pos,start,h,barY:MY+h-1.0};
}

 if(S.page==='life')renderLifeUI();else if(S.page==='builder')renderBuilderUI();else renderLabUI();

function updateMetrics(){
 const playing=S.page==='life'?S.life.playing:S.run;
 const transportPlay=$('transport').querySelector('[data-action="play"]');
 if(transportPlay&&transportPlay.dataset.playing!==String(playing)){transportPlay.innerHTML=icon(playing?'pause':'play');transportPlay.dataset.playing=String(playing)}
 const panelPlay=$('panel').querySelector('[data-action="play"]');
 if(panelPlay)panelPlay.textContent=playing?'暂停':S.page==='life'?'让装置运动':S.page==='builder'?'测试提升':'试着提升';
 if(S.page==='life'){
  const val=Math.round((1-Math.cos(S.life.time*.58))*50);if(document.activeElement!==$('scrub'))$('scrub').value=val;$('scrubValue').textContent=val+'%';
  const fb=$('lifeFeedback');if(fb){if(S.checkedLife){const w=drawnWheels.find(x=>x.id===S.selected)||drawnWheels[0];if(w){const agree=(w.kind==='M')===(S.lifeGuess==='moving');fb.textContent=(agree?'你的判断与模型的轴心运动一致。':'再看轴心与固定支架的位置关系。')+'轮子会转，并不能单独判断“定”或“动”。';fb.className='status '+(agree?'ok':'warn')}}else fb.textContent=S.marks.length?'已留下轴心起点。让装置运动，再与起点比较。':'先留下你的判断，答案不会自动出现。'}
 }else{
  const r=rig(),p=physics();if($('forceValue'))$('forceValue').textContent=S.data&&p.valid?p.F.toFixed(p.F%1?1:0):'—';if($('heightValue'))$('heightValue').textContent=p.h.toFixed(1);if($('ropeValue'))$('ropeValue').textContent=r.s.toFixed(1);
  if($('scrub')){if(document.activeElement!==$('scrub'))$('scrub').value=r.s;$('scrub').max=p.maxS;$('scrubValue').textContent=r.s.toFixed(1)+' cm'}
  let reason=S.runReason||(!p.valid?p.reason:S.run?'正在缓慢提升；可以随时暂停。':r.tested?'停在当前状态，比较位置与绳路。':'拖蓝色绳端，或点击测试。');
  if(S.checked&&S.pick){const correct=segments.filter(x=>x.support).map(x=>x.id);const ok=correct.length===S.picked.length&&correct.every(x=>S.picked.includes(x));reason=(ok?'你选出的绳段与支承关系一致。':'保留你的选择，再看高亮的支承绳段。')+'只数向上支承整个移动部分的绳段。'}

function sanitizeRig(input){
 if(!input||typeof input!=='object'||!Array.isArray(input.components)||input.components.length>4||!Array.isArray(input.route)||input.route.length>4)throw Error('设计格式不正确，最多支持4个滑轮。');
 const r=freshRig('blank');let ids=new Set();r.components=input.components.map(c=>{if(!c||!['A','B','C','D'].includes(c.id)||ids.has(c.id)||![null,'fixed','moving'].includes(c.mount))throw Error('滑轮编号或挂接方式无效。');ids.add(c.id);return{id:c.id,mount:c.mount}});
 r.route=input.route.map(x=>{if(!ids.has(x))throw Error('绳路包含不存在的滑轮。');return x});if(new Set(r.route).size!==r.route.length)throw Error('绳路不能重复穿过同一个槽。');
 if(!['top','load'].includes(input.anchor))throw Error('固定端无效。');r.anchor=input.anchor;r.complete=!!input.complete;
 for(const [key,min,max]of[['load',1,100],['capacity',1,100],['target',1,25],['travel',5,50],['angle',0,90],['shift',-1,1]]){const n=Number(input[key]);if(!Number.isFinite(n)||n<min||n>max)throw Error(key+' 的值超出范围。');r[key]=n}
 if(!['up','down','any'].includes(input.required))throw Error('方向条件无效。');if(![0,45,90].includes(r.angle))throw Error('当前版本只支持0、45、90度三个拉动方向。');r.required=input.required;r.limited=!!input.limited;r.prediction=typeof input.prediction==='string'?input.prediction.slice(0,40):'';r.s=0;r.tested=false;
 if(r.complete&&r.route.length&&!Core.inspect(r).valid)throw Error(Core.inspect(r).reason);return r;
}

function help(){showDialog('课堂用法与模型边界',`<h3>主要用于真实实验之后</h3><p>保留教材中的实物观察、组装、测量和记录。网页用于研讨时看清轴心运动、表达预测、改变一个条件并保留方案，不是重新做一遍教材实验。可直接打开任意页，不需要完成全部页面。</p><h3>学生怎样操作</h3><p>点画面中的滑轮编号选择对象；拖蓝色拉绳端，或拖底部行程滑条控制提升。空白处拖动转动视角，双指缩放或点放大缩小。“画方向”和“描绳路”保留学生自己的解释；“清标注”只清除标记，不删除设计。</p><p>在改装工坊添加同一种滑轮，再选择“挂到横梁”或“连接货物”。重新穿绳时，先选固定端，再依次点滑轮编号，最后接出自由端。可以留着未穿绳的滑轮，观察它是否改变作用。</p><h3>模拟不等于真实证据</h3><p>取单根绷紧、不可伸长的轻绳，忽略摩擦、滑轮及吊架自重，按缓慢提升计算。数值是设定规律的计算结果，不是独立验证这些规律的测量证据。触屏按压力和拖动速度不代表真实拉力。</p><p>研究页：定滑轮一端竖直连接货物，自由端可向下、斜下或水平拉；动滑轮采用两段绳竖直向上的常见接法。省力关系不推广到任意斜绳、不同绳张力或复杂独立多级系统。</p><p>工坊：一根绳、最多4轮、所有连接货物的滑轮同属一个吊架。支持上下交替绕法，自动对齐竖直绳段。由实际绳路决定承重绳段数 n，而不是用滑轮总数代替。理想关系为 F=G/n、s=nh；只增加用于改变方向的轮子，不一定增加 n。</p><p>自由探索拖动的是绳端位移，显示所需拉力；限制任务先判断可用拉力是否足够，不足时保持原位。足够时按所需拉力缓慢提升，不模拟加速、失手坠落或绳子断裂。行程到限位后停下，不代表达到受力平衡。</p><h3>资产与视角</h3><p>本版根据讨论中的黄橙色实心轮、深灰双钩参考，使用可替换的程序化三维几何。尚未导入你在 Blender 中制作的 GLB。研究舞台的轮体直径取4 cm（坐标单位为5 cm）；生活场景为比例调整后的结构示意，不是设备精确复刻。二维截图不能替代对导出GLB的节点检查。</p><h3>教材依据与拓展</h3><p>项目中的《科学教师教学用书·五年级上册》第二单元第5课《妙用滑轮》，印刷页161—170；《科学·五年级上册》印刷页50—53。作用辨认、比较与生活应用依据教材；绳端位移比较、开放改装和任务限制是本网页的拓展设计，不作为本课必须掌握的计算要求。</p><p>物理核对：<a href="https://openstax.org/books/college-physics-2e/pages/9-5-simple-machines" target="_blank" rel="noopener">OpenStax · 9.5 Simple Machines</a>。本页未复制教材或网页插图。</p><h3>兼容与保存</h3><p>HTML 不请求外部字体、模型或脚本，可离线打开。优先使用WebGL2；失败时回退到Canvas软件三维，低性能设备可能较慢。最多保留3个方案；浏览器允许时保存在本机，隐私模式或文件环境可能不允许长期保存，可导出设计与对照资料。没有上传学生数据的服务。</p><p>全屏是否可用由浏览器环境决定。手机纵屏上下排布，一体机与平板横屏采用同屏布局。物理模型和教学任务不因显示方式改变。</p>`)}
function act(action,b){
 switch(action){
 case 'play':play();break;
 case 'reset':resetPosition();break;
 case 'scene':S.life.scene=b.dataset.value;S.life.time=0;S.life.playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;S.life.explode=false;S.selected=null;S.marks=[];S.annotations=[];S.lifeGuess='';S.checkedLife=false;render();view('whole');break;
 case 'select':S.selected=b.dataset.value;if(S.wire)wireWheel(S.selected);else render();break;
 case 'detail':S.detail=!S.detail;renderTools();dirty=true;break;
 case 'front':view('front');break;
 case 'whole':view('whole');break;
 case 'focus':view('close');break;
 case 'side':R.targetCam=null;R.camera.yaw+=Math.PI/3;dirty=true;break;
 case 'zoomIn':R.targetCam=null;R.camera.dist=Math.max(3.3,R.camera.dist*.82);dirty=true;break;
 case 'zoomOut':R.targetCam=null;R.camera.dist=Math.min(60,R.camera.dist*1.22);dirty=true;break;
 case 'mark':markAxes();break;
 case 'mechanism':S.life.mechanism=!S.life.mechanism;render();break;
 case 'explode':S.life.explode=!S.life.explode;S.life.playing=false;S.selected=S.selected||'P1';render();if(S.life.explode)view('close');break;
 case 'trace':S.trace=!S.trace;render();break;
 case 'lifeGuess':S.lifeGuess=b.dataset.value;S.checkedLife=false;render();break;
 case 'checkLife':if(!S.selected){S.selected=(drawnWheels[0]||{}).id}S.checkedLife=true;S.life.playing=false;updateMetrics();break;
 case 'angle':pushUndo();beginEdit();S.fixed.angle=Number(b.dataset.value);render();view('whole');break;
 case 'shift':pushUndo();beginEdit();S.fixed.shift=Number(b.dataset.value);render();break;
 case 'direct':S.compareDirect=b.dataset.value==='on';S.pick=false;render();view('whole');break;
 case 'compareMode':S.compareMode=b.dataset.value;resetPosition();render();break;
 case 'data':S.data=!S.data;render();break;
 case 'arrows':S.arrows=!S.arrows;render();break;
 case 'prediction':rig().prediction=b.dataset.value;render();if($('predictionDetails'))$('predictionDetails').open=true;break;
 case 'pick':S.pick=!S.pick;S.checked=false;S.picked=[];render();break;
 case 'checkStrands':if(!segments.length){toast('先完成绳路，才能比较支承关系。');break}S.checked=true;dirty=true;updateMetrics();break;
 case 'toBuilder':{let copy=clone(rig());setPage('builder');S.builder=copy;S.builder.angle=0;S.builder.shift=0;S.builder.s=0;S.builder.tested=false;S.selected=copy.components[0]?.id;render();break}
 case 'preset':switchPreset(b.dataset.value);break;
 case 'add':{const r=S.builder;if(r.components.length>=4)return;pushUndo();beginEdit();const id=['A','B','C','D'].find(id=>!r.components.some(c=>c.id===id));r.components.push({id,mount:null});S.selected=id;render();toast('新滑轮已加入。选择挂在横梁，或连接货物。');break}
 case 'mount':{const c=S.builder.components.find(x=>x.id===S.selected);if(!c)return;pushUndo();beginEdit();if(c.mount!==b.dataset.value&&S.builder.route.includes(c.id)){S.builder.route=[];S.builder.complete=false;S.wire=true}c.mount=b.dataset.value;render();break}
 case 'remove':{if(!S.selected)return;pushUndo();beginEdit();S.builder.components=S.builder.components.filter(x=>x.id!==S.selected);if(S.builder.route.includes(S.selected)){S.builder.route=[];S.builder.complete=false;S.wire=true}S.selected=null;render();break}
 case 'wire':pushUndo();beginEdit();S.builder.route=[];S.builder.complete=false;S.wire=true;S.pick=false;render();break;
 case 'anchor':pushUndo();beginEdit();S.builder.anchor=b.dataset.value;S.builder.route=[];S.builder.complete=false;render();break;
 case 'undoRoute':pushUndo();beginEdit();S.builder.route.pop();S.builder.complete=false;render();break;
 case 'finishWire':if(S.builder.route.length){pushUndo();S.builder.complete=true;const p=Core.inspect(S.builder);if(!p.valid){S.builder.complete=false;toast(p.reason)}else{S.wire=false;S.runReason='绳路连通。先预测，再试拉。'}render()}break;
 case 'undo':{const u=S.undo[S.page];if(u&&u.length){S[S.page]=u.pop();S.run=false;S.runReason='';S.wire=!rig().complete;S.selected=null;S.picked=[];S.checked=false;render()}break}
 case 'arrowTool':case 'inkTool':S.life.playing=false;S.run=false;S.tool=S.tool===(action==='arrowTool'?'arrow':'ink')?'grab':action==='arrowTool'?'arrow':'ink';renderTools();break;
 case 'clearMarks':S.annotations=[];S.marks=[];dirty=true;renderTools();break;
 case 'save':save();break;

 case 'restore':restore(Number(b.dataset.index));break;
 case 'deleteSaved':if(confirm('移除这一条保留方案？其他方案保留；建议先导出备份。')){S.snapshots.splice(Number(b.dataset.index),1);const saved=persist();$('savedCount').textContent=S.snapshots.length;showCompare();if(!saved)toast('仅从当前页面移除，本机尚未保存。请查看记录与备份。');}break;
 case 'export':exportDesign();break;
 case 'import':$('importFile').click();break;
 case 'exportComparisons':download('妙用滑轮_方案对照.json',JSON.stringify({kind:'pulley-comparisons',version:2,note:'模型计算，不是实测数据',snapshots:S.snapshots},null,2),'application/json');break;
 case 'challenge':challengeDialog();break;
 case 'taskMode':$('taskForm').dataset.limited=String(b.dataset.value==='limited');$('dialogBody').querySelectorAll('[data-action="taskMode"]').forEach(x=>x.classList.toggle('active',x===b));break;

 case 'fullscreen':{let promise=document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();if(promise)promise.catch(()=>toast('当前浏览器环境不允许全屏，请使用浏览器的全屏功能。'));else toast('当前浏览器未提供全屏接口。');break}
 }

}

function setupGripInput(el){
 let drag=null;
 el.addEventListener('pointerdown',e=>{
  if(el.dataset.id!=='grip'||S.page==='life')return;e.preventDefault();e.stopPropagation();const p=physics();
  if(!p.valid||!p.enough){S.runReason=!p.valid?p.reason:'可用拉力不足。改变设计后再试。';rig().tested=true;updateMetrics();return}
  const a=R.project(grip.p),b=R.project(V.add(grip.p,grip.dir));if(!a||!b)return;
  S.run=false;drag={x:e.clientX,y:e.clientY,s:rig().s,dx:b.x-a.x,dy:b.y-a.y};el.setPointerCapture(e.pointerId);
 });
 el.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const d=drag,l=d.dx*d.dx+d.dy*d.dy;moveRope(d.s+((e.clientX-d.x)*d.dx+(e.clientY-d.y)*d.dy)/(l||1)*CM)});
 const end=()=>{drag=null};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);
 el.addEventListener('keydown',e=>{if(el.dataset.id!=='grip'||S.page==='life')return;if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();moveRope(rig().s+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1))}});
}
Stage3D.prototype.setupInput=function(){
 const el=this.canvas;let points=new Map(),moved=false,first=null;
 el.style.touchAction='none';
 el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});first={x:e.clientX,y:e.clientY};moved=false;this.targetCam=null});
 el.addEventListener('pointermove',e=>{
  const prev=points.get(e.pointerId);if(!prev)return;const dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
  if(points.size===2){const other=[...points.entries()].find(([id])=>id!==e.pointerId)?.[1];if(other){const old=Math.hypot(prev.x-other.x,prev.y-other.y),next=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(next>5)this.camera.dist=clamp(this.camera.dist*old/next,3.3,65)}}
  else{this.camera.yaw+=dx*.006;this.camera.pitch=clamp(this.camera.pitch+dy*.004,-.18,.9)}
  points.set(e.pointerId,{x:e.clientX,y:e.clientY});dirty=true;
 });
 el.addEventListener('pointerup',e=>{points.delete(e.pointerId);if(!moved&&first){const rect=el.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let best=null,dist=40;for(const w of drawnWheels){const p=this.project(w.p);if(p){const d=Math.hypot(p.x-x,p.y-y);if(d<dist){best=w;dist=d}}}if(best)onWorldClick('wheel:'+best.id)}});
 for(const ev of['pointercancel','lostpointercapture'])el.addEventListener(ev,e=>points.delete(e.pointerId));
 el.addEventListener('wheel',e=>{e.preventDefault();this.targetCam=null;this.camera.dist=clamp(this.camera.dist*Math.exp(e.deltaY*.001),3.3,65);dirty=true},{passive:false});
};

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeDialog();S.tool='grab';S.wire=false;renderTools();return}
 if($('drawer').classList.contains('open')){if(e.key==='Tab'){const nodes=[...$('drawer').querySelectorAll('button:not([disabled]),a,input,select')].filter(x=>x.offsetParent!==null),a=nodes[0],z=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}return}
 if(e.code==='Space'&&e.target===document.body){e.preventDefault();play()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&S.page!=='life'){e.preventDefault();act('undo',{})}
});
let drawing=null;
$('drawlayer').addEventListener('pointerdown',e=>{if(S.tool==='grab')return;e.preventDefault();$('drawlayer').setPointerCapture(e.pointerId);const p=screenWorld(e.clientX,e.clientY);drawing={kind:S.tool,points:[p,p]};S.annotations.push(drawing);dirty=true});
$('drawlayer').addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=screenWorld(e.clientX,e.clientY);if(drawing.kind==='arrow')drawing.points[1]=p;else if(V.len(V.sub(p,drawing.points[drawing.points.length-1]))>.035)drawing.points.push(p);if(drawing.points.length>350)drawing.points.splice(1,1);dirty=true});
for(const ev of['pointerup','pointercancel','lostpointercapture'])$('drawlayer').addEventListener(ev,()=>{if(drawing&&V.len(V.sub(drawing.points[0],drawing.points[drawing.points.length-1]))<.04)S.annotations.pop();drawing=null;dirty=true});
window.addEventListener('resize',()=>{dirty=true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){S.run=false;S.life.playing=false}last=performance.now();dirty=true});
function tick(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(S.page==='life'&&S.life.playing&&!S.life.explode){S.life.time+=dt*S.life.speed;dirty=true}
 if(S.page!=='life'&&S.run){
  const r=rig(),p=physics();if(!p.valid||!p.enough){S.run=false;S.runReason='条件不满足，提升停止。'}else{
   const end=Math.min(r.target*p.n,p.maxS);r.s=Math.min(end,r.s+dt*11);r.tested=true;dirty=true;
   if(r.s>=end-.0001){S.run=false;const q=physics();S.runReason=q.reached?(r.limited&&!q.directionOK?'已到目标高度，但操作方向还不符合任务。':'到达目标高度。保留方案，改变一个条件再比较。'):'可拉绳行程用完，尚未到达目标。试着修改方案或条件。'}
  }
 }
 try{
  if((dirty||R.targetCam)&&(now-lastFrame>(R.soft?65:15))){drawAll();dirty=false;lastFrame=now}
  if(now-lastUI>100){updateMetrics();lastUI=now}
 }catch(e){console.error(e);$('error').style.display='block';$('error').textContent='三维舞台出现问题：'+e.message+'。请重新打开文件。';window.__appError=e.message;return}
 requestAnimationFrame(tick);
}
installSnapshotGuard();
try{
 R=new Stage3D($('world'));
 $('world').addEventListener('webglcontextlost',e=>{e.preventDefault();S.run=false;S.life.playing=false;$('error').style.display='block';$('error').textContent='三维图形上下文中断。请重新打开；设备无法提供WebGL2时会使用Canvas后备。'});
 const hash=location.hash.slice(1);if(PAGE[hash])S.page=hash;if(S.page!=='life')S.life.playing=false;
 render();view('whole');drawAll();requestAnimationFrame(tick);
 window.PulleyLab={version:'2.0',state:S,core:Core,render:()=>{render();drawAll()},view,go:setPage,preset:switchPreset,move:moveRope,play,save,importDesign,sanitizeRig,getScene:()=>({wheels:clone(drawnWheels),segments:clone(segments),grip:clone(grip),camera:clone(R.camera),ropeLength:window.__ropeLength})};
}catch(e){console.error(e);$('error').style.display='block';$('error').textContent='当前浏览器无法初始化三维舞台：'+e.message;window.__appError=e.message}

</script>
