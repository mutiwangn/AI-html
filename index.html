  <script>
  /* 课件清单：记录课次、简介、访问地址及可选作者；教材结构在 curriculum.js。 */
  var books=[{"id":"1-up","title":"一年级上册","cover":"./covers/一上.jpg","lessons":[["2.1","我们的身体","","看、听、摸、照认识身体；遮挡观察左右对称，比较人与猫狗，分层观察骨骼、肌肉和内脏。","./一上2.1我们的身体/"],["2.2","发现生长","","比较身体、衣物、牙齿与本领的变化，画出成长证据，再迁移观察小猫和植物。","./一上2.2发现生长/"],["2.3","游戏中的观察","","比较三种条件抓尺子，记录每位同学的真实结果，发现眼睛、耳朵和皮肤提供的信息，并拓展翻拍手游戏。","./一上2.3游戏中的观察/"],["2.4","气味告诉我们","","练习安全闻气味，记录四个纸袋的真实猜想，开袋核对，再借助外形与触摸线索修正判断。","./一上2.4气味告诉我们/"],["2.5","通过感官来发现","","三页互动版：校园感官线索、两种感官图画记录、首次与再次观察对照、保护感官；支持校园照片导入和记录图片导出。","./一上2.5通过感官来发现/"],["2.6","观察与比较","","两杯并排比较、排序编号；滴入搅匀后配出中间色，保留尝试前后对照；用图章、画笔与实物照片记录比较过程。","./一上2.6观察与比较/"]]},{"id":"1-down","title":"一年级下册","cover":"./covers/一下.jpg","lessons":[]},{"id":"2-up","title":"二年级上册","cover":"./covers/二上.jpg","lessons":[["2.4","不同的天气","","校园双窗对比晴阴雨雪和风，讨论天气影响，绘写真实观察并生成记录图片。","./二上2.4不同的天气/"],["2.5","不同的季节","","同地点四季对照、多季节图卡归类与真实观察记录，认识季节对生活和动植物的影响。","./二上2.5不同的季节/"],["2.6","太阳与白天","","同地点早中晚太阳位置对照、转身辨方向与真实观察记录，安全认识太阳和白天。","./二上2.6太阳与白天/"]]},{"id":"2-down","title":"二年级下册","cover":"./covers/二下.jpg","lessons":[]},{"id":"3-up","title":"三年级上册","cover":"./covers/三上.jpg","lessons":[["1.1","我们关心天气","","同校园跨时留影对照天气要素，追踪大气中的风云雨雪，保留本班真实观察与CSV/SVG对照图。","./三上1.1我们关心天气/"],["1.2","认识气温计","","观察气温计结构与刻度，调节液柱，练习正确读写零上、零下气温和平视读数。","./三上1.3测量气温【王宁】/"],["1.3","测量气温","","规范测量、同地点五时点实测记录、涂液柱连线研讨；实测与模拟分开，支持本机保存和CSV/PNG导出。","./三上1.3测量气温/"],["1.4","测量降水量","","在雨量器实验台比较不同容器，模拟降水测量并观察雨量读数。","./三上1.4测量降水量【王宁】/"],["1.5","观测风","","操作风向与风力模拟工具，练习观察、判断风向风力并记录依据。","./三上1.5观测风【王宁】/"],["1.6","观察云","","模拟天空云量，认识典型云形，并记录云量和云的变化。","./三上1.6观察云【王宁】/"],["1.7","天气预报","","读懂天气符号与预报字段，沿时间联动观察；同日同地比较瞬时观测与全天范围，录入真实资料并导出对照卡。","./三上1.7天气预报/"],["1.8","天气的影响","【镇海区实验小学 徐敏】","比较不同天气对职业、生活和动植物的影响，通过猜想、揭晓与冷热观察形成发现。","./三上1.8天气的影响【徐敏】/"],["2.1","水到哪里去了","【镇海区实验小学 许易】","从生活情境寻找蒸发现象，完成实验预测、模拟观察与记录。","./三上2.1水到哪里去了【许易】/"],["2.3","水沸腾了","【镇海区实验小学 林雅】","选择器材、模拟加热与观察沸腾现象，读取温度变化并绘制曲线。","./三上2.3水沸腾了【林雅】/"],["2.4","水结冰了","","二维交互实验：搭建冰盐冷却装置、观察结冰与温度变化、记录真实数据，并探索热胀冷缩生活实例。","./三上2.4水结冰了/"],["2.5","冰熔化了","","比较敲碎、吹气、手焐的熔化现象，用三态变化与蜡的受热冷却解释生活中的现象。","./三上2.5冰熔化了/"],["2.6","水能溶解多少物质","","设计公平实验，逐份比较食盐和小苏打的溶解；记录全班真实证据，探索加水与温水的影响。","./三上2.6水能溶解多少物质/"],["2.7","加快溶解","","三页贯穿课堂：设计公平实验，汇总全班实测，观察微观溶解，并迁移到研磨与生活探究。","./三上2.7加快溶解/"],["2.7","加快溶解","【镇海区实验小学 凌瀚】","控制搅拌、水温与颗粒大小，进行公平的对比实验，记录食盐溶解快慢。","./三上2.7加快溶解【凌瀚】/"],["2.8","用水分离","","加水溶解与装配过滤，蒸发冷却后比较食盐，再用盐田晒盐和简易净水迁移探究。","./三上2.8用水分离/"],["3.1","运动和位置","","固定旗杆比较小车、小狗和长椅的位置变化；拖动同学，用方向和距离说位置；蒙眼找朋友，逐步补全方向与距离线索。","./三上3.1运动和位置/"],["3.2","各种各样的运动","","相机录像、运动叠影与红点追踪，观察和比较物体不同位置的运动轨迹。","./三上3.2各种各样的运动/"],["3.3","直线运动和曲线运动","","观察生活中的运动路线，比较自由、直线和曲线轨道击球，先预测再慢放验证小球冲出桌面的轨迹。","./三上3.3直线运动和曲线运动/"],["3.4","相同距离比快慢","","动物百米排序、水平双轨同时与错开出发、单轨秒表测量；用相同距离的运动时间比较快慢。","./三上3.4相同距离比快慢/"],["3.5","相同时间比快慢","","比较交通工具1小时的路程，相反方向脚跟接脚尖走路并量距离，再用不同起点的追逐跑比较运动距离。","./三上3.5相同时间比快慢/"],["3.6","运动和能量","","拖动斜面、自然释放小球，用木块移动距离记录证据；并排比较不同坡度，再观察足球、水车和风车中的能量传递。","./三上3.6运动和能量/"],["3.7","设计和制作“过山车”","","拖拽设计俯视路线、沿轨道测长，调节支架高度让小球自然滚动，在试跑中发现问题并改进方案。","./三上3.7设计和制作过山车/"],["3.8","测试“过山车”","","观察小球运动，在相同路程或相同时间下公平比较，调整支点高度并用终点碰撞验证改进。","./三上3.8测试过山车/"]]},{"id":"3-down","title":"三年级下册","cover":"./covers/三下.jpg","lessons":[["2.1","不同种类的动物","","通过互动动物城建设，认识和比较不同种类动物的特点。","./三下2.1不同种类的动物/"]]},{"id":"4-up","title":"四年级上册","cover":"./covers/四上.jpg","lessons":[["1.1","感受空气","","逐帧观察四种材料入水后的气泡证据，比较空气与水，区分现象和解释并保留真实观察记录。","./四上1.1感受空气/"],["1.3","空气占据的空间会改变吗","","并排比较空气与水的注射器推压，切换封口与开口及解释模型，记录真实实验并迁移到倒扣瓶情境。","./四上1.3空气占据的空间会改变吗/"],["1.4","空气有质量吗","","联动打气、放气与天平称量，用守恒的模型微粒观察变化；比较两球按压、碰撞和回弹，明确称量才是质量证据。","./四上1.4空气有质量吗/"],["2.1","我们的呼吸与消化","","在身体体验地图标记真实感受，区分观察与猜想，整理交流卡和研究问题，导出本班探究记录。","./四上2.1我们的呼吸与消化/"],["2.2","认识呼吸器官","","透视人体呼吸，操作材料模型，观察呼吸器官的动态变化。","./四上2.2认识呼吸器官/"],["2.4","测量肺活量","","短吸管吹气、密封卷袋读数；用Z-Anatomy人体模型认识肺活量与健康，探索排水式等简易测量仪器。","./四上2.4测量肺活量/"],["2.5","口腔里的消化","","观察咀嚼1、5、10次的变化；探索牙齿分工与舌、唾液的合作，支持小组记录、过程照片和教师点评。","./四上2.5口腔里的消化/"],["2.6","胃和小肠里的消化","","保留初始猜想并修正；长按揉挤胃模型，制作、展开小肠模型，观察消化与吸收，导出真实观察记录。","./四上2.6胃和小肠里的消化/"],["2.7","食物在身体里的旅行","","先画预测路线并拖动器官贴纸，再通过剖面透视观察食物沿消化道的变化；比较呼吸与吞咽通道，保存修正前后图。","./四上2.7食物在身体里的旅行/"],["2.8","呵护我们的器官","","汇总真实班级调查，比较鼻毛与黏液的保护作用、鼻塞对通气的影响；操作洗手、通风、护鼻和刷牙，形成健康约定。","./四上2.8呵护我们的器官/"],["3.1","声音是怎样产生的","","放大观察橡皮筋等物体的振动，比较发声与止振状态，再追踪声带、扬声器和蟋蟀的声音来源。","./四上3.1声音是怎样产生的/"],["3.2","声音的强弱","","拖动钢尺、放大慢放并叠加两次振动范围；用同一比例保留、回听真实录音，比较声音强弱。","./四上3.2声音的强弱/"],["3.3","声音的高低","","调节钢尺伸出长度，慢放对照振动快慢；独立比较音调与强弱。","./四上3.3声音的高低/"],["3.4","乐器的声音变化","","调节吉他琴弦的粗细、松紧和有效振动长度，透视排箫空气柱；用同刻度轨迹与A/B试听比较声音的高低和强弱。","./四上3.4乐器的声音变化/"],["3.5","设计我们的乐器","","选择纸盒琴、水杯琴或封底排箫，联动调整结构与音高；保留设计方案、试奏比较，并导出与实物制作衔接的设计单。","./四上3.5设计我们的乐器/"],["3.6","改进我们的乐器","","连续调音与结构改进，同条件前后试听，实物录音和版本记录","./四上3.6改进我们的乐器/"],["3.7","声音的传播","","放大追踪微粒往复与声波扩散；透视空气、水、固体的传声路径，比较抽气钟罩与土电话的传播效果。","./四上3.7声音的传播/"],["3.8","保护听力","","逐站追踪耳内声音传递，放大鼓膜振动；比较降音量、远离、耳罩与缩短时间的作用，联系生活分贝并记录实测。","./四上3.8保护听力/"]]},{"id":"4-down","title":"四年级下册","cover":"./covers/四下.jpg","lessons":[]},{"id":"5-up","title":"五年级上册","cover":"./covers/五上.jpg","lessons":[["1.1","研究放大镜","","同点倍率与视野联动，剖面对照区分凸度和厚度。","./五上1.1研究放大镜/"],["1.2","怎样放得更大","","调节双凸透镜镜距，同步比较像的大小与清晰度；透视中间像和光路，保留单镜／双镜快照，圈画实拍或模拟图并导出观察对照。","./五上1.2怎样放得更大/"],["1.3","用简易显微镜观察","","同一物体的全貌、取景位置和显微视野联动；记录扫描位置，保留同一区域不同倍率图像，真实照片与观察图圈注对照。","./五上1.3用简易显微镜观察/"],["1.4","用光学显微镜观察","","反光镜、镜筒位置与目镜视野同步；拖动玻片观察倒像与高倍取景，保留同区画面、导入照片并自主绘图记录。","./五上1.4用光学显微镜观察/"],["1.5","观察细胞","","真实照片与示意图区分，支持并排圈画比较；拖动几何切面，联动查看立体细胞与二维切面，保留不同层面的结构对照。","./五上1.5观察细胞/"],["1.6","观察水中的微小生物","","追踪微小生物与水流参照；显微影像慢放、留帧叠影与双点记录","./五上1.6观察水中的微小生物/"],["1.7","微生物与人类","","宏观与微观联动追踪发酵、霉变和分解；同条件回放食品保存与公筷传播路径，自主整理利弊与控制关系。","./五上1.7微生物与人类/"],["2.1","各种各样的工具","","同一批书在走廊、窄路与楼梯中换工具比较，观察通行条件与运输次数；拆看独轮车结构，保留条件对照并导出观察图。","./五上2.1各种各样的工具/"],["2.2","独轮车省力的秘密","","3D 独轮车拆解、杠杆模拟实验与生活工具观察。","./五上2.2独轮车省力的秘密/"],["2.3","制作独轮车","","二维选材设计与杠杆三点观察，焊接组装后在三维工地搬运砖块，体验体力消耗与三星评价。","./五上2.3制作独轮车/"],["2.4","巧用斜面","","开放工地装车挑战：自主选择装货数量，搭建直坡或折返坡，比较同载重推力、运输路程与改进结果；拓展引桥、无障碍坡道、螺纹和盘山公路。","./五上2.4巧用斜面/"],["2.4","巧用斜面","【镇海区九龙湖中心学校 王剑青】","用木板和木块搭建直坡、L形及折返斜面，比较省力程度、路径长度与占地空间。","./五上2.4巧用斜面【王剑青】/"],["2.5","妙用滑轮","","真实实验后的三维观察、轴心留痕、力与位移对照，以及自由挂接、穿绳改装。","./五上2.5妙用滑轮/"],["2.7","推动社会发展的工具和技术","","从部件追踪工具与共用技术，保留猜想和查证关系；改变印数、改字、复用与供电条件，用同一时钟比较印刷工序并导出观察图。","./五上2.7推动社会发展的工具和技术/"],["3.1","拆解我的小车模型","","分层拆解与连接追踪，慢放齿轮传动并同刻对照断开状态；比较月球车结构与环境关系，支持本机记录和TXT/SVG导出。","./五上3.1拆解我的小车模型/"],["3.2","用重力驱动小车","","改变垫圈数量，慢放与等时位置观察重力小车；汇总三次模拟及实测记录，挑战1米3秒精准到站。","./五上3.2用重力驱动小车/"],["3.3","用弹力驱动小车","","透视皮筋绕轴与慢放驱动、滑行过程；拖旗预测并同条件比较圈数，用三次实测圆点纸带保留证据，支持数字键盘与数据导出。","./五上3.3用弹力驱动小车/"],["3.4","测量力的大小","","观察条形盒式与圆筒式测力计的结构、弹簧伸长和重物联动；切换量程，练习调零、平视读数与即时判分。","./五上3.4测量力的大小/"],["3.5","摩擦力的比较","","水平拖动测力计，放大启动与匀速读数；控制变量比较滚动、轮面和载重，汇总三次模拟及实测数据，再探究自行车轮轴与胎面的不同摩擦需求。","./五上3.5摩擦力的比较/"],["3.6","制作“月球小车”","","双工作区：三视图同步设计与预算、质量对照；透视电机、齿轮和车轴的传动，比较断路、遮光与齿轮脱开的不同结果，导出设计单衔接实物制作。","./五上3.6制作月球小车/"],["3.7","评价“月球小车”","","同条件改进前后同步回放，放大轮地接触与俯视轨迹；导入实物视频慢放、标点计时，再保留三次真实测试与可协商评价，支持记录和证据图导出。","./五上3.7评价月球小车/"],["4.1","地球的表面","","旋转展开世界球体，查看中国地形案例与西高东低趋势示意；比较五类教学地形和来源模型，剖切描摹、制作分类卡并导出记录。","./五上4.1地球的表面/"],["4.2","火山喷发对地表的作用","","剖开火山追踪岩浆、同步放大气体变化；等量比较熔岩流动与多次堆积，保留原地表和对照轮廓，拖动测高线生成证据图。","./五上4.2火山喷发对地表的作用/"],["4.3","地震对地表的作用","","透视地下断层的缓慢积累、突然错动与振动传播；改变坡体和河道条件，同步对照滑坡、堵河与蓄水，保留关键帧形成证据图。","./五上4.3地震对地表的作用/"],["4.4","地球表面的岩石","","拖动取样框联动放大岩石颗粒，导入实物照片；跨矿物刻画并擦拭，保留同区前后证据和观察对照。","./五上4.4地球表面的岩石/"],["4.5","岩石的类别与变化","","自主追踪岩石变化路径、内部机制放大、冷热与冻融同条件对照、暂停回看、SVG观察记录；单文件离线。","./五上4.5岩石的类别与变化/"],["4.6","水对地表的作用","","透视坡面并追踪土粒来源，回看侵蚀与沉积；沿河俯视和剖面联动，保留同进度对照，生成模型观察图。","./五上4.6水对地表的作用/"],["4.7","风对地表的作用","","追踪同一批沙粒的去向，保留同进程对照；放大有沙与无沙气流的岩面磨蚀，自主连接地表变化因素并导出观察图。","./五上4.7风对地表的作用/"]]},{"id":"5-down","title":"五年级下册","cover":"./covers/五下.jpg","lessons":[["4.5","船的最大装载量","","比较不同液体中的漂浮高度，使用浮标记录证据，探索船的安全装载。","./五下4.5船的最大装载量【王宁】/"]]},{"id":"6-up","title":"六年级上册","cover":"./covers/六上.jpg","lessons":[["2.1","怎样能看到物体","","黑盒视野与剖面同步、两段光路独立遮挡、天窗三桌对照及模型/实物记录；单文件离线","./六上2.1怎样能看到物体/"],["2.2","光是怎样传播的","【镇海区鲲池小学 王宁】","光斑与光路同步，预测线叠加和卡纸连续遮挡；逐点追踪小孔倒像，拖动纸屏比较像高，保留模型与实物观察并导出证据。","./六上2.2光是怎样传播的/"],["2.5","设计潜望镜","","调节镜面观察光路，剖切拆解自己的Z字形潜望镜，选择生活材料，并拖动小人与装置完成四种平面情境练习。","./六上2.5设计潜望镜/"],["3.1","利用地球模型来研究","","逐层拆看海陆、赤道、经纬网与地轴；透视空间关系，同视角删减模型信息并比较证据，保留观察与问题，支持图片和文字导出。","./六上3.1利用地球模型来研究/"],["3.2","昼夜交替的解释","","第一视角看昼夜，手绘并保存自己的假说；跟随同一观察者验证，再同屏比较地心说与日心说。","./六上3.2昼夜交替的解释/"],["3.3","地球如何自转","","四种地轴姿态和自由调节联动球面受光；追踪地面观察点，展开24小时昼夜证据并导出记录。","./六上3.3地球如何自转/"],["3.4","谁先迎来黎明","","三页探究：4K地球仪定位，手拉手、大蒜、汽车与转椅多视角模拟，24小时昼夜记录，以及两地小学真实历史作息差值对照；单文件离线小于1 MB。","./六上3.4谁先迎来黎明/"],["3.5","影长的四季变化","","旋转拆解圭表，按城市、日期和时刻比较太阳高度与影长；用纸板圭表和手电筒模拟节气，留影对照与导出查询记录。","./六上3.5影长的四季变化/"],["3.6","地球的公转","","追踪一年与地轴留影，恢复真实轨道比例并换算教室绳长，保留南北半球季节预测与教材证据，检验近热远冷的解释。","./六上3.6地球的公转/"],["3.7","四季变化","","等量光束与光斑、影长联动；跟随地球比较南北半球正午高度与昼长，改变地轴描出全年曲线，保留并导出观察证据。","./六上3.7四季变化/"],["4.1","时间在流逝","","前段预测与后段验证、累计时间拆分、实测记录与日影追踪。","./六上4.1时间在流逝/"],["4.2","用水计量时间","","连续放水与倒回再测同步回放，拆分累计时间；透视补水和溢流条件，保留本班实测记录与CSV导出。","./六上4.2用水计量时间/"],["4.3","做个水钟","","透视稳水装置，对照每分钟水量；标定时间刻度，再用独立试测与实物记录检验误差。","./六上4.3做个水钟/"],["4.4","改进水钟","","透视供水、出水与溢流，同场回看2分钟和10分钟的读数及逐分钟水量；比较重标与沿用刻度，保留三次实物记录，导出模型SVG和实测CSV。","./六上4.4改进水钟/"],["4.5","机械摆钟","【镇海区鲲池小学 王宁】","慢放完整往返，展开40秒轨迹；对齐前后时段，保留三类真实实验记录和差异，支持CSV与证据图导出。","./六上4.5机械摆钟/"],["4.6","制作钟摆","【镇海区鲲池小学 王宁】","同步调校与完整往返回看、30/60秒测量、一小时累计误差、木条圆片重心透视；保留三次实测平均与CSV/SVG证据。","./六上4.6制作钟摆/"],["4.7","时间与变化","","年轮跨样本配准、珊瑚日纹放大计数与一天时长推算、地层形成回看和前后证据判断；支持本机记录与CSV/SVG导出。","./六上4.7时间与变化/"]]},{"id":"6-down","title":"六年级下册","cover":"./covers/六下.jpg","lessons":[]}];
