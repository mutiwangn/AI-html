  <script>
  /* 课件清单：保留原有课次、作者、简介及访问地址；教材结构在 curriculum.js。 */
  var books=[{"id":"1-up","title":"一年级上册","cover":"./covers/一上.jpg","lessons":[["2.1","我们的身体","【镇海区鲲池小学 王宁】","看、听、摸、照认识身体；遮挡观察左右对称，比较人与猫狗，分层观察骨骼、肌肉和内脏。","./一上2.1我们的身体/"],["2.2","发现生长","【镇海区鲲池小学 王宁】","比较身体、衣物、牙齿与本领的变化，画出成长证据，再迁移观察小猫和植物。","./一上2.2发现生长/"],["2.3","游戏中的观察","【镇海区鲲池小学 王宁】","比较三种条件抓尺子，记录每位同学的真实结果，发现眼睛、耳朵和皮肤提供的信息，并拓展翻拍手游戏。","./一上2.3游戏中的观察/"],["2.4","气味告诉我们","【镇海区鲲池小学 王宁】","练习安全闻气味，记录四个纸袋的真实猜想，开袋核对，再借助外形与触摸线索修正判断。","./一上2.4气味告诉我们/"]]},{"id":"1-down","title":"一年级下册","cover":"./covers/一下.jpg","lessons":[]},{"id":"2-up","title":"二年级上册","cover":"./covers/二上.jpg","lessons":[]},{"id":"2-down","title":"二年级下册","cover":"./covers/二下.jpg","lessons":[]},{"id":"3-up","title":"三年级上册","cover":"./covers/三上.jpg","lessons":[["1.3","测量气温","【镇海区鲲池小学 王宁】","模拟读数与气温计刻度放大，练习正确读取零上、零下的气温。","./三上1.3测量气温【王宁】/"],["1.4","测量降水量","【镇海区鲲池小学 王宁】","在雨量器实验台比较不同容器，模拟降水测量并观察雨量读数。","./三上1.4测量降水量【王宁】/"],["1.5","观测风","【镇海区鲲池小学 王宁】","操作风向与风力模拟工具，练习观察、判断风向风力并记录依据。","./三上1.5观测风【王宁】/"],["1.6","观察云","【镇海区鲲池小学 王宁】","模拟天空云量，认识典型云形，并记录云量和云的变化。","./三上1.6观察云【王宁】/"],["1.8","天气的影响","【镇海区实验小学 徐敏】","比较不同天气对职业、生活和动植物的影响，通过猜想、揭晓与冷热观察形成发现。","./三上1.8天气的影响【徐敏】/"],["2.1","水到哪里去了","【镇海区实验小学 许易】","从生活情境寻找蒸发现象，完成实验预测、模拟观察与记录。","./三上2.1水到哪里去了【许易】/"],["2.3","水沸腾了","【镇海区实验小学 林雅】","选择器材、模拟加热与观察沸腾现象，读取温度变化并绘制曲线。","./三上2.3水沸腾了【林雅】/"],["2.4","水结冰了","【镇海区鲲池小学 王宁】","二维交互实验：搭建冰盐冷却装置、观察结冰与温度变化、记录真实数据，并探索热胀冷缩生活实例。","./三上2.4水结冰了/"],["2.5","冰熔化了","【镇海区鲲池小学 王宁】","比较敲碎、吹气、手焐的熔化现象，用三态变化与蜡的受热冷却解释生活中的现象。","./三上2.5冰熔化了/"],["2.6","水能溶解多少物质","【镇海区鲲池小学 王宁】","设计公平实验，逐份比较食盐和小苏打的溶解；记录全班真实证据，探索加水与温水的影响。","./三上2.6水能溶解多少物质/"],["2.7","加快溶解","【镇海区鲲池小学 王宁】","三页贯穿课堂：设计公平实验，汇总全班实测，观察微观溶解，并迁移到研磨与生活探究。","./三上2.7加快溶解/"],["2.7","加快溶解","【镇海区实验小学 凌瀚】","控制搅拌、水温与颗粒大小，进行公平的对比实验，记录食盐溶解快慢。","./三上2.7加快溶解【凌瀚】/"],["2.8","用水分离","【镇海区鲲池小学 王宁】","加水溶解与装配过滤，蒸发冷却后比较食盐，再用盐田晒盐和简易净水迁移探究。","./三上2.8用水分离/"],["3.2","各种各样的运动","【镇海区鲲池小学 王宁】","相机录像、运动叠影与红点追踪，观察和比较物体不同位置的运动轨迹。","./三上3.2各种各样的运动/"],["3.3","直线运动和曲线运动","【镇海区鲲池小学 王宁】","观察生活中的运动路线，比较自由、直线和曲线轨道击球，先预测再慢放验证小球冲出桌面的轨迹。","./三上3.3直线运动和曲线运动/"]]},{"id":"3-down","title":"三年级下册","cover":"./covers/三下.jpg","lessons":[["2.1","不同种类的动物","【镇海区鲲池小学 王宁】","通过互动动物城建设，认识和比较不同种类动物的特点。","./三下2.1不同种类的动物/"]]},{"id":"4-up","title":"四年级上册","cover":"./covers/四上.jpg","lessons":[["2.2","认识呼吸器官","【镇海区鲲池小学 王宁】","透视人体呼吸，操作材料模型，观察呼吸器官的动态变化。","./四上2.2认识呼吸器官/"],["2.4","测量肺活量","【镇海区鲲池小学 王宁】","短吸管吹气、密封卷袋读数；用Z-Anatomy人体模型认识肺活量与健康，探索排水式等简易测量仪器。","./四上2.4测量肺活量/"],["2.5","口腔里的消化","【镇海区鲲池小学 王宁】","观察咀嚼1、5、10次的变化；探索牙齿分工与舌、唾液的合作，支持小组记录、过程照片和教师点评。","./四上2.5口腔里的消化/"],["2.6","胃和小肠里的消化","【镇海区鲲池小学 王宁】","保留初始猜想并修正；长按揉挤胃模型，制作、展开小肠模型，观察消化与吸收，导出真实观察记录。","./四上2.6胃和小肠里的消化/"],["2.8","呵护我们的器官","【镇海区鲲池小学 王宁】","汇总真实班级调查，比较鼻毛与黏液的保护作用、鼻塞对通气的影响；操作洗手、通风、护鼻和刷牙，形成健康约定。","./四上2.8呵护我们的器官/"]]},{"id":"4-down","title":"四年级下册","cover":"./covers/四下.jpg","lessons":[]},{"id":"5-up","title":"五年级上册","cover":"./covers/五上.jpg","lessons":[["2.2","独轮车省力的秘密","【镇海区鲲池小学 王宁】","3D 独轮车拆解、杠杆模拟实验与生活工具观察。","./五上2.2独轮车省力的秘密/"],["2.3","制作独轮车","【镇海区鲲池小学 王宁】","二维选材设计与杠杆三点观察，焊接组装后在三维工地搬运砖块，体验体力消耗与三星评价。","./五上2.3制作独轮车/"],["2.4","巧用斜面","【镇海区鲲池小学 王宁】","开放工地装车挑战：自主选择装货数量，搭建直坡或折返坡，比较同载重推力、运输路程与改进结果；拓展引桥、无障碍坡道、螺纹和盘山公路。","./五上2.4巧用斜面/"],["2.4","巧用斜面","【镇海区九龙湖中心学校 王剑青】","用木板和木块搭建直坡、L形及折返斜面，比较省力程度、路径长度与占地空间。","./五上2.4巧用斜面【王剑青】/"]]},{"id":"5-down","title":"五年级下册","cover":"./covers/五下.jpg","lessons":[["4.5","船的最大装载量","【镇海区鲲池小学 王宁】","比较不同液体中的漂浮高度，使用浮标记录证据，探索船的安全装载。","./五下4.5船的最大装载量【王宁】/"]]},{"id":"6-up","title":"六年级上册","cover":"./covers/六上.jpg","lessons":[]},{"id":"6-down","title":"六年级下册","cover":"./covers/六下.jpg","lessons":[]}];
  window.AIHTMLCatalog.init(books);
  </script>
