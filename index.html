  <script>
  /* 课件清单：记录课次、简介、访问地址及可选作者；教材结构在 curriculum.js。 */
  var books=[{"id":"1-up","title":"一年级上册","cover":"./covers/一上.jpg","lessons":[["1.1","我们知道的植物","","在校园示意图找植物并放大观察，交流花、草和大树的特点；可在本地照片上圈画发现，保存完整记录图。","./一上1.1我们知道的植物/"],["1.2","观察植物","","从整体到局部观察同一植株，比较薄荷与仙人掌；回到真实植物，用看、摸、闻点选观察卡。","./一上1.2观察植物/"],["1.3","植物长在哪里","","打开花盆、荷花、浮萍与无土栽培剖面，观察根与环境的关系；分组记录绿豆的 14 次真实观察。","./一上1.3植物长在哪里/"],["1.4","给植物画张“像”","","植物观察手册 v10.1：放大观察、描画填色、双图对照与圈记；内嵌 10 组 AI 图片和配套线稿，保留教师素材管理。","./一上1.4给植物画张像/"],["1.5","植物的变化","","无损精简单文件：4组24张植物变化示意，保留排序、日期验证、连续播放、原图放大与教师相册导入保存。","./一上1.5植物的变化/"],["1.6","校园里的植物","","课堂实地观察工具 v1.0：安全准备、两株植物空白绘画与观察点选、并列比较；不替代《植物探索镜 v2》拓展版。","./一上1.6校园里的植物/"],["2.1","我们的身体","","独立重制辅助稿：全程点选身体外形部位、常见左右对应和感官证据，点选记录真实观察；无打字、不评价身体差异，教材教参待核。","./一上2.1我们的身体/"],["2.2","发现生长","","比较身体、衣物、牙齿与本领的变化，画出成长证据，再迁移观察小猫和植物。","./一上2.2发现生长/"],["2.3","游戏中的观察","","独立重制辅助稿：抓尺子三种信息条件的公平比较，两组真实结果分别记录并导出；不以电脑计时测反应、不排名，教材教参待核。","./一上2.3游戏中的观察/"],["2.4","气味告诉我们","","独立重制辅助稿：安全扇闻示意，四袋各自保留猜想、开袋核对及多感官修订，汇总导出真实记录；不预填答案，教材教参待核。","./一上2.4气味告诉我们/"],["2.5","通过感官来发现","","三页互动版：校园感官线索、两种感官图画记录、首次与再次观察对照、保护感官；支持校园照片导入和记录图片导出。","./一上2.5通过感官来发现/"],["2.6","观察与比较","","两杯并排比较、排序编号；滴入搅匀后配出中间色，保留尝试前后对照；用图章、画笔与实物照片记录比较过程。","./一上2.6观察与比较/"],["2.7","做个“时间胶囊”","","想象未来、区分真实记录与推测，核对纸上日期和封存物品；课堂演示不收集身体数据，不替代实物保管或长期保存。","./一上2.7做个时间胶囊/"]]},{"id":"1-down","title":"一年级下册","cover":"./covers/一下.jpg","lessons":[["1.1","观察物体的特征","","已核学生教材核心活动：九件物体按颜色、形状、软硬、厚薄和表面独立记录，A/B有向比较、双侧汇总与同伴猜特征；教参及明确版次待核。","./一下1.1观察物体的特征/"],["1.2","给物体分类","","已核学生教材核心活动：同九物编号分成两类，按形状、软硬或材料保留独立分法，隐去特征供同伴猜标准；教参及明确版次待核。","./一下1.2给物体分类/"],["1.3","比较物体的轻重","","已核学生教材核心活动：玻璃球、乒乓球、空盒子、小木块经过猜、掂、称三轮独立排序，保留并列与暂分不清，对照变化；教参及明确版次待核。","./一下1.3比较物体的轻重/"],["1.4","认识物体的形状","","已核学生教材核心活动：区分接触面与运动示意，独立记录低斜板上的运动和易滚程度，保存三次实物合作堆叠的上下摆法与现象；教参及明确版次待核。","./一下1.4认识物体的形状/"],["1.5","观察一瓶水","","已核学生教材核心活动：记录水与牛奶颜色、水与洗发水气味，并列换容器和横竖瓶静止示意，汇总真实观察及等体积水油称量；教参及明确版次待核。","./一下1.5观察一瓶水/"],["1.6","哪个流动得快","","已核学生教材核心活动：分别记录水油触感，核对公平条件与时间到放平板步骤，独立标记三次双液长度和比较发现，不预设输赢；教参及明确版次待核。","./一下1.6哪个流动得快/"],["1.7","它们去哪里了","","已核学生教材核心活动：食盐、红糖、小石子放入前、搅拌前、搅拌后三阶段独立观察，九格汇总颗粒与颜色，研讨溶解不是消失；教参及明确版次待核。","./一下1.7它们去哪里了/"],["2.1","我们周围的动物","","已核学生教材核心活动：双图比较、校园寻访九格自由绘画、环境类别记录与共同辨认；同种编号合并统计，待辨认单列，不预填真实发现；教参及明确版次待核。","./一下2.1我们周围的动物/"],["2.2","观察一种动物","","已核学生教材核心活动：整体与局部观察蜗牛，自由绘画，独立记录轻声说话、菜叶、棉签轻触反应及透明板和树枝上的运动；教参及明确版次待核。","./一下2.2观察一种动物/"],["2.3","给蜗牛建个“家”","","已核学生教材核心活动：自由画建家计划、选材料、真实建造后三态检查，三次身体活动、位置和进食观察独立留痕；不预填动物反应，教参及明确版次待核。","./一下2.3给蜗牛建个家/"],["2.4","水中的动物","","已核学生教材核心活动：定位鱼的身体、自由绘画，分三次独立记录身体与尾、鳍、口和鳃盖动作；实物观察后再讨论运动与呼吸，不预填结果；教参及明确版次待核。","./一下2.4水中的动物/"],["2.5","它们吃什么","","已核学生教材核心活动：回顾进食例子、三阶段独立记录蚂蚁反应与来源、自由画路线并讨论证据；不预填结果，不把例子当投喂菜单，教参及明确版次待核。","./一下2.5它们吃什么/"],["2.6","动物联欢会","","已核学生教材核心活动：选角色与头饰自由设计，三个节目独立安排、隐藏角色猜测及同伴评价，讨论动物、植物和我们的共同生命特征；教参及明确版次待核。","./一下2.6动物联欢会/"]]},{"id":"2-up","title":"二年级上册","cover":"./covers/二上.jpg","lessons":[["2.1","地球家园有什么","","观察同一景色的整体与局部，整理家园事物，自选两种事物讲联系，并保存真实观察文字；原创示意不代替实地观察。","./二上2.1地球家园有什么/"],["1.1","动物的“家”","","观察燕巢、蟹洞、蚁巢与松鼠巢的外观及剖面，比较建巢材料，讨论早期人类住所与自然材料的改进。","./二上1.1动物的家/"],["1.2","我们的家","","观察房屋部位与材料，点选记录真实木材和金属样品的比较；按窗面透光等需要选材，不用示意代替实测。","./二上1.2我们的家/"],["1.3","家里的物品","","按材料为物品多选分类，保留两组独立记录与疑问标记，对照差异、用证据修订，并讨论材料多用途和安全再利用。","./二上1.3家里的物品/"],["1.4","设计小房子","","调整房子正面草图，讨论门窗、材料和连接方案，保留一版设计并按当前方案核对备料；示意图不替代实物检验。","./二上1.4设计小房子/"],["1.5","建造小房子","","照设计图分步制作，记录分工与进度，讨论问题、先改图再改做，并对照实物交流；状态均由学生报告，不代替实际检验。","./二上1.5建造小房子/"],["1.6","“小房子”展示会","","介绍作品材料和理由，按五项标准记录自评与同伴评、讨论分歧并规划改进；四组记录独立，不计总分、不代替实物核查。","./二上1.6小房子展示会/"],["2.2","我们的校园","","比较观察事实与猜想，绘写两份独立校园笔记，再并列对照真实细节与日期变化，导出观察图片。","./二上2.2我们的校园/"],["2.3","我们周围的空气","","安全收集空气，与水和木块换容器示意比较，分地点保留真实观察并导出；辨析花香来源，讨论保护空气。","./二上2.3我们周围的空气/"],["2.4","不同的天气","","校园双窗对比晴阴雨雪和风，讨论天气影响，绘写真实观察并生成记录图片。","./二上2.4不同的天气/"],["2.5","不同的季节","","同地点四季对照、多季节图卡归类与真实观察记录，认识季节对生活和动植物的影响。","./二上2.5不同的季节/"],["2.6","太阳与白天","","同地点早中晚太阳位置对照、转身辨方向与真实观察记录，安全认识太阳和白天。","./二上2.6太阳与白天/"],["2.7","夜晚的月亮","","对比代表性月亮亮面，手绘真实一晚观察；区分未看见与未观察，按日期整理证据并选择两张比较。","./二上2.7夜晚的月亮/"]]},{"id":"2-down","title":"二年级下册","cover":"./covers/二下.jpg","lessons":[["1.1","恐龙的故事","","全点选化石/足迹/模型证据卡、资料分类和科学故事；辅助稿，教材正文教参与版次待核。","./二下1.1恐龙的故事/"],["1.2","挖掘恐龙“化石”","","全点选模拟沙盘清理、原格记录、标号收取与实物活动准备；辅助稿，教材正文教参与版次待核。","./二下1.2挖掘恐龙化石/"],["1.3","测量恐龙“化石”","","全点选读尺练习、同伴真实测量、重测留档与长度比较；辅助稿，教材正文教参与版次待核。","./二下1.3测量恐龙化石/"],["1.4","拼接恐龙“化石”","","全点选模型断口观察、换位转向试拼、历史留档及实物自报；辅助稿，教材正文教参与版次待核。","./二下1.4拼接恐龙化石/"],["1.5","复原恐龙","","证据观察、复原修订与不确定性","./二下1.5复原恐龙/"],["1.6","制作恐龙模型","","全点选计划、实物观察与改进辅助稿","./二下1.6制作恐龙模型/"],["1.7","我们的恐龙公园","","全点选计划、实物观察与改进辅助稿","./二下1.7我们的恐龙公园/"],["2.1","磁铁能吸引什么","","全点选预测、材料模型与两次真实观察分列；正文教参待核","./二下2.1磁铁能吸引什么/"],["2.2","比较力量的大小","","全点选公平比较、三次实测与上限判断；正文教参待核","./二下2.2比较力量的大小/"],["2.3","让小车动起来","","全点选预测磁铁调头的方向示意，记录真实小车两朝向各两次观察，分辨铁片与磁铁；辅助稿，教材正文教参与版次待核。","./二下2.3让小车动起来/"],["2.4","隔物吸铁","","全点选隔物吸铁探究，基线与条件检查、三种薄片各两次实测、同纸叠层记录；辅助稿，教材正文教参与版次待核。","./二下2.4隔物吸铁/"],["2.5","设计钓鱼玩具","","全点选选材与制作计划、教师安全检查、两次真实试钓和改进归档；辅助稿，教材正文教参与版次待核。","./二下2.5设计钓鱼玩具/"],["2.6","我们来钓鱼","","全点选安全约定、轮流真实试钓、改进前后留档和证据交流；辅助稿，教材正文教参与版次待核。","./二下2.6我们来钓鱼/"]]},{"id":"3-up","title":"三年级上册","cover":"./covers/三上.jpg","lessons":[["1.1","我们关心天气","","同校园跨时留影对照天气要素，追踪大气中的风云雨雪，保留本班真实观察与CSV/SVG对照图。","./三上1.1我们关心天气/"],["1.2","认识气温计","","独立重制辅助稿：观察气温计部位和每格1℃刻度，调节零上零下液柱，练习读写与平视判断；教材正文及教参待核。","./三上1.2认识气温计/"],["1.3","测量气温","","规范测量、同地点五时点实测记录、涂液柱连线研讨；实测与模拟分开，支持本机保存和CSV/PNG导出。","./三上1.3测量气温/"],["1.4","测量降水量","","独立重制辅助稿：不同宽度直筒的等雨深模型、毫米读数练习、真实时段雨量记录导出；区分零/未测/无效，不误用非等截面水深，教材教参待核。","./三上1.4测量降水量/"],["1.5","观测风","","独立重制辅助稿：八方位区分来风方向、风向标和旗带下风方向，三次真实记录导出；无风不判方向，不从动画猜风级，教材教参待核。","./三上1.5观测风/"],["1.6","观察云","","独立重制辅助稿：八份云量面积模型、云形外观线索、三次真实天空记录和导出；区分无云/遮挡/未观察，不作天气预报，教材教参待核。","./三上1.6观察云/"],["1.7","天气预报","","读懂天气符号与预报字段，沿时间联动观察；同日同地比较瞬时观测与全天范围，录入真实资料并导出对照卡。","./三上1.7天气预报/"],["1.8","天气的影响","","独立重制辅助稿：四种天气影响情境的选择与条件，区分观察/预报/推测，两条真实观察点选记录导出；不预设当地天气，教材教参待核。","./三上1.8天气的影响/"],["2.1","水到哪里去了","","独立重制辅助稿：蒸发解释模型、敞口与加盖公平比较，三次真实液面记录导出；不虚构速率，不预填实验结论，教材教参待核。","./三上2.1水到哪里去了/"],["2.2","水珠从哪里来（二维版）","","观察生活水珠，对比加盖、色素与预冷空杯实验，联动凝结模型；支持擦拭、放大与模拟观察记录。","./三上2.2水珠从哪里来二维版/"],["2.3","水沸腾了","","独立重制基础辅助稿：阶段观察沸腾与温度平台，区分水蒸气和白雾，录入真实数据并导出；教材正文与教参待核对。","./三上2.3水沸腾了/"],["2.4","水结冰了","","二维交互实验：搭建冰盐冷却装置、观察结冰与温度变化、记录真实数据，并探索热胀冷缩生活实例。","./三上2.4水结冰了/"],["2.5","冰熔化了","","比较敲碎、吹气、手焐的熔化现象，用三态变化与蜡的受热冷却解释生活中的现象。","./三上2.5冰熔化了/"],["2.6","水能溶解多少物质","","设计公平实验，逐份比较食盐和小苏打的溶解；记录全班真实证据，探索加水与温水的影响。","./三上2.6水能溶解多少物质/"],["2.7","加快溶解","","三页贯穿课堂：设计公平实验，汇总全班实测，观察微观溶解，并迁移到研磨与生活探究。","./三上2.7加快溶解/"],["2.8","用水分离","","独立重制辅助稿：食盐与沙分离顺序设计、四阶段物质去向，真实异常和缺项记录导出；过滤不除溶解盐，透明不等于可饮用，教材教参待核。","./三上2.8用水分离/"],["3.1","运动和位置","","独立重制辅助稿：相对固定旗杆比较前后位置，方向与距离点选练习，真实观察记录导出；不从单图判运动，不从两帧猜路线，教材教参待核。","./三上3.1运动和位置/"],["3.2","各种各样的运动","","独立重制辅助稿：直线平移与固定轴转动中追踪中心/边缘点，预测并观察轨迹，真实记录导出；不将轮缘滚动当圆轨迹，教材教参待核。","./三上3.2各种各样的运动/"],["3.3","直线运动和曲线运动","","观察生活中的运动路线，比较自由、直线和曲线轨道击球，先预测再慢放验证小球冲出桌面的轨迹。","./三上3.3直线运动和曲线运动/"],["3.4","相同距离比快慢","","独立重制辅助稿：预测、同程同时/错时出发模型，区分到达时刻与运动用时；三次实测缺项及差异研讨、CSV导出，教材教参待核。","./三上3.4相同距离比快慢/"],["3.5","相同时间比快慢","","独立重制辅助稿：同时间、不同起点及相反方向模型，区分终点位置与实际路程；三次实测零/缺项分离和证据研讨、CSV导出，教材教参待核。","./三上3.5相同时间比快慢/"],["3.6","运动和能量","","独立重制辅助稿：同球两高度自然释放过程、预测与公平条件检查，两组各三次木块位移实测及范围研讨；不虚构碰撞数据，教材教参待核。","./三上3.6运动和能量/"],["3.7","设计和制作“过山车”","","路线与支架规划、实际制作试跑记录","./三上3.7设计和制作过山车/"],["3.8","测试“过山车”","","真实多次试跑、失败保留与公平比较","./三上3.8测试过山车/"]]},{"id":"3-down","title":"三年级下册","cover":"./covers/三下.jpg","lessons":[["1.1","根据太阳辨别方向","","已核本课教材与教参：理想太阳时联动影尖、先后标记连线及旋转图纸，独立实测检查与草图，朝向和右转比较；模型不代替导航，教材明确版次待核。","./三下1.1根据太阳辨别方向/"],["1.2","利用自然物辨别方向","","已核本课教材与教参：审查融雪、树冠、苔藓、年轮线索及替代原因，三条独立实察区分现象、干扰、猜想与复核，旋转八方向学习盘；不用于导航，教材明确版次待核。","./三下1.2利用自然物辨别方向/"],["1.3","利用磁铁辨别方向","","已核本课教材与教参：比较悬挂、水浮与支撑装置，三次独立记录方法、A/B指向和停稳状态，校园情境排障与复核；不预填磁极或真实方向，教材明确版次待核。","./三下1.3利用磁铁辨别方向/"],["1.4","磁极与方向","","已核本课教材与教参：四种磁极组合的两轮独立实测、双磁铁翻转与规律解释、地理极和地磁极分层概念及推理；模型不改实测，不作导航，教材明确版次待核。","./三下1.4磁极与方向/"],["1.5","制作小磁针","","已核本课教材与教参：单向摩擦分步示意、三因素公平比较与三次原始实测、磁极证据判断；不预填磁性、不择优改写数据，教材明确版次待核。","./三下1.5制作小磁针/"],["1.6","设计指南针","","已核本课教材与教参：先定设计标准，三种支撑方案独立绘图与选材，初稿和改稿并排评议并下载记录；不自动判定真实指向准确，教材明确版次待核。","./三下1.6设计指南针/"],["1.7","制作指南针","","已核本课教材与教参：按方案制作与安全清单、改进前后三次粗方位实测叠加、作品自评他评及记录下载；区分集中与准确，不读取设备罗盘或预填结果，教材明确版次待核。","./三下1.7制作指南针/"],["1.8","用指南针“寻宝”","","已核本课教材与教参：指南针结构与刻度盘对齐、四条文字路线自主绘制与逐步核对、独立任务和实践记录下载；图上路线不是校园导航，教材明确版次待核。","./三下1.8用指南针“寻宝”/"],["2.1","不同种类的动物","","动物特征比较、换标准分组与真实观察；教材教参待核。","./三下2.1不同种类的动物/"],["2.2","动物的繁殖","","已核本课教材与教参：鸡猫三阶段并排对照、五种动物按证据分类，保留首次与修正判断、独立理由及下载；示意不代替实察，教材明确版次待核。","./三下2.2动物的繁殖/"],["2.3","迎接蚕宝宝的到来","","已核本课教材与教参：蚕卵真实绘画与观察、并排测量估算、两次记录对照和照料计划，本机保存并下载；不模拟孵化，教材明确版次待核。","./三下2.3迎接蚕宝宝的到来/"],["2.4","幼蚕在生长","","已核本课教材与教参：结构分层观察、同一个体真实体长散点及首末比较，独立编号与记录修正、本机保存和下载；不补造生长数据，教材明确版次待核。","./三下2.4幼蚕在生长/"],["2.5","蚕变了新模样","","已核本课教材与教参：保留初始推测、茧壳与蛹概念分层、幼虫蛹同线索对照，区分证据来源并修订下载；模型不判断个体存活，教材明确版次待核。","./三下2.5蚕变了新模样/"],["2.6","茧中钻出了蚕蛾","","已核本课教材与教参：蚕蛾与蛹、蝴蝶同部位对照，六种动物先判后读资料并修订，保留首次判断与独立依据；不把翅作为唯一标准，教材明确版次待核。","./三下2.6茧中钻出了蚕蛾/"],["2.7","昆虫的一生","","已核本课教材与教参：三种昆虫独立阶段排列与世代辨析，同一只蚕真实边界日期计算时长，缺项未知、逆序保护与下载；不预填标准寿命，教材明确版次待核。","./三下2.7昆虫的一生/"],["2.8","动物的生命周期","","已核本课教材与教参：蛙与金鱼独立阶段对照、三条观察线索，四类动物资料比较与四题独立发现记录；区分个体生命和种群延续，教材明确版次待核。","./三下2.8动物的生命周期/"],["3.1","地球是我们的家园","","已核本课教材与教参：五条带出处的地球资料、最多三条聚焦选材、海报研究计划及完整性检查，区分已核资料与待研究问题；不是成品海报，教材明确版次待核。","./三下3.1地球是我们的家园/"],["3.2","水的星球","","已核本课教材与教参：数十指真实分轮记录、未辨清分类及汇总，区分海陆表面积与咸淡水水量比例，保存并导出保护水行动；不自动模拟采样，教材明确版次待核。","./三下3.2水的星球/"],["3.3","地球的卫星","","已核本课教材与教参：原创月面概念示意同步放大、另据真实照片记录，八张地月比较卡查证修订并保留初判；示意不作实测证据，教材明确版次待核。","./三下3.3地球的卫星/"],["3.4","我们来造“环形山”","","已核本课教材与教参：原创沙盘坑位顺序记录与撤回、真实高度和坑径散点及条件备注、本机保存与导出；不模拟撞击或预填趋势，教材明确版次待核。","./三下3.4我们来造“环形山”/"],["3.5","发光发热的太阳","","已核本课教材与教参：独立控制外照与电源辨析发光反光，向阳背阴地表实测配对、温差和条件记录；不预设向阳更热，教材明确版次待核。","./三下3.5发光发热的太阳/"],["3.6","一天中影子的变化","","已核本课教材与教参：课堂大屏版实验前练操作并隐藏结果，教师确认后探索太阳时、物体与光路，留存模型影迹及CSV；不预测实地影长，教材明确版次待核。","./三下3.6一天中影子的变化/"],["3.7","地球的“兄弟姐妹”","","已核本课教材与教参：八颗行星同比圆面排序、模型制作尺寸联动和独立环境资料档案；保留教材直径口径，不以大小相近推断生命，教材明确版次待核。","./三下3.7地球的“兄弟姐妹”/"],["3.8","制作地球科普海报","","已核本课教材与教参：三模块海报即时版式比较、模块换位及放大、来源自查与同伴评议、修改快照和SVG导出；不代写事实或自动认证内容，教材明确版次待核。","./三下3.8制作地球科普海报/"]]},{"id":"4-up","title":"四年级上册","cover":"./covers/四上.jpg","lessons":[["1.1","感受空气","","逐帧观察四种材料入水后的气泡证据，比较空气与水，区分现象和解释并保留真实观察记录。","./四上1.1感受空气/"],["1.2","空气能占据空间吗","","连续操作半截瓶下压、开盖与注气，追踪小球和水位；保留真实证据记录，并比较不同条件下的排水结果。","./四上1.2空气能占据空间吗/"],["1.3","空气占据的空间会改变吗","","并排比较空气与水的注射器推压，切换封口与开口及解释模型，记录真实实验并迁移到倒扣瓶情境。","./四上1.3空气占据的空间会改变吗/"],["1.4","空气有质量吗","","联动打气、放气与天平称量，用守恒的模型微粒观察变化；比较两球按压、碰撞和回弹，明确称量才是质量证据。","./四上1.4空气有质量吗/"],["1.5","空气的流动","","《空气有力量》互动资源：拖动纸杯比较吹动效果，调换气球火箭出气方向；切换现象、空气与受力，慢放和单步追踪变化。","./四上1.5空气有力量/"],["1.6","我们来做“热气球”","","分时观察加热、起飞与冷却过程，切换微粒与浮力解释；记录袋子轮廓、冷暖及文字，示意与真实记录分开。","./四上1.6我们来做热气球/"],["1.7","风的成因","","用双筒烟迹观察空气流动，在固定海拔剖面比较昼夜和同温条件；支持慢放、画箭头与定格记录，示例与实测分开。","./四上1.7风的成因/"],["1.8","自制打气筒 · 课堂修订版8.0","","课堂修订8.0：瓶式打气筒实验、改装及六类气路比较；保留三维泵与单向阀，新增碗形硅胶阀轴向剖面。","./四上1.8自制打气筒/"],["1.8","自由组装实验台 v8.5","","材料自由装配、开孔与按压观察；定性模型，WebGL1/Canvas回退，真实GPU和触屏等尚未完整验收。","./四上1.8自制打气筒/自由组装实验台/"],["2.1","我们的呼吸与消化","","在身体体验地图标记真实感受，区分观察与猜想，整理交流卡和研究问题，导出本班探究记录。","./四上2.1我们的呼吸与消化/"],["2.2","认识呼吸器官","","呼吸通路、胸廓膈与肺的关系及匿名观察；教材教参待核。","./四上2.2认识呼吸器官/"],["2.3","呼吸的变化","","运动计时与呼吸实测、多组频率对比、肺泡气体交换及脉搏探究，保留三维资产并提供二维兼容视图。","./四上2.3呼吸的变化/"],["2.4","测量肺活量","","虚构刻度、有效性与测量方法探究","./四上2.4测量肺活量/"],["2.5","口腔里的消化","","牙齿协作、机械变碎与唾液作用比较；教材教参待核。","./四上2.5口腔里的消化/"],["2.6","胃和小肠里的消化","","无输入16:9科普：胃内混合与分子分解、小肠消化、跨肠壁进入血液或淋巴；附权威来源。","./四上2.6胃和小肠里的消化/"],["2.7","食物在身体里的旅行","","消化道路线与观点修正探究","./四上2.7食物在身体里的旅行/"],["2.8","呵护我们的器官","","匿名情境选择与保护方案探究","./四上2.8呵护我们的器官/"],["3.1","声音是怎样产生的","","独立重制辅助稿：发声猜想、橡皮筋振动慢放与止振，区分经过原位和停住；两材料真实声音/运动证据及CSV导出，教材教参待核。","./四上3.1声音是怎样产生的/"],["3.2","声音的强弱","","拖动钢尺、放大慢放并叠加两次振动范围；用同一比例保留、回听真实录音，比较声音强弱。","./四上3.2声音的强弱/"],["3.2","电子拾音器 · 学生端","","v2.0：实时拾音、原始波形与相对RMS观察，默认×8增益；录制独立保留片段，可定格、回听并连接局域网课堂。","./四上3.3声音的高低_学生端/"],["3.3","声音的高低","","调节钢尺伸出长度，慢放对照振动快慢；独立比较音调与强弱。","./四上3.3声音的高低/"],["3.3","电子拾音器 · 学生端","","v2.0：实时拾音与录制分离，观察实测波形和100–3000 Hz音高；保留特征频率，四种合成音色试听，可连接局域网课堂。","./四上3.3声音的高低_学生端/"],["3.4","乐器的声音变化","","调节吉他琴弦的粗细、松紧和有效振动长度，透视排箫空气柱；用同刻度轨迹与A/B试听比较声音的高低和强弱。","./四上3.4乐器的声音变化/"],["3.5","设计我们的乐器","","选择纸盒琴、水杯琴或封底排箫，联动调整结构与音高；保留设计方案、试奏比较，并导出与实物制作衔接的设计单。","./四上3.5设计我们的乐器/"],["3.6","改进我们的乐器","","连续调音与结构改进，同条件前后试听，实物录音和版本记录","./四上3.6改进我们的乐器/"],["3.7","声音的传播","","放大追踪微粒往复与声波扩散；透视空气、水、固体的传声路径，比较抽气钟罩与土电话的传播效果。","./四上3.7声音的传播/"],["3.8","保护听力","","逐站追踪耳内声音传递，放大鼓膜振动；比较降音量、远离、耳罩与缩短时间的作用，联系生活分贝并记录实测。","./四上3.8保护听力/"]]},{"id":"4-down","title":"四年级下册","cover":"./covers/四下.jpg","lessons":[["3.2","点亮小灯泡（基础辅助稿）","","比较两根导线与单线直接接触接法，先预测后检查完整回路与短路危险，导出模型记录；教材正文与教参待核。","./四下3.2点亮小灯泡/"],["3.8","模拟安装照明电路（基础辅助稿）","","固定低压方案装配与四状态验收，教材正文与教参待核","./四下3.8模拟安装照明电路/"],["3.7","设计照明电路（基础辅助稿）","","双灯独立控制设计与验收专题，教材正文与教参待核","./四下3.7设计照明电路/"],["3.6","里面的电路是怎样的（基础辅助稿）","","暗盒通断检测与非唯一连线猜想，教材正文与教参待核","./四下3.6里面的电路是怎样的/"],["3.5","导体和绝缘体（基础辅助稿）","","低压典型材料与接触检查，教材正文与教参待核","./四下3.5导体和绝缘体/"],["3.4","电路出故障了（基础辅助稿）","","一次只替换一项的单故障排查，教材正文与教参待核","./四下3.4电路出故障了/"],["3.3","简易电路（基础辅助稿）","","完整回路与开关控制互动，教材正文与教参待核","./四下3.3简易电路/"],["2.8","家乡的土壤（基础辅助稿）","","假想地图观察布点与证据范围，教材正文与教参待核","./四下2.8家乡的土壤/"],["2.7","土壤危机与保护（基础辅助稿）","","雨滴冲击与地表覆盖分步互动，教材正文与教参待核","./四下2.7土壤危机与保护/"],["2.6","土壤与植物的生长（基础辅助稿）","","土壤孔隙与可能根系响应的定性比较，教材正文与教参待核","./四下2.6土壤与植物的生长/"],["2.5","不一样的土壤（基础辅助稿）","","砂粉黏质量配比可视比较，教材正文与教参待核","./四下2.5不一样的土壤/"],["2.4","土壤中的砂和黏土（基础辅助稿）","","粒径与共同尺度观察专题，教材正文与教参待核","./四下2.4土壤中的砂和黏土/"],["2.3","土壤中的腐殖质（基础辅助稿）","","破碎与分解及有机物去向专题，教材正文与教参待核","./四下2.3土壤中的腐殖质/"],["2.2","土壤中有什么（基础辅助稿）","","土壤组成与孔隙占据专题，教材正文与教参待核","./四下2.2土壤中有什么/"],["2.1","探寻土壤（基础辅助稿）","","剖面选区与观察证据专题，教材正文与教参待核","./四下2.1探寻土壤/"],["1.8","植物的一生（基础辅助稿）","","一年生植物世代追踪专题，教材正文与教参待核","./四下1.8植物的一生/"],["1.7","种子的传播（基础辅助稿）","","三种传播结构与机制专题，教材正文与教参待核","./四下1.7种子的传播/"],["1.6","花变成了果（基础辅助稿）","","子房与胚珠结构追踪专题，教材正文与教参待核","./四下1.6花变成了果/"],["1.5","植物开花了（基础辅助稿）","","典型花结构识别专题，教材正文与教参待核","./四下1.5植物开花了/"],["1.4","植物长出了茎和叶（基础辅助稿）","","根茎叶水运输路线专题，教材正文与教参待核","./四下1.4植物长出了茎和叶/"],["1.3","种子长出了根（基础辅助稿）","","初生根向地性定性专题，教材正文与教参待核","./四下1.3种子长出了根/"],["1.2","种植一棵植物（基础辅助稿）","","播种位置读图专题，教材正文与教参待核","./四下1.2种植一棵植物/"],["1.1","种子里孕育着新生命（基础辅助稿）","","菜豆结构探索专题，教材正文与教参待核","./四下1.1种子里孕育着新生命/"]]},{"id":"5-up","title":"五年级上册","cover":"./covers/五上.jpg","lessons":[["1.1","研究放大镜","","同点倍率与视野联动，剖面对照区分凸度和厚度。","./五上1.1研究放大镜/"],["1.2","怎样放得更大","","调节双凸透镜镜距，同步比较像的大小与清晰度；透视中间像和光路，保留单镜／双镜快照，圈画实拍或模拟图并导出观察对照。","./五上1.2怎样放得更大/"],["1.3","用简易显微镜观察","","同一物体的全貌、取景位置和显微视野联动；记录扫描位置，保留同一区域不同倍率图像，真实照片与观察图圈注对照。","./五上1.3用简易显微镜观察/"],["1.4","用光学显微镜观察","","反光镜、镜筒位置与目镜视野同步；拖动玻片观察倒像与高倍取景，保留同区画面、导入照片并自主绘图记录。","./五上1.4用光学显微镜观察/"],["1.5","观察细胞 · 原版","","真实照片与示意图区分，支持并排圈画比较；拖动几何切面，联动查看立体细胞与二维切面，保留不同层面的结构对照。","./五上1.5观察细胞/"],["1.5","观察细胞 · 混合素材版","","两张CC BY 4.0真实显微照片与五种原创示意；并排圈画、立体切面，导出保留素材来源与许可。","./五上1.5观察细胞/混合素材版/"],["1.6","观察水中的微小生物","","追踪微小生物与水流参照；显微影像慢放、留帧叠影与双点记录","./五上1.6观察水中的微小生物/"],["1.7","微生物与人类","","宏观与微观联动追踪发酵、霉变和分解；同条件回放食品保存与公筷传播路径，自主整理利弊与控制关系。","./五上1.7微生物与人类/"],["2.1","各种各样的工具","","同一批书在走廊、窄路与楼梯中换工具比较，观察通行条件与运输次数；拆看独轮车结构，保留条件对照并导出观察图。","./五上2.1各种各样的工具/"],["2.2","独轮车省力的秘密","","轮轴支点、力臂对照与重复实测；教材教参待核。","./五上2.2独轮车省力的秘密/"],["2.3","制作独轮车","","部件装配、连接故障与真实测试改进；教材教参待核。","./五上2.3制作独轮车/"],["2.4","巧用斜面","","独立重制辅助稿：同载重同高度比较坡长/拉力/路程，限定无摩擦匀速模型；三方案各三次实测、条件核对和改进研讨，教材教参待核。","./五上2.4巧用斜面/"],["2.5","妙用滑轮","","真实实验后的三维观察、轴心留痕、力与位移对照，以及自由挂接、穿绳改装。","./五上2.5妙用滑轮/"],["2.6","给小车安装方向盘（原创基础稿）","","依据本课教参独立编写：轮轴比较、转向连接、设计与实物记录；不含原版受限模型","./五上2.6给小车安装方向盘基础稿/"],["2.7","推动社会发展的工具和技术","","从部件追踪工具与共用技术，保留猜想和查证关系；改变印数、改字、复用与供电条件，用同一时钟比较印刷工序并导出观察图。","./五上2.7推动社会发展的工具和技术/"],["3.1","拆解我的小车模型","","分层拆解与连接追踪，慢放齿轮传动并同刻对照断开状态；比较月球车结构与环境关系，支持本机记录和TXT/SVG导出。","./五上3.1拆解我的小车模型/"],["3.2","用重力驱动小车","","改变垫圈数量，慢放与等时位置观察重力小车；汇总三次模拟及实测记录，挑战1米3秒精准到站。","./五上3.2用重力驱动小车/"],["3.3","用弹力驱动小车","","透视皮筋绕轴与慢放驱动、滑行过程；拖旗预测并同条件比较圈数，用三次实测圆点纸带保留证据，支持数字键盘与数据导出。","./五上3.3用弹力驱动小车/"],["3.4","测量力的大小","","观察条形盒式与圆筒式测力计的结构、弹簧伸长和重物联动；切换量程，练习调零、平视读数与即时判分。","./五上3.4测量力的大小/"],["3.5","摩擦力的比较","","水平拖动测力计，放大启动与匀速读数；控制变量比较滚动、轮面和载重，汇总三次模拟及实测数据，再探究自行车轮轴与胎面的不同摩擦需求。","./五上3.5摩擦力的比较/"],["3.6","制作“月球小车”","","双工作区：三视图同步设计与预算、质量对照；透视电机、齿轮和车轴的传动，比较断路、遮光与齿轮脱开的不同结果，导出设计单衔接实物制作。","./五上3.6制作月球小车/"],["3.7","评价“月球小车”","","同条件改进前后同步回放，放大轮地接触与俯视轨迹；导入实物视频慢放、标点计时，再保留三次真实测试与可协商评价，支持记录和证据图导出。","./五上3.7评价月球小车/"],["4.1","地球的表面","","旋转展开世界球体，查看中国地形案例与西高东低趋势示意；比较五类教学地形和来源模型，剖切描摹、制作分类卡并导出记录。","./五上4.1地球的表面/"],["4.2","火山喷发对地表的作用","","剖开火山追踪岩浆、同步放大气体变化；等量比较熔岩流动与多次堆积，保留原地表和对照轮廓，拖动测高线生成证据图。","./五上4.2火山喷发对地表的作用/"],["4.3","地震对地表的作用","","透视地下断层的缓慢积累、突然错动与振动传播；改变坡体和河道条件，同步对照滑坡、堵河与蓄水，保留关键帧形成证据图。","./五上4.3地震对地表的作用/"],["4.4","地球表面的岩石","","拖动取样框联动放大岩石颗粒，导入实物照片；跨矿物刻画并擦拭，保留同区前后证据和观察对照。","./五上4.4地球表面的岩石/"],["4.5","岩石的类别与变化","","自主追踪岩石变化路径、内部机制放大、冷热与冻融同条件对照、暂停回看、SVG观察记录；单文件离线。","./五上4.5岩石的类别与变化/"],["4.6","水对地表的作用","","透视坡面并追踪土粒来源，回看侵蚀与沉积；沿河俯视和剖面联动，保留同进度对照，生成模型观察图。","./五上4.6水对地表的作用/"],["4.7","风对地表的作用","","追踪同一批沙粒的去向，保留同进程对照；放大有沙与无沙气流的岩面磨蚀，自主连接地表变化因素并导出观察图。","./五上4.7风对地表的作用/"]]},{"id":"5-down","title":"五年级下册","cover":"./covers/五下.jpg","lessons":[["1.1","种子发芽实验（基础辅助稿）","","并排设计种子发芽对比实验、检查条件差异、固定方案并记录真实观察；教材正文与教参一致性待核。","./五下1.1种子发芽实验/"],["1.2","比较种子发芽条件（基础辅助稿）","","整理两组真实发芽计数、比较比例、检查证据边界并导出记录；教材正文与教参待核。","./五下1.2比较种子发芽条件/"],["1.3","阳光下的植物（基础辅助稿）","","固定光照对照方案，录入真实高度和形态，比较变化并导出；教材正文与教参待核。","./五下1.3阳光下的植物/"],["1.4","蚯蚓的选择（基础辅助稿）","","固定对照方案、手动记录区域位置、保留多时点快照并导出；不模拟动物结果，教材正文与教参待核。","./五下1.4蚯蚓的选择/"],["1.5","当环境改变了（基础辅助稿）","","切换青蛙四季与越冬隐蔽处，比较丹顶鹤迁徙和留居种群，并判断模型证据边界；匹配版教材正文与教参待核。","./五下1.5当环境改变了/"],["1.6","生物之间的食物关系（基础辅助稿）","","点击生物构建食物关系网，核对箭头方向与食性证据，追踪资源变化的直接/间接联系；教材正文与教参待核。","./五下1.6生物之间的食物关系/"],["1.7","制作“生态瓶”（基础辅助稿）","","切换光暗、生物组成与密封边界，看见氧过程和物质循环，固定方案并对照导出；教材正文与教参待核。","./五下1.7制作生态瓶/"],["2.1","热从哪里来（基础辅助稿）","","切换阳光、电热、摩擦与穿衣保温场景，观察能量路径和区别；教材正文与教参待核。","./五下2.1热从哪里来/"],["2.2","热与水的变化（基础辅助稿）","","拖动阶段比较水的常见状态变化，判断吸放热、切换分子示意并辨别白雾；教材正文与教参待核。","./五下2.2热与水的变化/"],["2.3","温度与热的传递（基础辅助稿）","","调初温、判断净传热方向，比较双温度计、变化图与隔热条件；理想模型非实验数据，教材正文教参待核。","./五下2.3温度与热的传递/"],["2.4","热在金属中的传递（基础辅助稿）","","比较金属条和金属片受热位置、温度分布及移除热源后的内部传热；离散概念模型，正文教参待核。","./五下2.4热在金属中的传递/"],["2.5","热在水中的传递（基础辅助稿）","","沿预设八步路线追踪水的对流，比较上暖下冷分层；非流体仿真，教材正文教参待核。","./五下2.5热在水中的传递/"],["2.6","哪个传热快（基础辅助稿）","","稳态导热桥比较，控制材料与厚度；匹配版教材正文与教参待核","./五下2.6哪个传热快/"],["2.7","制作保温杯（基础辅助稿）","","保温结构与散热路径、方案比较；匹配版教材正文与教参待核","./五下2.7制作保温杯/"],["3.1","地球上的资源（基础辅助稿）","","资源景观与生活用途关联；匹配版教材正文与教参待核","./五下3.1地球上的资源/"],["3.2","合理利用资源（基础辅助稿）","","资源库存、补给与取用策略比较；匹配版教材正文与教参待核","./五下3.2合理利用资源/"],["3.3","垃圾的分类处理（基础辅助稿）","","宁波四分类常见样例与处理去向；匹配版教材正文与教参待核","./五下3.3垃圾的分类处理/"],["3.4","循环利用资源（基础辅助稿）","","收集、加工与再制造材料流向；匹配版教材正文与教参待核","./五下3.4循环利用资源/"],["3.5","保护环境（基础辅助稿）","","来源、径流路径与下游保护；匹配版教材正文与教参待核","./五下3.5保护环境/"],["3.6","应对自然灾害（地震专项辅助稿）","","校园地震风险与三阶段选择；其他灾种未覆盖，教材正文与教参待核","./五下3.6应对自然灾害/"],["3.7","我们的环保行动（纸张减量专项辅助稿）","","计划用纸可视比较，非实测成果、非整课完整；教材正文与教参待核","./五下3.7我们的环保行动/"],["4.1","不同材料的沉浮（基础辅助稿）","","假想实心材料大小与沉浮比较；教材正文与教参待核","./五下4.1不同材料的沉浮/"],["4.2","用能浮的材料造船（基础辅助稿）","","理想浮排材料数量与载荷比较，非安全载重；教材正文与教参待核","./五下4.2用能浮的材料造船/"],["4.3","用坚固的材料造船（基础辅助稿）","","排水与进水专题，教材正文与教参待核","./五下4.3用坚固的材料造船/"],["4.4","增加船的装载量（基础辅助稿）","","理想船体容积对照专题，教材正文与教参待核","./五下4.4增加船的装载量/"],["4.5","船的最大装载量","","同船吃水对照与实际装载证据探究","./五下4.5船的最大装载量/"],["4.6","我们的“船博会”（基础辅助稿）","","展品证据专题，虚构数据；教材正文与教参待核","./五下4.6我们的船博会/"],["4.7","制作和测试小船（基础辅助稿）","","裁折设计几何专题，非漂浮仿真；教材正文与教参待核","./五下4.7制作和测试小船/"]]},{"id":"6-up","title":"六年级上册","cover":"./covers/六上.jpg","lessons":[["1.1","健康成长的信息","","虚构成长读图与证据判断探究","./六上1.1健康成长的信息/"],["1.2","食物中的营养","","检验对照、油迹与标签份量探究","./六上1.2食物中的营养/"],["1.3","营养要均衡","","虚构菜肴拆分、跨餐去重与方案改进","./六上1.3营养要均衡/"],["1.4","身体的“总指挥”","","神经协作与自愿记忆策略探究","./六上1.4身体的总指挥/"],["1.5","睡眠要充足","","虚构跨午夜时间、分布与作息讨论","./六上1.5睡眠要充足/"],["1.6","管理我们的情绪","","区分表情线索与自述，比较应对并制定虚构角色方案","./六上1.6管理我们的情绪/"],["1.7","制订健康生活计划","","24小时时间预算、同情境七天预案对照与真实行动记录；四类小目标分别保存，保留计划修订前的证据，支持完整计划卡导出。","./六上1.7制订健康生活计划/"],["2.1","怎样能看到物体","","黑盒视野与剖面同步、两段光路独立遮挡、天窗三桌对照及模型/实物记录；单文件离线","./六上2.1怎样能看到物体/"],["2.2","光是怎样传播的","","三孔遮挡对照与小孔倒像，区分模型和真实观察，保留异常证据。教材教参待核。","./六上2.2光是怎样传播的/"],["2.3","光能穿透物体吗","","黑盒条件、三种透光模型与双维度实物证据；教材教参待核。","./六上2.3光能穿透物体吗/"],["2.4","光的反射现象","","预测反射光路、局部法线与三组实测证据；教材教参待核。","./六上2.4光的反射现象/"],["2.5","设计潜望镜","","调节镜面观察光路，剖切拆解自己的Z字形潜望镜，选择生活材料，并拖动小人与装置完成四种平面情境练习。","./六上2.5设计潜望镜/"],["2.6","制作潜望镜","","双镜光路设计、制作检查与真实改进证据；教材教参待核。","./六上2.6制作潜望镜/"],["2.7","制造彩虹","","白光分光、主虹位置与加色混合，模型和观察分列","./六上2.7制造彩虹/"],["3.1","利用地球模型来研究","","逐层拆看海陆、赤道、经纬网与地轴；透视空间关系，同视角删减模型信息并比较证据，保留观察与问题，支持图片和文字导出。","./六上3.1利用地球模型来研究/"],["3.2","昼夜交替的解释","","第一视角看昼夜，手绘并保存自己的假说；跟随同一观察者验证，再同屏比较地心说与日心说。","./六上3.2昼夜交替的解释/"],["3.3","地球如何自转","","四种地轴姿态和自由调节联动球面受光；追踪地面观察点，展开24小时昼夜证据并导出记录。","./六上3.3地球如何自转/"],["3.4","谁先迎来黎明","","三页探究：4K地球仪定位，手拉手、大蒜、汽车与转椅多视角模拟，24小时昼夜记录，以及两地小学真实历史作息差值对照；单文件离线小于1 MB。","./六上3.4谁先迎来黎明/"],["3.5","影长的四季变化","","旋转拆解圭表，按城市、日期和时刻比较太阳高度与影长；用纸板圭表和手电筒模拟节气，留影对照与导出查询记录。","./六上3.5影长的四季变化/"],["3.6","地球的公转","","追踪一年与地轴留影，恢复真实轨道比例并换算教室绳长，保留南北半球季节预测与教材证据，检验近热远冷的解释。","./六上3.6地球的公转/"],["3.7","四季变化","","等量光束与光斑、影长联动；跟随地球比较南北半球正午高度与昼长，改变地轴描出全年曲线，保留并导出观察证据。","./六上3.7四季变化/"],["4.1","时间在流逝","","前段预测与后段验证、累计时间拆分、实测记录与日影追踪。","./六上4.1时间在流逝/"],["4.2","用水计量时间","","连续放水与倒回再测同步回放，拆分累计时间；透视补水和溢流条件，保留本班实测记录与CSV导出。","./六上4.2用水计量时间/"],["4.3","做个水钟","","透视稳水装置，对照每分钟水量；标定时间刻度，再用独立试测与实物记录检验误差。","./六上4.3做个水钟/"],["4.4","改进水钟","","透视供水、出水与溢流，同场回看2分钟和10分钟的读数及逐分钟水量；比较重标与沿用刻度，保留三次实物记录，导出模型SVG和实测CSV。","./六上4.4改进水钟/"],["4.5","机械摆钟","","计时机构协作、摆长快慢与实测探究","./六上4.5机械摆钟/"],["4.6","制作钟摆","","有效摆长、完整周期与三次真实计时；教材教参待核。","./六上4.6制作钟摆/"],["4.7","时间与变化","","年轮跨样本配准、珊瑚日纹放大计数与一天时长推算、地层形成回看和前后证据判断；支持本机记录与CSV/SVG导出。","./六上4.7时间与变化/"]]},{"id":"6-down","title":"六年级下册","cover":"./covers/六下.jpg","lessons":[["1.5","相貌各异的我们（基础辅助稿）","","虚构头像特征观察与组合比较，教材正文与教参待核","./六下1.5相貌各异的我们/"],["1.1","校园生物大搜索（基础辅助稿）","","虚构植物分布与调查范围专题，教材正文与教参待核","./六下1.1校园生物大搜索/"],["4.4","太阳系的组成（基础辅助稿）","","日地月成员身份与位置关系专题，教材正文与教参待核","./六下4.4太阳系的组成/"],["2.2","电能和磁能（基础辅助稿）","","直导线磁场方向与电流反转专题，教材正文与教参待核","./六下2.2电能和磁能/"],["4.2","了解空间站（基础辅助稿）","","圆轨道方向与共同自由落体专题，教材正文与教参待核","./六下4.2了解空间站/"],["4.7","浩瀚星空（基础辅助稿）","","光年与信号传播延迟，教材正文与教参待核","./六下4.7浩瀚星空/"],["2.5","电能从哪里来（基础辅助稿）","","风水光伏转换路径比较，教材正文与教参待核","./六下2.5电能从哪里来/"],["2.7","能源与可持续发展（基础辅助稿）","","供电时间匹配与储能账本，教材正文与教参待核","./六下2.7能源与可持续发展/"],["1.6","多样的古生物（基础辅助稿）","","身体与活动遗留证据比较，教材正文与教参待核","./六下1.6多样的古生物/"],["1.4","多种多样的动物（基础辅助稿）","","典型成虫与蜘蛛结构比较，教材正文与教参待核","./六下1.4多种多样的动物/"],["1.3","形形色色的植物（基础辅助稿）","","叶在茎上排列比较专题，教材正文与教参待核","./六下1.3形形色色的植物/"],["4.6","认识星座（基础辅助稿）","","假想星群方向与距离比较，教材正文与教参待核","./六下4.6认识星座/"],["1.7","保护生物的多样性（基础辅助稿）","","栖息地连接方案与可达路
