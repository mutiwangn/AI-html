<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>评论管理 · 小学科学课件</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1727;color:#e4eff8;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:30px 20px}h1{font-size:28px}label{display:block;margin:20px 0}input,select,button{font:inherit;border:1px solid #59748e;border-radius:8px;padding:10px;background:#172f46;color:inherit}input,select{display:block;width:100%;margin-top:6px}button{cursor:pointer;min-height:44px}article{padding:18px 0;border-bottom:1px solid #395065}article p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#a8bdd0}a{color:#9bd5f0}.delete{border-color:#c47479;color:#ffc0c3}#status{min-height:28px}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #efc879;outline-offset:2px}</style><main><a href="./">返回课件目录</a><h1>评论管理</h1><p>管理密钥仅用于本次删除请求，不写入浏览器存储。请勿分享密钥。</p><label>管理员密钥<input id="token" type="password" autocomplete="off" placeholder="在 Cloudflare 配置的 ADMIN_TOKEN"></label><label>课件<select id="resource"></select></label><button id="load">读取评论</button><p id="status" role="status" aria-live="polite"></p><section id="comments"></section></main><script src="./lesson-metadata.js"></script><script src="./lesson-feedback-config.js"></script><script>
(function(){'use strict';var api=window.AIHTML_FEEDBACK_API,sel=document.getElementById('resource'),list=document.getElementById('comments'),status=document.getElementById('status'),token=document.getElementById('token');Object.keys(window.AIHTML_METADATA||{}).forEach(function(path){var o=document.createElement('option');o.value=AIHTML_METADATA[path].id;o.textContent=path.replace(/^\.\//,'').replace(/\/$/,'');sel.appendChild(o);});function req(method,path,auth,done){var x=new XMLHttpRequest();x.open(method,api+path);x.timeout=12000;if(auth)x.setRequestHeader('Authorization','Bearer '+auth);x.onload=function(){var data;try{data=JSON.parse(x.responseText);}catch(e){done('服务返回异常');return;}if(x.status<200||x.status>=300){done(x.status===401||x.status===403?'密钥无效，无权删除':x.status===503?'管理员密钥尚未配置':'请求失败，请重试');return;}done(null,data);};x.onerror=x.ontimeout=function(){done('网络连接失败');};x.send();}function load(){status.textContent='读取中…';req('GET','/comments?resource='+encodeURIComponent(sel.value),null,function(error,data){if(error){status.textContent=error;return;}list.textContent='';var items=data.comments||[];status.textContent=items.length+' 条评论';items.forEach(function(c){var row=document.createElement('article'),heading=document.createElement('strong'),p=document.createElement('p'),b=document.createElement('button');heading.textContent=c.name||'访客';p.textContent=c.body;b.textContent='删除评论';b.className='delete';b.onclick=function(){var secret=token.value.trim();if(secret.length<32){status.textContent='请输入有效的管理员密钥';token.focus();return;}if(!confirm('删除这条评论？'))return;b.disabled=true;req('DELETE','/comments/'+encodeURIComponent(c.id),secret,function(error){token.value='';if(error){status.textContent=error;b.disabled=false;return;}row.remove();status.textContent='评论已删除';});};row.appendChild(heading);row.appendChild(p);row.appendChild(b);list.appendChild(row);});});}document.getElementById('load').onclick=load;window.addEventListener('pagehide',function(){token.value='';});})();
</script></html>
