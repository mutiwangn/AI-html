function help(){var b='<div class="help-grid"><div><h3>01 搅拌实验</h3><p>自动演示可分别控制两杯搅拌。手动模式可在杯内拖动画圈，或按住“搅拌”按钮。中途改变操作会记录为过程调整。</p></div><div><h3>02 温度实验</h3><p>分别设置水温；“调整其他条件”可制造或修复多变量方案。不公平的方案允许运行，但不会据此判断单一因素的作用。</p></div><div><h3>03 溶解的秘密</h3><p>沿用上一页选中杯的条件，建立独立解释模型。切换微观与整杯观察；支持放大、暂停、单步和教师层离子名称。</p></div><div><h3>04 自由实验室</h3><p>支持2—4杯。选择研究因素，点击杯子设置条件；研磨只改变粒径。大量加盐可以观察饱和残余。保存条件后可再次载入验证。</p></div></div><h3>课堂使用与观察记录</h3><p style="font-size:19px">先设置条件，再点“同时加盐并开始”。“定格比较”暂停在同一时刻。观察记录显示模型曲线，可单独填写实测完全溶解用时；记录可保存到本浏览器并导出CSV。空白表示未测量，不按0秒处理。</p><div class="help-warning"><b>模型边界</b>：速率是为课堂比较设计的定性模型，不能预测真实实验需要多少秒。水温按设定值保持恒定；未模拟容器热交换、蒸发或真实流体动力学。饱和容量采用公开教学数据近似。搅拌不会增加饱和容量。盐粒与微粒的视觉数量不代表真实数量或精确浓度。<br><b>安全</b>：真实实验的温热水由教师准备，避免烫伤；实验材料不要品尝。</div><div class="source-text">内容依据：教科版《科学教师教学用书·三年级上册》（2025），第二单元第7课，印刷页164—171。<br>微观解释参考：<a href="https://www.acs.org/middleschoolchemistry/lessonplans/chapter5/lesson3.html" target="_blank" rel="noopener noreferrer">ACS Lesson 5.3 · Why Does Water Dissolve Salt?</a>。容量近似参考：<a href="https://www.acs.org/middleschoolchemistry/lessonplans/chapter5/lesson6.html" target="_blank" rel="noopener noreferrer">ACS Lesson 5.6 · Does Temperature Affect Dissolving?</a>（食盐在0、20、40、60℃时，每100mL水约35.5、36、36.5、37.5g；模型在这些点间插值）。这些资料链接仅供查阅，不影响离线使用。<br>键盘：空格播放/暂停；左右方向键切换页面；R重来；Esc关闭弹窗。音效默认关闭；旧设备未经过实机验证。</div>';openModal('使用说明与科学模型边界',b,true);}

 ctx.font='15px sans-serif';ctx.lineWidth=1;ctx.textAlign='right';for(var k=0;k<=4;k++){var yy=pad.t+k/4*plotH;ctx.strokeStyle='#dfe9ef';ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.fillStyle='#6c8798';ctx.fillText(number(maxM*(1-k/4),1),pad.l-12,yy+5);}ctx.textAlign='center';for(var j=0;j<=5;j++){var tt=maxT*j/5,xx=x(tt);ctx.fillStyle='#7894a5';ctx.fillText(number(tt,0),xx,h-20);}
 ctx.textAlign='left';ctx.font='16px sans-serif';ctx.fillStyle='#547b90';ctx.fillText('剩余食盐 / 克（模型）',15,22);ctx.textAlign='right';ctx.fillText('模拟时间 / 秒',w-20,h-4);
 r.configs.forEach(function(c,i){ctx.strokeStyle=colors[i];ctx.lineWidth=3;ctx.beginPath();r.samples.forEach(function(s,k){if(s.m[i]==null)return;if(k===0)ctx.moveTo(x(s.t),y(s.m[i]));else ctx.lineTo(x(s.t),y(s.m[i]));});ctx.stroke();var yy=y(r.cups[i].remaining),xx=x(r.time);ctx.beginPath();ctx.arc(xx,yy,4.5,0,6.283);ctx.fillStyle=colors[i];ctx.fill();ctx.textAlign='left';ctx.font='bold 17px sans-serif';ctx.fillText(letters[i]+'杯',270+i*88,22);});}
function records(tab){viewedRecord=null;app.recordTab=tab||'current';var e=exp();pauseForModal();var b='<div class="records-top"><div class="mini-seg"><button data-action="records-current" class="'+(app.recordTab==='current'?'selected':'')+'">本次对比</button><button data-action="records-history" class="'+(app.recordTab==='history'?'selected':'')+'">历史记录 '+app.records.length+'</button></div><p>模型值与实测值分开记录，不混作一组证据。</p></div>';
