<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>岩石课堂浏览器验证</title><style>body{margin:0;overflow-x:hidden;background:#e8eee7;color:#244a3d;font:15px system-ui,sans-serif}header{padding:10px 14px;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:9px 14px;font:inherit;cursor:pointer}#stage{position:relative;margin:12px;transform-origin:top left}iframe{border:1px solid #aabdab;transform-origin:top left;background:#fff}#results{white-space:pre-wrap;background:#fff;padding:14px;font-size:14px;max-height:260px;overflow:auto}#status{font-weight:bold}</style></head><body><header><strong>岩石课堂 · 验证台</strong><button id="run">运行检查</button><button data-size="1366,768">1366×768</button><button data-size="1024,768">1024×768</button><button data-size="1920,1080">1920×1080</button><button data-size="390,844">390×844</button><span id="status">等待运行</span></header><pre id="results"></pre><div id="stage"><iframe id="lesson" title="岩石课堂" src="index.html?v=37f887"></iframe></div><script>
const frame=document.getElementById('lesson'),results=document.getElementById('results'),status=document.getElementById('status');let log=[],errors=[],backup=null;
function fit(w,h){frame.style.width=w+'px';frame.style.height=h+'px';let s=Math.min(1,(innerWidth-28)/w);frame.style.transform='scale('+s+')';document.getElementById('stage').style.height=(h*s)+'px';}
fit(1366,768);document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{let [w,h]=b.dataset.size.split(',').map(Number);fit(w,h);});
const pause=ms=>new Promise(r=>setTimeout(()=>{try{const a=w().RockApp;if(a&&a.flush)a.flush();}catch(e){}r();},ms));
const check=(name,value,detail='')=>{log.push((value?'PASS ':'FAIL ')+name+(detail?' | '+detail:''));if(!value)errors.push(name);results.textContent=log.join('\n');};
const waitUntil=async(fn)=>{for(let i=0;i<50;i++){if(fn())return true;await pause(60);}return false;};
function q(id){return frame.contentDocument.getElementById(id);}function w(){return frame.contentWindow;}
function pe(el,type,x,y){el.dispatchEvent(new (w().PointerEvent)(type,{bubbles:true,clientX:x,clientY:y,pointerId:91,pointerType:'touch',buttons:type==='pointerup'?0:1,isPrimary:true}));}
function canvasPoint(x,y){let r=q('scratchCanvas').getBoundingClientRect(),v=w().RockApp.scratch.view;return [r.left+(x-v.x)/v.w*r.width,r.top+(y-v.y)/v.h*r.height];}
function stroke(points){let c=q('scratchCanvas');c.setPointerCapture=()=>{};c.hasPointerCapture=()=>true;let p=canvasPoint(points[0].x,points[0].y);pe(c,'pointerdown',...p);points.slice(1).forEach(pt=>{let next=canvasPoint(pt.x,pt.y);pe(c,'pointermove',...next);});pe(c,'pointerup',...canvasPoint(points[points.length-1].x,points[points.length-1].y));}
async function run(){document.getElementById('run').disabled=true;log=[];errors=[];status.textContent='检查中';await waitUntil(()=>w().RockApp);let app=w().RockApp,key='AIHTML_5_4_4_rocks_v1';backup=w().localStorage.getItem(key);app.state.records=[];app.state.selected=[];try{
 check('网页初始化与岩石模型',!!app&&!!w().RockEngine);
 for(const kind of ['granite','sandstone','marble']){frame.contentDocument.querySelector('[data-kind="'+kind+'"]').click();await pause(100);check(kind+'切换及结构命中',app.state.kind===kind&&app.getModel(kind,1).grains.length>20);}
 frame.contentDocument.querySelector('[data-kind="granite"]').click();q('newSpecimen').click();await pause(100);check('换样本保留三类选择',app.state.serial.granite===2);q('boundariesBtn').click();q('mineralBtn').click();await pause(100);check('边界与矿物提示可开关',app.state.boundaries&&app.state.reveal&&q('mineralLabel').textContent.includes('此示例'));
 for(const z of [2,8]){q('zoomRange').value=z;q('zoomRange').dispatchEvent(new Event('input',{bubbles:true}));await pause(80);check('屏幕缩放边界 '+z,app.state.zoom===z&&q('zoomText').textContent.includes(z+'×'));}
 let before={...app.state.focus},r=q('rockCanvas').getBoundingClientRect();pe(q('rockCanvas'),'pointerdown',r.left+r.width*.66,r.top+r.height*.4);pe(q('rockCanvas'),'pointerup',r.left+r.width*.66,r.top+r.height*.4);await pause(100);check('触控改变取样位置',Math.abs(app.state.focus.x-before.x)>10);
 q('captureObserve').click();check('观察截图来源标记',app.state.records.length===1&&app.state.records[0].source==='model');
 frame.contentDocument.querySelector('[data-kind="sandstone"]').click();q('captureObserve').click();check('不同岩石对照记录',app.state.records.length===2);
 q('tab-scratch').click();await pause(150);app.clearScratch();const pts=app.scratch.model.representativePoints;let path=[{x:pts.biotite.x-6,y:pts.biotite.y},pts.biotite,pts.feldspar,pts.quartz];
 for(const tool of ['nail','copper','knife']){app.clearScratch();frame.contentDocument.querySelector('[data-tool="'+tool+'"]').click();stroke(path);await pause(80);let p=app.scratch.strokes.flatMap(s=>s.points);let cut=p.filter(p=>p.cut),types=[...new Set(cut.map(p=>p.mineral))];check(tool+'按矿物判定刻痕',tool==='nail'?cut.length===0:cut.length>0&&types.length===1&&types[0]==='biotite',types.join(','));}
 let count=app.state.records.length;q('captureScratch').click();await pause(50);check('未擦拭不能伪造前后对照',app.state.records.length===count);
 q('wipeAll').click();await pause(80);check('擦拭清除附着痕且保留沟痕',app.scratch.hasWiped&&app.scratch.beforeState.length===1&&app.scratch.strokes[0].points.every(p=>p.erased)&&app.scratch.strokes[0].points.some(p=>p.cut));
 const beforeSnapshot=JSON.stringify(app.scratch.beforeState);frame.contentDocument.querySelector('[data-tool="knife"]').click();stroke([pts.quartz]);await pause(50);check('无效点击保留已有前后证据',app.scratch.hasWiped&&JSON.stringify(app.scratch.beforeState)===beforeSnapshot);
 fit(1024,768);await pause(180);q('scratchBoundaryBtn').click();q('captureScratch').click();await waitUntil(()=>app.state.records.length===count+1);check('换视口与边界后仍能同区记录',app.state.records.length===count+1&&app.state.records[count].type==='scratch');
 q('undoStroke').click();await pause(80);check('撤销和空状态按钮',app.scratch.strokes.length===0&&!app.scratch.hasWiped&&q('captureScratch').disabled);
 frame.contentDocument.querySelector('[data-tool="knife"]').click();stroke(path);q('eraserBtn').click();let c=q('scratchCanvas'),rect=c.getBoundingClientRect();pe(c,'pointerdown',rect.left+2,rect.top+2);pe(c,'pointerup',rect.left+2,rect.top+2);check('空白擦拭不建立错误快照',!app.scratch.beforeState);frame.contentDocument.querySelector('[data-tool="copper"]').click();stroke(path);q('wipeAll').click();check('新增笔画纳入同一次擦前状态',app.scratch.beforeState.length===2);q('undoStroke').click();check('撤销一笔保留另一笔已擦拭状态',app.scratch.strokes.length===1&&app.scratch.hasWiped&&app.scratch.strokes[0].points.every(p=>p.erased)&&app.scratch.beforeState.length===1);
 app.clearScratch();frame.contentDocument.querySelector('[data-tool="knife"]').click();stroke(path);q('eraserBtn').click();stroke([{x:pts.biotite.x-8,y:pts.biotite.y},{x:pts.biotite.x+8,y:pts.biotite.y}]);check('触控橡皮擦局部反馈',app.scratch.hasWiped&&app.scratch.strokes[0].points.some(p=>p.erased)&&app.scratch.strokes[0].points.some(p=>!p.erased));
 q('resetScratch').click();check('复位清空本次刻画',app.scratch.strokes.length===0&&!app.scratch.beforeState);
 q('tab-observe').click();await pause(100);const testCanvas=document.createElement('canvas');testCanvas.width=1000;testCanvas.height=3000;let tc=testCanvas.getContext('2d');tc.fillStyle='#ad7951';tc.fillRect(0,0,1000,3000);tc.fillStyle='#252e29';tc.fillRect(400,1350,180,120);let blob=await new Promise(res=>testCanvas.toBlob(res,'image/png'));let dt=new (w().DataTransfer)();dt.items.add(new (w().File)([blob],'课堂测试照片.png',{type:'image/png'}));q('photoInput').files=dt.files;q('photoInput').dispatchEvent(new Event('change',{bubbles:true}));await waitUntil(()=>!!app.state.photo);check('本机照片导入与来源标签',!!app.state.photo&&q('sourceBadge').textContent==='实物照片');check('照片不识别矿物或推算硬度',q('mineralBtn').disabled&&q('toScratch').disabled&&q('boundariesBtn').disabled);check('竖拍照片保留可用原图细节',app.state.photo.canvas.width===3000&&app.state.photo.canvas.height===2160);q('captureObserve').click();check('实物与模型证据分开标记',app.state.records[app.state.records.length-1].source==='photo');
 q('evidenceBtn').click();await pause(80);check('两条证据并排显示',!q('evidenceModal').hidden&&q('compareGrid').querySelectorAll('.compare-card').length===2);let note=q('compareGrid').querySelector('textarea');note.value='我看到擦后有些线消失了。';note.dispatchEvent(new Event('input',{bubbles:true}));q('compareGrid').querySelector('.tag').click();check('学生描述与选择持久保存',JSON.parse(w().localStorage.getItem(key)).some(r=>r.note.includes('有些线')&&r.tags.length>0));q('exportPng').click();await waitUntil(()=>!q('exportModal').hidden);check('对照PNG实际生成',q('exportImage').src.startsWith('data:image/png;base64,')&&q('exportImage').naturalWidth===1600);q('exportModal').querySelector('[data-close]').click();q('evidenceModal').querySelector('[data-close]').click();
 for(const size of [[1366,768],[1024,768],[1920,1080],[390,844]]){fit(...size);await pause(140);for(const page of ['observe','scratch']){q('tab-'+page).click();await pause(90);const d=frame.contentDocument,vw=w().innerWidth,vh=w().innerHeight;check(size.join('×')+' '+page+' 无横向溢出',d.documentElement.scrollWidth<=vw+1,'scroll='+d.documentElement.scrollWidth);if(vw>=800){let controls=page==='observe'?['captureObserve','toScratch','zoomRange']:['captureScratch','resetScratch','scratchCanvas'];check(size.join('×')+' '+page+' 核心操作一屏内',controls.every(id=>{let r=q(id).getBoundingClientRect();return r.top>=0&&r.bottom<=vh+1&&r.left>=0&&r.right<=vw+1;}));if(page==='scratch')check(size.join('×')+' 工具区内容无溢出',Array.from(d.querySelectorAll('.tool-card')).every(e=>e.scrollHeight<=e.clientHeight+2));}}}
 fit(1366,768);q('tab-observe').click();await pause(100);check('运行后恢复观察界面',q('page-scratch').hidden&&!q('page-observe').hidden);
 }catch(e){check('异常',false,e.stack||String(e));}finally{if(backup===null)w().localStorage.removeItem(key);else w().localStorage.setItem(key,backup);status.textContent=(errors.length?'存在问题':'全部通过')+' · '+log.filter(x=>x.startsWith('PASS')).length+' / '+log.length;document.getElementById('run').disabled=false;document.body.dataset.result=errors.length?'fail':'pass';results.textContent=log.join('\n');}}
document.getElementById('run').onclick=run;
</script></body></html>
