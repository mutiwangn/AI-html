var p=0,playing=false,current=-1,lastTime=0,focusDOM={},routeNodes=route.map(function(_,i){var el=$('route-'+i);return{el:el,length:el.getTotalLength()};});

function pointAt(v){var i=stationAt(v),u=(v-intervals[i])/(intervals[i+1]-intervals[i]);return routeNodes[i].el.getPointAtLength(Math.max(0,Math.min(1,u))*routeNodes[i].length);}

function animateFocus(i,u){var phase=u*Math.PI*10;
 if(i===0){var jaw=(1-Math.cos(phase))*18;tr(focusDOM['top-teeth'],0,jaw*.65);tr(focusDOM['bottom-teeth'],0,-jaw*.8);nodes('mouth-crumb').forEach(function(el,j){var a=j*2.399+u*3;var spread=18+u*70;el.setAttribute('cx',380+Math.cos(a)*spread*(.5+j%3*.2));el.setAttribute('cy',214+Math.sin(a)*spread*.36);el.setAttribute('r',14-u*8);});nodes('saliva-drop').forEach(function(el,j){var v=(u*3+j/7)%1;el.setAttribute('cx',243+j*44);el.setAttribute('cy',138+v*113);el.setAttribute('opacity',Math.sin(v*Math.PI)*.7);});
 }else if(i===1){var foodX=175+u*400,waveX=foodX-38,top='',bottom='';for(var x=70;x<=690;x+=10){var g=Math.exp(-Math.pow((x-waveX)/39,2));top+=(x===70?'M':'L')+x+' '+(155+g*38).toFixed(1)+' ';bottom+=(x===70?'M':'L')+x+' '+(270-g*32).toFixed(1)+' ';}focusDOM['tube-top'].setAttribute('d',top+'L690 115H70Z');focusDOM['tube-bottom'].setAttribute('d',bottom+'L690 310H70Z');nodes('esophagus-crumb').forEach(function(el,j){el.setAttribute('cx',foodX+Math.cos(j*2.4)*18);el.setAttribute('cy',213+Math.sin(j*2.4)*18);});tr(focusDOM['contraction-hint'],waveX,107);

 }else if(i===3){nodes('small-leftover').forEach(function(el,j){el.setAttribute('cx',80+((u*1.2+j/6)%1)*590);el.setAttribute('cy',127+j%3*13);});nodes('nutrient').forEach(function(el,j){var t=(u*1.5+j/20)%1,x0=125+(j%8)*70,y;if(t<.35){y=124+t*85;}else if(t<.8){y=154+(t-.35)/.45*175;}else{y=329;x0+=(t-.8)*240;}el.setAttribute('cx',x0);el.setAttribute('cy',y);el.setAttribute('opacity',Math.min(1,t*8,(1-t)*10));});
 }else if(i===4){tr(focusDOM['colon-residue'],184+u*365,186,' scale('+(1-u*.3).toFixed(3)+' '+(1-u*.28).toFixed(3)+')');nodes('water-drop').forEach(function(el,j){var t=(u*1.2+j/14)%1;el.setAttribute('cx',140+j%7*78);el.setAttribute('cy',j%2===0?170-t*145:206+t*135);el.setAttribute('opacity',Math.sin(t*Math.PI)*.8);el.setAttribute('r',7-u*2);});
 }else if(i===5){tr(focusDOM['stool-exit'],358,90+u*260);focusDOM['stool-exit'].setAttribute('opacity',u>.94?(1-u)/.06:1);}

function renderJourney(){var i=stationAt(p),u=(p-intervals[i])/(intervals[i+1]-intervals[i]);if(i!==current)selectStage(i);$('journey-progress').value=Math.round(p*1000);$('journey-progress').setAttribute('aria-valuetext',organs[i].name+'，'+Math.round(u*100)+'%');var pt=pointAt(p);tr($('food-marker'),pt.x,pt.y);$('food-marker').setAttribute('opacity',p>.99?(1-p)*100:1);$('food-shape').setAttribute('transform','scale('+(i===0?.95:i===1?.8:i===2?.65:i===3?.5:.63)+')');var trail=$('food-trail').children;for(var j=0;j<trail.length;j++){var q=pointAt(Math.max(0,p-(3-j)*.004));trail[j].setAttribute('cx',q.x);trail[j].setAttribute('cy',q.y);trail[j].setAttribute('opacity',p<.01?0:(j+1)*.2);}$('exit-label').setAttribute('opacity',p>.985?1:0);animateFocus(i,Math.max(0,Math.min(1,u)));}

var foodDragging=null,foodGhost=null;
bindPointer($('feed-object'),function(e){if(e.button!==undefined&&e.button!==0)return;var src=e.touches?e.touches[0]:e;foodDragging={x:src.clientX,y:src.clientY,moved:false,id:e.pointerId};if(e.cancelable)e.preventDefault();if(this.setPointerCapture&&e.pointerId!==undefined)this.setPointerCapture(e.pointerId);},function(e){if(!foodDragging)return;var src=e.touches?e.touches[0]:e;if(Math.abs(src.clientX-foodDragging.x)+Math.abs(src.clientY-foodDragging.y)>8){foodDragging.moved=true;if(!foodGhost){foodGhost=document.createElement('div');foodGhost.className='ghost-food';foodGhost.innerHTML=$('feed-object').querySelector('svg').outerHTML;document.body.appendChild(foodGhost);}foodGhost.style.left=(src.clientX-42)+'px';foodGhost.style.top=(src.clientY-42)+'px';}},function(e){if(!foodDragging)return;if(!foodDragging.moved)feed();else{var pt=getSVGPoint($('travel-svg'),e);if(Math.abs(pt.x-315)<90&&Math.abs(pt.y-137)<95)feed();else toast('把这一口食物放到嘴边。');}if(foodGhost)foodGhost.remove();foodGhost=null;foodDragging=null;});
